<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">

<title>Quadrivio</title>

<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#16181D;--mute:#6A7280;--line:rgba(20,23,28,.08);--glass:rgba(255,255,255,.72);--sh:0 1px 2px rgba(20,23,28,.05),0 18px 40px -18px rgba(20,23,28,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0B0E;--card:#17191E;--ink:#F3F4F7;--mute:#9BA3B0;--line:rgba(255,255,255,.09);--glass:rgba(28,30,36,.72);--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0B0E;--card:#17191E;--ink:#F3F4F7;--mute:#9BA3B0;--line:rgba(255,255,255,.09);--glass:rgba(28,30,36,.72);--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.8);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Schibsted Grotesk",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(60vmax 40vmax at 8% -6%,rgba(140,47,57,.16),transparent 60%),radial-gradient(55vmax 40vmax at 100% 8%,rgba(58,95,207,.16),transparent 60%),radial-gradient(60vmax 40vmax at 50% 108%,rgba(123,92,250,.14),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:10}
main{max-width:1000px;margin:0 auto;padding:30px 20px calc(48px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.logo{width:44px;height:44px;border-radius:13px;padding:6px;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:3px;background:var(--card);box-shadow:var(--sh)}
.logo i{border-radius:5px}
h1{font-size:clamp(40px,10vw,68px);line-height:1;letter-spacing:-.035em;font-weight:800;margin:0}
.sub{margin:0 0 30px;color:var(--mute);font-size:18px;line-height:1.4;max-width:30ch}
.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr;gap:22px}}
.card{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border-radius:34px;padding:10px;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.2,.9,.3,1.25),box-shadow .35s;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
@media(hover:hover){.card:hover{transform:translateY(-3px)}}
.card:active{transform:scale(.975)}
.card:focus-visible{outline:3px solid #2F6BFF;outline-offset:3px}
.art{aspect-ratio:16/10;border-radius:26px;overflow:hidden;position:relative}
.art svg{width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.35);pointer-events:none}
.meta{padding:16px 12px 10px}
.meta h2{margin:0 0 5px;font-size:23px;font-weight:700;letter-spacing:-.02em}
.meta p{margin:0;color:var(--mute);font-size:15.5px;line-height:1.45}
#view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:20}
#view.on{display:flex;animation:open .32s cubic-bezier(.2,.9,.3,1)}
@keyframes open{from{opacity:0;transform:scale(.97)}}
#stage{flex:1;position:relative;min-height:0;margin-top:env(safe-area-inset-top,0px)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
#stage iframe.act{visibility:visible}
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(140%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.1),opacity .25s}
#tabs.on{transform:none;opacity:1;pointer-events:auto}
#pill{display:flex;gap:2px;padding:5px;width:100%;max-width:460px;border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.tab{all:unset;box-sizing:border-box;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:24px;cursor:pointer;color:var(--mute);font-size:11px;font-weight:700;transition:background .25s,color .25s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.act{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tab:focus-visible{outline:3px solid #2F6BFF}
#pill{background:color-mix(in srgb,var(--card) 88%,transparent)}
#stage{margin-bottom:env(safe-area-inset-bottom,0px)}
#scrim{position:absolute;inset:0;z-index:3;display:none}#scrim.on{display:block}
#fab{all:unset;position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;margin-left:-22px;border-radius:50%;display:grid;place-items:center;z-index:4;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--sh),inset 0 0 0 1px var(--line);transition:transform .35s cubic-bezier(.2,.9,.3,1.25),opacity .2s}
#fab:active{transform:scale(.92)}
#fab.hide{opacity:0;transform:scale(.6);pointer-events:none}
#fab:focus-visible{outline:3px solid #2F6BFF}
#fab svg{width:22px;height:22px;fill:currentColor}
@media(prefers-reduced-motion:reduce){.card,#view.on,#sheet.on{animation:none}.card{transition:none}}
</style></head><body>

lexicon:{t:"Lexicon Latinum",h:"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\n.gram[hidden]{display:none}\n.hbtns{display:flex;gap:8px;align-items:center}\n.pill{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--font-body)}\n#gramBtn{display:grid;color:var(--p)}\n.gram{position:fixed;inset:0;z-index:95;overflow:auto;background:var(--bg);padding:max(16px,env(safe-area-inset-top,0px)) 16px 40px;max-width:720px;margin:auto}\n.gram .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}\n.gram .chip.on{background:var(--c);color:#fff;border-color:var(--c)}\n.gram details{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px 16px;margin-bottom:10px}\n.gram summary{font:700 18px var(--font-display);cursor:pointer}\n.gram .gb{margin-top:10px;font-size:15px;line-height:1.55;color:var(--ink)}.gram .gb p{margin:6px 0}.gram .gb ul{margin:6px 0;padding-left:20px}\n\n\n.gram .tbl.gt td:first-child{white-space:normal;width:auto;color:var(--ink);font-size:15px;font-weight:600}.gram .tbl.gt td{min-width:70px}.gram .box{margin:8px 0}.gram .gb .cap{padding-top:6px}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Lexicon Latinum\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap\">\n\u003cstyle>\n/* Layout: colonna unica centrata; ricerca grande in alto, schede colorate per categoria grammaticale */\n:root{\n  --bg:#f4f5fb; --surface:#ffffff; --ink:#181a29; --muted:#656d88; --line:#e2e5f0;\n  --n:#e5483a; --n-bg:#fde8e5;\n  --a:#0f9a60; --a-bg:#dcf5e8;\n  --v:#2563eb; --v-bg:#e0eaff;\n  --p:#7a49e8; --p-bg:#ece4ff;\n  --m:#b87300; --m-bg:#ffefcc;\n  --hit:#fff0a8; --hit-ink:#2f2400;\n  --font-display:'Bricolage Grotesque', ui-rounded, 'Avenir Next', system-ui, sans-serif;\n  --font-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#10111a; --surface:#191b29; --ink:#eef0fb; --muted:#9aa2bf; --line:#2a2d43;\n    --n:#ff8274; --n-bg:#3b2021;\n    --a:#43d597; --a-bg:#15332a;\n    --v:#7ba6ff; --v-bg:#1b2849;\n    --p:#b99cff; --p-bg:#2b2248;\n    --m:#ffc247; --m-bg:#392d12;\n    --hit:#5a4a08; --hit-ink:#fff1b3;\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#10111a; --surface:#191b29; --ink:#eef0fb; --muted:#9aa2bf; --line:#2a2d43;\n  --n:#ff8274; --n-bg:#3b2021;\n  --a:#43d597; --a-bg:#15332a;\n  --v:#7ba6ff; --v-bg:#1b2849;\n  --p:#b99cff; --p-bg:#2b2248;\n  --m:#ffc247; --m-bg:#392d12;\n  --hit:#5a4a08; --hit-ink:#fff1b3;\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{min-height:100%}\nbody{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);padding-inline:16px;padding-block:20px 56px;-webkit-text-size-adjust:100%}\n.app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}\nbutton{font:inherit;color:inherit;cursor:pointer}\na{color:inherit}\n:focus-visible{outline:3px solid var(--v);outline-offset:2px;border-radius:8px}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.brand{display:flex;align-items:center;gap:12px}\n.dots{display:grid;grid-template-columns:repeat(3,9px);gap:3px}\n.dots i{width:9px;height:9px;border-radius:50%}\n.dots i:nth-child(1){background:var(--n)} .dots i:nth-child(2){background:var(--m)} .dots i:nth-child(3){background:var(--a)}\n.dots i:nth-child(4){background:var(--v)} .dots i:nth-child(5){background:var(--p)}\n.wm{font:700 26px/1 var(--font-display);letter-spacing:-.02em}\n.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}\n.icon-btn[aria-expanded=\"true\"]{color:var(--v);border-color:var(--v)}\n.icon-btn svg{width:22px;height:22px}\n\n.ring{padding:2px;border-radius:999px;background:var(--line);transition:background .25s}\n.ring:focus-within{background:linear-gradient(100deg,var(--n),var(--m),var(--a),var(--v),var(--p))}\n.field{display:flex;align-items:center;gap:10px;height:58px;padding-inline:20px 8px;border-radius:999px;background:var(--surface)}\n.field svg{width:22px;height:22px;flex:none;color:var(--muted)}\n.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 19px var(--font-body);outline:0}\n.field input::placeholder{color:var(--muted);font-weight:400}\n.clear{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}\n.clear svg{width:18px;height:18px}\n.count{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px;font-variant-numeric:tabular-nums}\n\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid transparent;background:var(--cb,var(--line));color:var(--c,var(--ink));padding:6px 12px;border-radius:999px;font-size:15px;font-weight:600;line-height:1.3}\n.chip small{font-weight:400;opacity:.8;font-size:13px}\n.chip.plain{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.pos-n{--c:var(--n);--cb:var(--n-bg)} .pos-a{--c:var(--a);--cb:var(--a-bg)} .pos-v{--c:var(--v);--cb:var(--v-bg)}\n.pos-p{--c:var(--p);--cb:var(--p-bg)} .pos-m{--c:var(--m);--cb:var(--m-bg)}\n\n.panel-box,.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}\n.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}\n.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.link-btn{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 8px;text-decoration:underline;text-underline-offset:3px}\n.empty-note{color:var(--muted);font-size:15px}\n\n.try{display:flex;flex-direction:column;gap:10px}\n\n#out{display:flex;flex-direction:column;gap:16px}\n.card{display:block;animation:rise .22s ease both;padding:0}\n.card>summary{list-style:none;display:flex;flex-direction:column;gap:14px;padding:20px;cursor:pointer;border-radius:22px;-webkit-tap-highlight-color:transparent}\n.card>summary::-webkit-details-marker{display:none}\n.card>summary:hover .chev{background:var(--cb)}\n.c-body{display:flex;flex-direction:column;gap:16px;padding:0 20px 20px;margin-top:-2px;border-top:1px solid var(--line);padding-top:18px}\n.chev{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:background .2s}\n.chev::after{content:\"\";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}\n.card[open]>summary .chev::after{transform:translateY(2px) rotate(-135deg)}\n.card[open]>summary{padding-bottom:16px}\n.intro{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.intro b{font-weight:600;color:var(--c)}\n.uses{display:flex;flex-direction:column;gap:10px}\n.use{display:grid;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid var(--line)}\n.u-l{font-weight:600;font-size:15px}\n.u-e{font-size:15px;color:var(--muted)}\n.u-e i{color:var(--ink);font-style:italic}\n@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){.card{animation:none}.ring{transition:none}}\n.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}\n.c-side{display:flex;align-items:center;gap:10px;flex:none}\n.lemma{font:700 38px/1.05 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere;margin:0}\n.badge{display:inline-flex;align-items:center;gap:7px;background:var(--cb);color:var(--c);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}\n.badge::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--c)}\n.sub{color:var(--muted);font-size:15px;margin-top:6px}\n.tr{font-size:20px;line-height:1.4;margin:0}\n.tr span{display:block}.tr span+span{margin-top:2px;font-size:.92em;color:var(--muted)}\n.found{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--cb);color:var(--c)}\n.found .form{font:700 18px var(--font-display);margin-right:4px;overflow-wrap:anywhere}\n.found span.an{font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);padding:3px 10px;border-radius:12px}\n.ext{align-self:flex-start;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}\n.ext:hover{color:var(--ink)}\n\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}\n.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}\n.seg button.on{background:var(--c);border-color:var(--c);color:#fff}\n:root[data-theme=\"dark\"] .seg button.on{color:#10111a}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .seg button.on{color:#10111a}}\n.panel[hidden]{display:none}\n\n.box{border:1px solid var(--line);border-radius:14px;overflow-x:auto;min-width:0}\n.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}\ntable.tbl{border-collapse:collapse;width:100%;font-size:15px;min-width:min-content}\n.tbl th{background:var(--cb);color:var(--c);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 12px;white-space:nowrap}\n.tbl td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}\n.tbl td:first-child{color:var(--muted);font-size:13px;white-space:nowrap;width:1%}\n.tbl td.e{color:var(--muted)}\n.tbl td.hit{background:var(--hit);color:var(--hit-ink)}\n.tbl b{font-weight:700}\n.tbl td>span.f{white-space:nowrap}\n.sl{color:var(--muted)}\n.hit .sl{color:inherit;opacity:.6}\n.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}\n.grid2>div,.tgrid>div{min-width:0}\n.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}\n.stack{display:flex;flex-direction:column;gap:14px}\n.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;font-size:15px}\n.kv>span{color:var(--muted)}\n.kv>.hit{background:var(--hit);color:var(--hit-ink);border-radius:6px;padding:0 6px;font-weight:700}\ndetails:not(.card){border:1px solid var(--line);border-radius:14px;padding:0 14px}\ndetails:not(.card)>summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px}\ndetails:not(.card)>summary::-webkit-details-marker{display:none}\ndetails:not(.card)>summary::after{content:\"\";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:4px}\ndetails:not(.card)[open]>summary::after{transform:rotate(-135deg)}\ndetails:not(.card)>div{padding-bottom:14px}\n.sum-l{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}\n\n.nores{display:flex;flex-direction:column;gap:14px;align-items:flex-start}\n.nores h2{font:700 24px/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}\n@media (max-width:480px){\n  body{padding-inline:14px}\n  .card>summary{padding:16px}.c-body{padding:16px 16px 18px}\n  .lemma{font-size:32px}\n  .tbl{font-size:14px}.tbl th{padding:7px 8px}.tbl td{padding:6px 8px}\n  .tr{font-size:18px}\n  .badge{font-size:12px;padding:4px 10px}\n}\n.loading{color:var(--muted);text-align:center;padding:24px}\n\u003c/style>\n\n\u003cdiv class=\"gram\" id=\"gram\" hidden>\n  \u003cheader class=\"top\">\u003cbutton class=\"pill\" id=\"gramBack\" type=\"button\">← Lexicon\u003c/button>\u003cspan class=\"wm\">Grammatica\u003c/span>\u003c/header>\n  \u003cnav class=\"chips\" id=\"gramTabs\">\u003c/nav>\n  \u003cdiv id=\"gramBody\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"app\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"dots\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"wm\">Lexicon\u003c/span>\u003c/div>\n    \u003cspan class=\"hbtns\">\u003cbutton id=\"gramBtn\" class=\"icon-btn\" type=\"button\" aria-label=\"Grammatica\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z\"/>\u003cpath d=\"M4 21V5M9 8h6\"/>\u003c/svg>\u003c/button>\u003cbutton id=\"histBtn\" class=\"icon-btn\" type=\"button\" aria-label=\"Cronologia\" aria-expanded=\"false\" aria-controls=\"hist\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/svg>\n    \u003c/button>\u003c/span>\n  \u003c/header>\n\n  \u003cform id=\"f\" autocomplete=\"off\" role=\"search\">\n    \u003cdiv class=\"ring\">\u003cdiv class=\"field\">\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"M20 20l-3.5-3.5\"/>\u003c/svg>\n      \u003cinput id=\"q\" type=\"text\" placeholder=\"Una forma latina qualsiasi\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\" enterkeyhint=\"search\" aria-label=\"Cerca una parola latina\" disabled>\n      \u003cbutton id=\"clear\" class=\"clear\" type=\"button\" aria-label=\"Svuota\" hidden>\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\n      \u003c/button>\n    \u003c/div>\u003c/div>\n  \u003c/form>\n  \u003cdiv class=\"count\" id=\"count\">\u003c/div>\n\n  \u003csection id=\"hist\" class=\"panel-box\" hidden aria-label=\"Cronologia delle ricerche\">\u003c/section>\n  \u003cmain id=\"out\" aria-live=\"polite\">\u003cdiv class=\"loading\">…\u003c/div>\u003c/main>\n\u003c/div>\n\n\u003cscript>\n/* Motore di flessione latina: genera tutte le forme di ogni lemma e costruisce un indice forma -> lemma. */\nvar Latin = (function () {\n  'use strict';\n\n  // ---------- utilità ----------\n  function norm(s) {\n    return String(s).toLowerCase().replace(/æ/g, 'ae').replace(/œ/g, 'oe')\n      .normalize('NFD').replace(/[̀-ͯ]/g, '')\n      .replace(/j/g, 'i').replace(/v/g, 'u').replace(/[^a-z]/g, '');\n  }\n  const CASES = ['nom', 'gen', 'dat', 'acc', 'abl', 'voc'];\n  const GENS = ['m', 'f', 'n'];\n  const arr = (x) => (Array.isArray(x) ? x : [x]);\n  function add(out, tag, f) {\n    if (f == null) return;\n    for (const x of arr(f)) if (x && x !== '-') out.push([tag, x]);\n  }\n  const strip = (s, suf) => (s.endsWith(suf) ? s.slice(0, s.length - suf.length) : s);\n\n  // ---------- sostantivi ----------\n  function nounTable(type, nom, gen, g, fl) {\n    const neut = g === 'n';\n    let S, sg, pl;\n    if (fl.pl) {\n      if (type === 'n1') S = strip(gen, 'arum');\n      else if (type === 'n2') S = strip(gen, 'orum');\n      else if (type === 'n3') S = strip(gen, 'um');\n      else if (type === 'n3i') S = strip(gen, 'ium');\n      else if (type === 'n4') S = strip(gen, 'uum');\n      else S = strip(gen, 'erum');\n    } else {\n      if (type === 'n1') S = strip(gen, 'ae');\n      else if (type === 'n2') S = strip(gen, 'i');\n      else if (type === 'n3' || type === 'n3i') S = strip(gen, 'is');\n      else if (type === 'n4') S = strip(gen, 'us');\n      else S = strip(gen, 'ei');\n    }\n    switch (type) {\n      case 'n1': {\n        const dp = fl.abus ? [S + 'is', S + 'abus'] : S + 'is';\n        sg = [S + 'a', S + 'ae', S + 'ae', S + 'am', S + 'a', S + 'a'];\n        pl = [S + 'ae', S + 'arum', dp, S + 'as', dp, S + 'ae'];\n        break;\n      }\n      case 'n2':\n        if (neut) {\n          sg = [nom, S + 'i', S + 'o', nom, S + 'o', nom];\n          pl = [S + 'a', S + 'orum', S + 'is', S + 'a', S + 'is', S + 'a'];\n        } else {\n          const er = !nom.endsWith('us');\n          const voc = er ? nom : nom.endsWith('ius') ? S : S + 'e';\n          sg = [nom, S + 'i', S + 'o', S + 'um', S + 'o', voc];\n          pl = [S + 'i', S + 'orum', S + 'is', S + 'os', S + 'is', S + 'i'];\n        }\n        break;\n      case 'n3':\n        if (neut) {\n          sg = [nom, S + 'is', S + 'i', nom, S + 'e', nom];\n          pl = [S + 'a', S + 'um', S + 'ibus', S + 'a', S + 'ibus', S + 'a'];\n        } else {\n          sg = [nom, S + 'is', S + 'i', S + 'em', S + 'e', nom];\n          pl = [S + 'es', S + 'um', S + 'ibus', S + 'es', S + 'ibus', S + 'es'];\n        }\n        break;\n      case 'n3i':\n        if (neut) {\n          sg = [nom, S + 'is', S + 'i', nom, S + 'i', nom];\n          pl = [S + 'ia', S + 'ium', S + 'ibus', S + 'ia', S + 'ibus', S + 'ia'];\n        } else {\n          sg = [nom, S + 'is', S + 'i', S + 'em', S + 'e', nom];\n          pl = [S + 'es', S + 'ium', S + 'ibus', [S + 'es', S + 'is'], S + 'ibus', S + 'es'];\n        }\n        break;\n      case 'n4':\n        if (neut) {\n          sg = [nom, S + 'us', S + 'u', nom, S + 'u', nom];\n          pl = [S + 'ua', S + 'uum', S + 'ibus', S + 'ua', S + 'ibus', S + 'ua'];\n        } else {\n          sg = [S + 'us', S + 'us', S + 'ui', S + 'um', S + 'u', S + 'us'];\n          pl = [S + 'us', S + 'uum', S + 'ibus', S + 'us', S + 'ibus', S + 'us'];\n        }\n        break;\n      case 'n5':\n        sg = [S + 'es', S + 'ei', S + 'ei', S + 'em', S + 'e', S + 'es'];\n        pl = [S + 'es', S + 'erum', S + 'ebus', S + 'es', S + 'ebus', S + 'es'];\n        break;\n      default:\n        throw new Error('tipo nome sconosciuto ' + type);\n    }\n    return { s: fl.pl ? [] : sg, p: fl.sg ? [] : pl };\n  }\n\n  // ---------- aggettivi ----------\n  function a12Table(mNom, S, o) {\n    o = o || {};\n    const er = !mNom.endsWith('us');\n    const vocM = o.voc || (er ? mNom : S + 'e');\n    let s, p;\n    if (o.pron) {\n      s = {\n        m: [mNom, S + 'ius', S + 'i', S + 'um', S + 'o', '-'],\n        f: [S + 'a', S + 'ius', S + 'i', S + 'am', S + 'a', '-'],\n        n: [o.nNom || S + 'um', S + 'ius', S + 'i', o.nNom || S + 'um', S + 'o', '-'],\n      };\n    } else {\n      s = {\n        m: [mNom, S + 'i', S + 'o', S + 'um', S + 'o', vocM],\n        f: [S + 'a', S + 'ae', S + 'ae', S + 'am', S + 'a', S + 'a'],\n        n: [S + 'um', S + 'i', S + 'o', S + 'um', S + 'o', S + 'um'],\n      };\n    }\n    p = {\n      m: [S + 'i', S + 'orum', S + 'is', S + 'os', S + 'is', S + 'i'],\n      f: [S + 'ae', S + 'arum', S + 'is', S + 'as', S + 'is', S + 'ae'],\n      n: [S + 'a', S + 'orum', S + 'is', S + 'a', S + 'is', S + 'a'],\n    };\n    return { s, p };\n  }\n  // tre uscite / due uscite / una uscita (classe II)\n  function a3Table(kind, o) {\n    const S = o.S;\n    const ablI = o.abl || S + 'i' rn out;\n    }\n    if (t === 'xn' || t === 'xp') return explicitNoun(L);\n    if (t === 'x3') return explicitAdj(L);\n    if (t === 'a12' || t === 'a12p' || t === 'a3' || t === 'a3c') return adjectiveForms(L);\n    if (t === 'i') return indeclForms(L);\n    return verbForms(L);\n  }\n\n  // ---------- lessico ----------\n  let lemmas = [];\n  let index = new Map();\n  let disp = new Map();\n\n  function parseLine(line, id) {\n    const bar = line.indexOf('|');\n    const bar2 = line.indexOf('|', bar + 1);\n    const type = line.slice(0, bar).trim();\n    const parts = line.slice(bar + 1, bar2).split(',').map((s) => s.trim()).filter((s) => s.length);\n    const tail = line.slice(bar2 + 1).split('|');\n    const it = tail[0].trim();\n    const L = { id, type, p: parts.slice(), it, fl: {}, uso: tail[1] ? tail[1].split(' ¦ ').map((x) => x.trim()).filter(Boolean) : [] };\n    // opzioni \"chiave=valore\" e flag in coda\n    const core = [];\n    for (const x of parts) {\n      let m;\n      if ((m = /^(cmp|sup|adv|voc|perf)=(.*)$/.exec(x))) {\n        if (m[1] === 'perf') L.perf = m[2];\n        else L.fl[m[1]] = m[2];\n      } else if (x === '-' && /^a/.test(type)) L.fl.deg = false;\n      else if (x === '+') L.fl.plus = true;\n      else if (x === 'sg' || x === 'pl' || x === 'abus' || x === 'intr') L.fl[x] = true;\n      else core.push(x);\n    }\n    L.p = core;\n    const t = type;\n    if (/^[vds][0-9]/.test(t) && t !== 'vsum') {\n      // verbi regolari: p = [1s, inf, perf, sup] oppure [1s, inf, \"locutus sum\"]\n      if (VTYPES[t] && (VTYPES[t].dep || VTYPES[t].semi)) {\n        const pp = core[2] || '';\n        L.ptcDep = pp.replace(/\\s+sum$/, '');\n      } else {\n        L.perf = core[2] && core[2] !== '-' ? strip(core[2], 'i') : null;\n        L.sup = core[3] && core[3] !== '-' ? core[3] : null;\n      }\n    } else if (/^v(sum|pos|eo|fer|vol|nol|mal|fio|perf)/.test(t) || t === 'vsum') {\n      L.perf = core[2] && core[2] !== '-' ? strip(core[2], 'i') : null;\n      L.sup = core[3] && core[3] !== '-' ? core[3] : null;\n      if (t === 'vperf') L.perf = null;\n    }\n    if (t === 'a3') {\n      L.base = { kind: core.length === 3 ? 'a3-3' : core[1] && core[1].endsWith('e') && core[0].endsWith('is') ? 'a3-2' : 'a3-1' };\n    }\n    return L;\n  }\n\n  function posOf(L) {\n    const t = L.type;\n    if (NOUNT.includes(t) || t === 'xn') return 'n';\n    if (t === 'xp') return 'p';\n    if (t === 'x3') return /^pron/.test(L.p[1] || 'pron.') ? 'p' : 'm';\n    if (/^a/.test(t)) return 'a';\n    if (t === 'i') return 'm';\n    return 'v';\n  }\n\n  function load(text) {\n    lemmas = [];\n    index = new Map();\n    disp = new Map();\n    const lines = text.split('\\n');\n    for (const raw of lines) {\n      const line = raw.trim();\n      if (!line || line[0] === '#') continue;\n      const L = parseLine(line, lemmas.length);\n      L.pos = posOf(L);\n      lemmas.push(L);\n    }\n    for (const L of lemmas) {\n      let forms;\n      try { forms = generate(L); } catch (e) { throw new Error('Errore in \"' + L.type + '|' + L.p.join(',') + '\": ' + e.message); }\n      L.n = forms.length;\n      const seen = new Set();\n      for (const [tag, f] of forms) {\n        const k = norm(f);\n        if (!k) continue;\n        const key = L.id + '|' + tag + '|' + k;\n        if (seen.has(key)) continue;\n        seen.add(key);\n        let e = index.get(k);\n        if (!e) { e = []; index.set(k, e); disp.set(k, f); }\n        e.push(L.id + '|' + tag);\n      }\n    }\n    return lemmas.length;\n  }\n\n  function paradigm(L) {\n    if (L._par) return L._par;\n    const m = new Map();\n    for (const [tag, f] of generate(L)) {\n      if (!m.has(tag)) m.set(tag, []);\n      const a = m.get(tag);\n      if (!a.includes(f)) a.push(f);\n    }\n    L._par = m;\n    return m;\n  }\n\n  // ---------- etichette in italiano ----------\n  const CN = { nom: 'nominativo', gen: 'genitivo', dat: 'dativo', acc: 'accusativo', abl: 'ablativo', voc: 'vocativo' };\n  const NN = { s: 'singolare', p: 'plurale' };\n  const GN = { m: 'maschile', f: 'femminile', n: 'neutro' };\n  const TN = { pres: 'presente', impf: 'imperfetto', fut: 'futuro', perf: 'perfetto', plup: 'piuccheperfetto', futp: 'futuro anteriore' };\n  const MN = { ind: 'indicativo', sub: 'congiuntivo', imp: 'imperativo', inf: 'infinito' };\n  const VN = { act: 'attivo', pass: 'passivo', dep: 'deponente' };\n  const PN = { '1s': '1ª sing.', '2s': '2ª sing.', '3s': '3ª sing.', '1p': '1ª plur.', '2p': '2ª plur.', '3p': '3ª plur.' };\n  const DEG = { pos: '', cmp: 'comparativo, ', sup: 'superlativo, ' };\n  const PTN = { pres: 'participio presente', perf: 'participio perfetto', fut: 'participio futuro' };\n\n  function describe(tags) {\n    const groups = new Map(); // chiave -> {head, cases:Set, gens:Set, num}\n    const labels = [];\n    const grp = (key, head, num, c, g) => {\n      let o = groups.get(key);\n      if (!o) { o = { head, num, cases: [], gens: [] }; groups.set(key, o); labels.push(o); }\n      if (!o.cases.includes(c)) o.cases.push(c);\n      if (g && !o.gens.includes(g)) o.gens.push(g);\n    };\n    for (const tag of tags) {\n      const p = tag.split('.');\n      if (p[0] === 'n') grp('n' + p[1], '', p[1], p[2], null);\n      else if (p[0] === 'a') {\n        if (p[1] === 'adv') labels.push('avverbio' + (p[2] === 'cmp' ? ' comparativo' : p[2] === 'sup' ? ' superlativo' : ''));\n        else grp('a' + p[1] + p[3], DEG[p[1]], p[3], p[4], p[2]);\n      } else if (p[0] === 'i') labels.push('invariabile');\n      else if (p[0] === 'v') {\n        const k = p[1];\n        if (k === 'ind' || k === 'sub') labels.push(MN[k] + ' ' + TN[p[3]] + ' ' + VN[p[2]] + ', ' + PN[p[4]]);\n        else if (k === 'imp') labels.push('imperativo ' + VN[p[2]] + ', ' + PN[p[4]]);\n        else if (k === 'inf') labels.push('infinito ' + TN[p[3]] + ' ' + VN[p[2]]);\n        else if (k === 'ptc') grp('ptc' + p[2] + p[4], PTN[p[2]] + ', ', p[4], p[5], p[3]);\n        else if (k === 'gdv') grp('gdv' + p[3], 'gerundivo, ', p[3], p[4], p[2]);\n        else if (k === 'ger') labels.push('gerundio, ' + CN[p[2]]);\n        else if (k === 'sup') labels.push('supino, ' + CN[p[2]]);\n      }\n    }\n    return labels.map((o) => {\n      if (typeof o === 'string') return o;\n      const cs = o.cases.map((c) => CN[c]).join('/');\n      const gs = o.gens.length && o.gens.length \u003c 3 ? ' (' + o.gens.map((g) => GN[g]).join('/') + ')' : '';\n      return o.head + cs + ' ' + NN[o.num] + gs;\n    });\n  }\n\n  // ---------- intestazioni ----------\n  const DECL = { n1: '1ª declinazione', n2: '2ª declinazione', n3: '3ª declinazione', n3i: '3ª declinazione', n4: '4ª declinazione', n5: '5ª declinazione' };\n  const CONJ = { v1: '1ª coniugazione', v2: '2ª coniugazione', v3: '3ª coniugazione', v4: '4ª coniugazione', v3i: '3ª coniugazione (mista)', d1: 'deponente, 1ª', d2: 'deponente, 2ª', d3: 'deponente, 3ª', d4: 'deponente, 4ª', d3i: 'deponente, 3ª mista', s1: 'semideponente', s2: 'semideponente, 2ª', s3: 'semideponente, 3ª' };\n  const GL = { m: 'm.', f: 'f.', n: 'n.', 'c': 'm./f.' };\n  function header(L) {\n    const t = L.type;\n    const o = { title: L.p[0], sub: '', cls: L.pos, chip: '', note: '' };\n    if (NOUNT.includes(t)) {\n      o.chip = 'sost.';\n      o.sub = (L.fl.pl ? L.p[1] : L.p[1]) + ' · ' + (GL[L.p[2]] || '') + (L.fl.pl ? ' plur.' : '');\n      o.note = DECL[t];\n    } else if (t === 'xn') {\n      o.chip = 'sost.';\n      const gm = { deus: 'm.', vis: 'f.', bos: 'm./f.', domus: 'f.', locus: 'm.', iuppiter: 'm.', nemo: 'm./f.' };\n      o.sub = (XN[L.p[0].toLowerCase()][1] !== '-' ? XN[L.p[0].toLowerCase()][1].split('/')[0] + ' · ' : '') + (gm[L.p[0].toLowerCase()] || '');\n      o.note = 'irregolare';\n    } else if (t === 'xp') {\n      o.chip = 'pron.'; o.note = 'pronome personale';\n      const r = XN[L.p[0].toLowerCase()];\n      o.sub = r[1] !== '-' ? r[1].split('/')[0] : r[7].split('/')[0];\n    } else if (t === 'x3' ctere, nexui, nexum|annodare; legare; intrecciare\\n\";\n(function () {\n  'use strict';\n  const $ = (s) => document.querySelector(s);\n  const esc = (s) => String(s).replace(/[&\u003c>\"]/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const norm = Latin.norm;\n  const CASE_LBL = { nom: 'Nom.', gen: 'Gen.', dat: 'Dat.', acc: 'Acc.', abl: 'Abl.', voc: 'Voc.' };\n  const TENSE_LBL = { pres: 'Presente', impf: 'Imperfetto', fut: 'Futuro', perf: 'Perfetto', plup: 'Piuccheperfetto', futp: 'Futuro anteriore' };\n  const VOICE_LBL = { act: 'Attivo', pass: 'Passivo', dep: 'Deponente' };\n  const PRON = ['io', 'tu', 'egli', 'noi', 'voi', 'essi'];\n  const PERS = ['1s', '2s', '3s', '1p', '2p', '3p'];\n  const CLASS = { n: 'pos-n', a: 'pos-a', v: 'pos-v', p: 'pos-p', m: 'pos-m' };\n\n  // ---------- celle e tabelle ----------\n  function cell(par, tag, qk, strong) {\n    const f = par.get(tag);\n    if (!f || !f.length) return '\u003ctd class=\"e\">–\u003c/td>';\n    const hit = qk && f.some((x) => norm(x) === qk);\n    const html = f.map((x) => '\u003cspan class=\"f\">' + (qk && norm(x) === qk ? '\u003cb>' + esc(x) + '\u003c/b>' : esc(x)) + '\u003c/span>').join('\u003cspan class=\"sl\"> / \u003c/span>');\n    return '\u003ctd' + (hit ? ' class=\"hit\"' : '') + '>' + html + '\u003c/td>';\n  }\n  const same = (par, a, b) => (par.get(a) || []).join() === (par.get(b) || []).join();\n\n  function nounTable(par, qk) {\n    const C = Latin.CASES;\n    const nums = ['s', 'p'].filter((n) => C.some((c) => par.has('n.' + n + '.' + c)));\n    const rows = C.filter((c) => nums.some((n) => par.has('n.' + n + '.' + c)))\n      .filter((c) => c !== 'voc' || nums.some((n) => !same(par, 'n.' + n + '.voc', 'n.' + n + '.nom')));\n    let h = '\u003cdiv class=\"box\">\u003ctable class=\"tbl\">\u003ctr>\u003cth>\u003c/th>' + nums.map((n) => '\u003cth>' + (n === 's' ? 'Singolare' : 'Plurale') + '\u003c/th>').join('') + '\u003c/tr>';\n    for (const c of rows) h "' + i + '\"' + (i === active ? '' : ' hidden') + '>' + it.html + '\u003c/div>').join('') + '\u003c/div>';\n  }\n  document.addEventListener('click', (e) => {\n    const b = e.target.closest('.seg button');\n    if (!b) return;\n    const t = b.closest('[data-tabs]');\n    t.querySelectorAll(':scope > .seg button').forEach((x) => x.classList.toggle('on', x === b));\n    t.querySelectorAll(':scope > .panel').forEach((p) => { p.hidden = p.dataset.i !== b.dataset.i; });\n  });\n\n  // ---------- aggettivi ----------\n  function adjBlock(L, par, qk, tags) {\n    const items = [{ label: 'Positivo', html: adjTables(par, 'a.pos', qk), k: 'pos' }];\n    if (par.has('a.cmp.m.s.nom')) items.push({ label: 'Comparativo', html: adjTables(par, 'a.cmp', qk), k: 'cmp' });\n    if (par.has('a.sup.m.s.nom')) items.push({ label: 'Superlativo', html: adjTables(par, 'a.sup', qk), k: 'sup' });\n    if (par.has('a.adv.pos') || par.has('a.adv.cmp')) {\n      items.push({ label: 'Avverbio', k: 'adv', html: kvRows(par, [['Positivo', 'a.adv.pos'], ['Comparativo', 'a.adv.cmp'], ['Superlativo', 'a.adv.sup']], qk) });\n    }\n    if (items.length === 1) return items[0].html;\n    let act = 0;\n    items.forEach((it, i) => { if (tags.some((t) => t.startsWith('a.' + it.k))) act = i; });\n    return tabs(items, act);\n  }\n\n  // ---------- verbi ----------\n  function voicesOf(par, mood) {\n    return ['act', 'pass', 'dep'].filter((v) => { for (const k of par.keys()) if (k.startsWith('v.' + mood + '.' + v + '.')) return true; return false; });\n  }\n  function tenseTable(par, mood, tense, voices, qk) {\n    const vs = voices.filter((v) => PERS.some((p) => par.has('v.' + mood + '.' + v + '.' + tense + '.' + p)));\n    if (!vs.length) return '';\n    let h = '\u003cdiv>\u003cdiv class=\"cap\">' + TENSE_LBL[tense] + '\u003c/div>\u003cdiv class=\"box\">\u003ctable class=\"tbl\">\u003ctr>\u003cth>\u003c/th>' + vs.map((v) => '\u003cth>' + VOICE_LBL[v] + '\u003c/th>').join('') + '\u003c/tr>';\n    PERS.f timeline:{t:"Storia antica e medievale",h:"\u003c!DOCTYPE html>\n\u003chtml lang=\"it\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no\">\n\u003ctitle>Storia antica e medievale: linea del tempo\u003c/title>\n\u003cstyle>\n:root{--r:12px;--bg:#F6F7F9;--surface:#fff;--ink:#17191F;--mute:#555C69;--line:#D9DCE3;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#101216;--surface:#1A1D24;--ink:#EEF0F4;--mute:#A4ABB8;--line:#2C303A}}\n:root[data-theme=\"dark\"]{--bg:#101216;--surface:#1A1D24;--ink:#EEF0F4;--mute:#A4ABB8;--line:#2C303A}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nhtml,body{touch-action:pan-x pan-y}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Bricolage Grotesque\",system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.pre{--c:#EAB308;--cd:#EAB308;--on:#17191F}.civ{--c:#F97316;--cd:#C2410C}.gre{--c:#3B82F6;--cd:#1D4ED8}.per{--c:#06B6D4;--cd:#06B6D4;--on:#17191F}.ell{--c:#8B5CF6;--cd:#6D28D9}.rep{--c:#EF4444;--cd:#B91C1C}.imp{--c:#EC4899;--cd:#BE185D}.reg{--c:#84CC16;--cd:#84CC16;--on:#17191F}.biz{--c:#B45309;--cd:#B45309}.isl{--c:#10B981;--cd:#10B981;--on:#17191F}.fra{--c:#6366F1;--cd:#4338CA}.chi{--c:#D946EF;--cd:#A21CAF}.eur{--c:#14B8A6;--cd:#14B8A6;--on:#17191F}.mon{--c:#64748B;--cd:#475569}\nheader{max-width:680px;margin:0 auto;padding:40px 16px 8px}\n.stripe{display:flex;gap:4px;height:8px;margin-bottom:22px}\n.stripe i{flex:1;border-radius:var(--r);background:var(--c)}\nh1{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 10px}\nheader p{margin:0;color:var(--mute);max-width:54ch}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin-top:12px;border-bottom:1px solid var(--line)}\n.bar::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}\n.chips{max-width:680px;margin:0 auto;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:none;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;padding:6px 13px;border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--bg))}\n.chip.k{--c:var(--ink);--on:var(--bg)}\n.chip[aria-pressed=\"true\"]{background:var(--c);border-color:var(--c);color:var(--on,#17191F)}\n.sep{flex:none;width:1.5px;background:var(--line)}\n.flt{max-width:680px;margin:10px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.88rem;font-weight:600}\n.flt[hidden]{display:none}\n.flt input,.flt select,.flt button{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:6px 8px}\n.flt input{width:62px}\n.flt button{cursor:pointer;font-weight:600}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}\nmain{max-width:680px;margin:0 auto;padding:24px 16px 150px}\n#list{position:relative}\n#svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}\n.card{position:absolute;left:var(--cx);right:0;z-index:1;cursor:pointer;border-radius:var(--r);padding:10px 14px;border:2px dashed color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface))}\n.card.open{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface))}\n.yr{font-weight:800;font-size:1rem;line-height:1.4}\n.tt{font-weight:600;font-size:1.02rem;line-height:1.3}\n.more{display:none}\n.card.open .more{display:block}\n.ds{margin:8px 0 0;color:var(--mute);font-size:.92rem}\n.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}\n.tag{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:var(--r);background:var(--c);color:var(--on,#17191F)}\n.tag.d{background:transparent;color:var(--ink);border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent)}\n.brk{font-size:10px;font-weight:600;fill:var(--mute);stroke:var(--bg);stroke-width:4px;paint-order:stroke}\n\n:root{--glass:rgba(255,255,255,.74);--gbd:var(--line)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--glass:rgba(26,29,36,.78)}}\n:root[data-theme=\"dark\"]{--glass:rgba(26,29,36,.78)}\n#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-start;gap:8px;padding:10px;border-radius:calc(var(--r) + 6px);background:var(--glass);border:1.5px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.16);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);font-family:inherit}\n.dk{all:unset;box-sizing:border-box;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit;font-size:.7rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.15}\n.dk i{font-style:normal;width:46px;height:46px;border-radius:var(--r);display:grid;place-items:center;color:var(--ink);font-size:1.45rem;font-weight:600;background:color-mix(in srgb,var(--ic) 14%,var(--bg));border:1.5px solid color-mix(in srgb,var(--ic) 55%,transparent);transition:transform .15s}\n.dk.fn i{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.dk:active i{transform:scale(.9)}\n.dk[disabled]{opacity:.35;pointer-events:none}\n.dk:focus-visible,.pill:focus-visible,.bdg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}\n.pill{all:unset;box-sizing:border-box;cursor:pointer;height:44px;padding:0 24px;border-radius:var(--r);background:var(--ink);color:var(--bg);font:600 .95rem/44px \"Bricolage Grotesque\",system-ui,sans-serif}\n@keyframes jgl{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}\n.edit .card:not(.off){animation:jgl .26s ease-in-out infinite alternate}\n.edit .card:nth-child(even):not(.off){animation-duration:.31s;animation-direction:alternate-reverse}\n@media (prefers-reduced-motion:reduce){.edit .card{animation:none!important}}\n.card.off{opacity:.4;filter:saturate(.5)}\n.bdg{position:absolute;left:-10px;top:-10px;z-index:3;width:26px;height:26px;padding:0;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font:700 18px/26px \"Bricolage Grotesque\",system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}\n.card.off .bdg{background:#10B981;color:#17191F}\n\n/* stile glass */\n:root{--r:18px;--font:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"SF Pro Display\",system-ui,\"Segoe UI\",sans-serif;--gl:rgba(255,255,255,.52);--glb:rgba(255,255,255,.78);--gsh:0 8px 24px rgba(40,50,90,.12);--hi:inset 0 1px 0 rgba(255,255,255,.9);--s1:rgba(255,255,255,.55);--s2:rgba(255,255,255,.08);--b1:rgba(59,130,246,.26);--b2:rgba(236,72,153,.2);--b3:rgba(234,179,8,.2);--b4:rgba(139,92,246,.24)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--gl:rgba(44,46,58,.5);--glb:rgba(255,255,255,.14);--gsh:0 8px 24px rgba(0,0,0,.4);--hi:inset 0 1px 0 rgba(255,255,255,.14);--s1:rgba(255,255,255,.12);--s2:rgba(255,255,255,.02);--b1:rgba(59,130,246,.22);--b2:rgba(236,72,153,.16);--b3:rgba(234,179,8,.12);--b4:rgba(139,92,246,.22)}}\n:root[data-theme=\"dark\"]{--gl:rgba(44,46,58,.5);--glb:rgba(255,255,255,.14);--gsh:0 8px 24px rgba(0,0,0,.4);--hi:inset 0 1px 0 rgba(255,255,255,.14);--s1:rgba(255,255,255,.12);--s2:rgba(255,255,255,.02);--b1:rgba(59,130,246,.22);--b2:rgba(236,72,153,.16);--b3:rgba(234,179,8,.12);--b4:rgba(139,92,246,.22)}\nbody{font-family:var(--font)}\nbody::before{content:\"\";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 12% 2%,var(--b1),transparent 72%),radial-gradient(50% 34% at 100% 22%,var(--b2),transparent 72%),radial-gradient(60% 40% at 0% 62%,var(--b3),transparent 72%),radial-gradient(55% 40% at 100% 88%,var(--b4),transparent 72%)}\nh1{font-weight:700;letter-spacing:-.035em}\n.stripe i{border-radius:999px}\n.bar,.bar::before{background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}\n.bar{border-bottom:1px solid var(--glb)}\n.chip{border-radius:999px;font-family:var(--font);border:1px solid color-mix(in srgb,var(--c) 38%,var(--glb));background:color-mix(in srgb,var(--c) 14%,var(--gl));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--hi)}\n.chip[aria-pressed=\"true\"]{background:var(--cd,var(--c));border-color:var(--cd,var(--c));box-shadow:var(--hi),0 4px 12px color-mix(in srgb,var(--c) 38%,transparent)}\n.flt{font-size:.9rem}\n.flt input,.flt select{font-family:var(--font);font-size:16px;border-radius:14px;background:var(--gl);border:1px solid var(--glb);box-shadow:var(--hi);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}\n.card{background:linear-gradient(180deg,var(--s1),var(--s2)),color-mix(in srgb,var(--c) 14%,var(--gl));box-shadow:var(--gsh),var(--hi);font-family:var(--font)}\n.card.open{background:linear-gradient(180deg,var(--s1),transparent),color-mix(in srgb,var(--c) 30%,var(--gl))}\n.tag{border-radius:999px}\n#dock{border-radius:36px;background:var(--gl);border:1px solid var(--glb);box-shadow:var(--gsh),var(--hi);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%)}\n.dk i{border-radius:16px;background:color-mix(in srgb,var(--ic) 16%,var(--gl));border:1px solid color-mix(in srgb,var(--ic) 42%,var(--glb));box-shadow:var(--hi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}\n.dk.fn i{background:var(--ink)}\n.pill{border-radius:999px;font-family:var(--font);box-shadow:var(--hi),0 4px 14px rgba(0,0,0,.22)}\n.bdg{border-radius:50%;background:rgba(70,70,78,.8);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--hi),0 2px 6px rgba(0,0,0,.3)}\n.card.off .bdg{background:#10B981;color:#17191F}\n.chip.all{--c:var(--ink);--on:var(--bg)}\n/* via di mezzo: bottoni pieni, ombre e sfumature ridotte */\n:root{--gsh:0 2px 8px rgba(40,50,90,.07);--hi:inset 0 1px 0 rgba(255,255,255,.5);--s1:rgba(255,255,255,.3);--s2:rgba(255,255,255,.04);--b1:rgba(59,130,246,0.13);--b2:rgba(236,72,153,0.1);--b3:rgba(234,179,8,0.1);--b4:rgba(139,92,246,0.12)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--gsh:0 2px 8px rgba(0,0,0,.25);--hi:inset 0 1px 0 rgba(255,255,255,.08);--s1:rgba(255,255,255,.07);--s2:rgba(255,255,255,.01);--b1:rgba(59,130,246,0.12);--b2:rgba(236,72,153,0.09);--b3:rgba(234,179,8,0.07);--b4:rgba(139,92,246,0.12)}}\n:root[data-theme=\"dark\"]{--gsh:0 2px 8px rgba(0,0,0,.25);--hi:inset 0 1px 0 rgba(255,255,255,.08);--s1:rgba(255,255,255,.07);--s2:rgba(255,255,255,.01);--b1:rgba(59,130,246,0.12);--b2:rgba(236,72,153,0.09);--b3:rgba(234,179,8,0.07);--b4:rgba(139,92,246,0.12)}\n.chip{background:color-mix(in srgb,var(--c) 12%,var(--bg));border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}\n.chip[aria-pressed=\"true\"]{background:var(--cd,var(--c));border-color:var(--cd,var(--c));box-shadow:none}\n.flt input,.flt select{background:var(--surface);border:1.5px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}\n#dock{background:var(--surface);border:1.5px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 4px 14px rgba(0,0,0,.1)}\n.dk i{background:color-mix(in srgb,var(--ic) 14%,var(--bg));border:1.5px solid color-mix(in srgb,var(--ic) 55%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}\n.dk.fn i{background:var(--ink);border-color:var(--ink)}\n.pill{box-shadow:none}\n.bdg{background:var(--ink);color:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}\n.card.off .bdg{background:#10B981;color:#17191F}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"stripe\">\u003ci class=\"pre\">\u003c/i>\u003ci class=\"civ\">\u003c/i>\u003ci class=\"gre\">\u003c/i>\u003ci class=\"per\">\u003c/i>\u003ci class=\"ell\">\u003c/i>\u003ci class=\"rep\">\u003c/i>\u003ci class=\"imp\">\u003c/i>\u003ci class=\"reg\">\u003c/i>\u003ci class=\"biz\">\u003c/i>\u003ci class=\"isl\">\u003c/i>\u003ci class=\"fra\">\u003c/i>\u003ci class=\"chi\">\u003c/i>\u003ci class=\"eur\">\u003c/i>\u003ci class=\"mon\">\u003c/i>\u003c/div>\n  \u003ch1>Storia antica e medievale, fino al 1492\u003c/h1>\n  \u003cp>Distanze proporzionali al tempo trascorso. Tocca un evento per i dettagli, pizzica per zoomare.\u003c/p>\n\u003c/header>\n\u003cdiv class=\"bar\">\n  \u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n  \u003cdiv class=\"flt\" id=\"flt\">\n    \u003cspan>Da\u003c/span>\u003cinput id=\"fa\" inputmode=\"numeric\" placeholder=\"anno\">\u003cselect id=\"fas\">\u003coption value=\"-1\">a.C.\u003c/option>\u003coption value=\"1\">d.C.\u003c/option>\u003c/select>\n    \u003cspan>A\u003c/span>\u003cinput id=\"fb\" inputmode=\"numeric\" placeholder=\"anno\">\u003cselect id=\"fbs\">\u003coption value=\"-1\">a.C.\u003c/option>\u003coption value=\"1\" selected>d.C.\u003c/option>\u003c/select>\n      \u003c/div>\n\u003c/div>\n\u003cmain>\u003cdiv id=\"list\">\u003csvg id=\"svg\">\u003c/svg>\u003c/div>\u003c/main>\n\n\u003cscript>\nconst ERAS={pre:\"Preistoria\",civ:\"Prime civiltà\",gre:\"Grecia\",per:\"Persia\",ell:\"Ellenismo\",rep:\"Roma antica\",imp:\"Impero romano\",reg:\"Regni barbarici\",biz:\"Bisanzio\",isl:\"Islam\",fra:\"Franchi e Impero\",chi:\"Chiesa e crociate\",eur:\"Europa e comuni\",mon:\"Mongoli e Asia\"};\nconst COL={pre:\"#EAB308\",civ:\"#F97316\",gre:\"#3B82F6\",per:\"#06B6D4\",ell:\"#8B5CF6\",rep:\"#EF4444\",imp:\"#EC4899\",reg:\"#84CC16\",biz:\"#B45309\",isl:\"#10B981\",fra:\"#6366F1\",chi:\"#D946EF\",eur:\"#14B8A6\",mon:\"#64748B\"};\nconst K0=8;\n// [epoca, inizio, fine (0 = data singola), titolo, descrizione, approssimato]\nconst D=[\n[\"pre\",-2600000,-10000,\"Paleolitico\",\"Cacciatori-raccoglitori dall’Africa orientale all’Europa e all’Asia, per oltre due milioni di anni.\",1],\n[\"pre\",-2600000,0,\"Primi strumenti\",\"A Olduvai (Tanzania) i primi ominini scheggiano la pietra per tagliare e spezzare ossa.\",1],\n[\"pre\",-1800000,0,\"Homo erectus\",\"Esce dall’Africa e arriva a Dmanisi (Georgia), in Cina e a Giava.\",1],\n[\"pre\",-500000,0,\"Fuoco abituale\",\"Focolari stabili in Europa e Asia: si cuoce il cibo e ci si difende dalle belve.\",1],\n[\"pre\",-400000,0,\"Compaiono i Neanderthal\",\"Vivono dalla Spagna alla Siberia fino a circa 40.000 anni fa; seppelliscono i morti e si incrociano con i sapiens.\",1],\n[\"pre\",-300000,0,\"Homo sapiens\",\"I fossili di Jebel Irhoud (Marocco) sono tra i più antichi della nostra specie.\",1],\n[\"pre\",-9500,-3000,\"Neolitico\",\"Agricoltura, allevamento e villaggi stabili, dal Vicino Oriente all’Europa.\",1],\n[\"pre\",-9500,0,\"Nasce l’agricoltura\",\"Nella Mezzaluna Fertile (Levante e Mesopotamia) si coltivano grano e orzo.\",1],\n[\"pre\",-9500,0,\"Göbekli Tepe\",\"In Turchia, il più antico tempio monumentale noto, con pilastri a T scolpiti.\",1],\n[\"pre\",-8000,0,\"Gerico\",\"In Palestina sorge una città con mura e torre di pietra, tra le più antiche del mondo.\",1],\n[\"pre\",-2500,0,\"Stonehenge\",\"In Inghilterra si innalzano le grandi pietre, allineate al solstizio d’estate.\",1],\n[\"civ:m\",-3500,-2000,\"Civiltà sumera\",\"Città-Stato del sud della Mesopotamia: Uruk, Ur, Lagash, Nippur.\",1],\n[\"civ:m\",-3500,0,\"Nascono le città\",\"Uruk arriva a decine di migliaia di abitanti, con templi e magazzini.\",1],\n[\"civ:m\",-3200,0,\"Scrittura cuneiforme\",\"Nasce a Uruk come contabilità su tavolette d’argilla.\",1],\n[\"civ:m\",-2334,-2154,\"Impero accadico\",\"Sargon unisce le città sumere dalla capitale Akkad: è il primo impero della storia.\",1],\n[\"civ:m\",-1894,-1595,\"Antica Babilonia\",\"Dinastia amorrea con capitale Babilonia, sull’Eufrate.\",1],\n[\"civ:m\",-1754,0,\"Codice di Hammurabi\",\"Il re fa incidere circa 280 leggi su una stele, ritrovata a Susa.\",1],\n[\"civ:m\",-911,-609,\"Impero neoassiro\",\"Da Assur, Nimrud e Ninive eserciti dotati di ferro dominano il Vicino Oriente.\",1],\n[\"civ:m\",-612,0,\"Cade Ninive\",\"Medi e Babilonesi di Nabopolassar distruggono la capitale assira.\"],\n[\"civ:m\",-626,-539,\"Impero neobabilonese\",\"Con Nabucodonosor II Babilonia ha la Porta di Ishtar e i giardini pensili.\",1],\n[\"civ:m\",-587,0,\"Distruzione di Gerusalemme\",\"Nabucodonosor II conquista la città e deporta gli Ebrei a Babilonia.\"],\n[\"civ:e\",-3100,0,\"Unificazione dell’Egitto\",\"Secondo la tradizione Narmer unisce Alto e Basso Egitto, con capitale a Menfi.\",1],\n[\"civ:e\",-2686,-2181,\"Antico Regno\",\"L’età delle piramidi, con faraoni e scribi lungo il Nilo.\",1],\n[\"civ:e\",-2650,0,\"Piramide di Djoser\",\"A Saqqara l’architetto Imhotep costruisce la prima piramide a gradoni.\",1],\n[\"civ:e\",-2560,0,\"Piramide di Cheope\",\"A Giza la Grande Piramide, alta 146 metri, resta la più alta per millenni.\",1],\n[\"civ:e\",-1550,-1070,\"Nuovo Regno\",\"L’Egitto imperiale, con capitale a Tebe e tombe nella Valle dei Re.\",1],\n[\"civ:e\",-1473,0,\"Hatshepsut\",\"Regina e faraone, fa costruire il tempio di Deir el-Bahari.\",1],\n[\"civ:e\",-1353,0,\"Akhenaton\",\"Fonda Amarna e impone il culto del solo dio Aton, con la moglie Nefertiti.\",1],\n[\"civ:e\",-1332,0,\"Tutankhamon\",\"Il giovane faraone: la tomba intatta è scoperta da Carter nel 1922.\",1],\n[\"civ:e\",-1274,0,\"Battaglia di Qadesh\",\"Ramses II e l’ittita Muwatalli II si scontrano in Siria; segue il primo trattato di pace.\"],\n[\"civ:e\",-1177,0,\"Ramses III\",\"Respinge i Popoli del Mare nel Delta, mentre altrove crollano molti regni.\",1],\n[\"civ:c\",-2700,-1450,\"Civiltà minoica\",\"Su Creta: palazzi di Cnosso e Festo, affreschi e commerci marittimi.\",1],\n[\"civ:c\",-1600,0,\"Eruzione di Thera\",\"Il vulcano di Santorini devasta l’Egeo e indebolisce i Minoici.\",1],\n[\"civ:h\",-1650,-1180,\"Impero ittita\",\"Capitale Hattusa, in Anatolia: carri da guerra, ferro e trattati scritti.\",1],\n[\"civ:a\",-1600,-1100,\"Civiltà micenea\",\"Re guerrieri a Micene e Pilo scrivono in Lineare B, la più antica forma di greco.\",1],\n[\"civ:a\",-1180,0,\"Guerra di Troia\",\"Per la tradizione Agamennone di Micene assedia Troia, in Anatolia; gli scavi mostrano distruzioni.\",1],\n[\"civ\",-1200,0,\"Crollo dell’età del bronzo\",\"Cadono Micene, Hattusa e Ugarit: terremoti, siccità e Popoli del Mare.\",1],\n[\"civ\",-1050,0,\"Alfabeto fenicio\",\"Da Biblo e Tiro (Libano) si diffonde l’alfabeto da cui deriva il greco.\",1],\n[\"civ\",-1000,0,\"Davide e Salomone\",\"Regno di Israele con capitale Gerusalemme, dove Salomone costruisce il Tempio.\",1],\n[\"civ\",-814,0,\"Fondazione di Cartagine\",\"Coloni di Tiro guidati da Didone fondano la città in Tunisia.\",1],\n[\"gre\",-1100,-800,\"Secoli bui\",\"Calano scrittura e popolazione dopo il crollo dei palazzi micenei.\",1],\n[\"gre\",-800,-480,\"Età arcaica\",\"Nascono le poleis: Atene, Sparta, Corinto, Tebe.\",1],\n[\"gre\",-776,0,\"Prime Olimpiadi\",\"A Olimpia, in onore di Zeus: da qui i Greci contano gli anni.\"],\n[\"gre\",-750,-550,\"Colonizzazione\",\"Colonie greche dal Mar Nero alla Sicilia e a Marsiglia.\",1],\n[\"gre\",-733,0,\"Siracusa\",\"Coloni di Corinto guidati da Archia fondano la città in Sicilia.\"],\n[\"gre\",-594,0,\"Solone\",\"Eletto arconte nel 594 a.C., cancella i debiti che riducevano i contadini in schiavitù, divide i cittadini in quattro classi di reddito e crea il consiglio dei Quattrocento. È la prima base della democrazia ateniese.\",1],\n[\"gre\",-508,0,\"Clistene\",\"Nel 508 a.C. riforma Atene sostituendo le antiche tribù con dieci tribù territoriali e crea il Consiglio dei Cinquecento. Introduce l’ostracismo e dà all’assemblea un ruolo decisivo.\"],\n[\"gre\",-499,-449,\"Guerre persiane\",\"Due invasioni persiane della Grecia: la prima di Dario I (Maratona, 490), la seconda di Serse (Termopili, Salamina, Platea, 480-479). Le polis, guidate da Atene e Sparta, resistono e la Lega delio-attica porta la guerra in Asia fino alla pace di Callia.\"],\n[\"gre\",-490,0,\"Maratona\",\"Nella pianura a nord-est di Atene gli opliti di Milziade, aiutati dai Plateesi, travolgono con un attacco di corsa l’esercito persiano di Dario I sbarcato con Dati e Artaferne. I Persiani perdono circa seimila uomini, gli Ateniesi meno di duecento. Da qui la leggenda del messaggero che corre ad Atene.\"],\n[\"gre\",-480,0,\"Termopili e Salamina\",\"Nel 480 a.C. Leonida, re di Sparta, con 300 Spartani e alleati tiene il passo delle Termopili contro Serse finché Efialte, un traditore, mostra ai Persiani un sentiero. Poche settimane dopo Temistocle attira la flotta persiana nello stretto di Salamina e la distrugge.\"],\n[\"gre\",-478,0,\"Lega delio-attica\",\"Fondata nel 478 a.C. con sede nell’isola di Delo, riunisce centinaia di città contro la Persia sotto la guida di Atene. Nel 454 il tesoro è spostato ad Atene e la lega diventa un vero impero ateniese.\"],\n[\"gre\",-461,-429,\"Atene di Pericle\",\"Pericle guida Atene dal 461 al 429: potenzia la democrazia con l’indennità per i giudici, domina la Lega delio-attica e costruisce le Lunghe Mura. Con il tesoro federale fa edificare Partenone e Propilei.\"],\n[\"gre\",-431,-404,\"Guerra del Peloponneso\",\"Ventisette anni di guerra (431-404) tra la Lega delio-attica di Atene e quella peloponnesiaca di Sparta. Peste, spedizione in Sicilia e oro persiano portano Sparta alla vittoria; Atene perde flotta, mura e impero.\"],\n[\"gre\",-430,0,\"Peste di Atene\",\"Nel 430 a.C., con la città affollata di rifugiati dalla campagna, esplode un’epidemia che uccide circa un quarto degli Ateniesi. Tucidide, che la contrasse, la descrive; nel 429 muore anche Pericle.\"],\n[\"gre\",-415,-413,\"Spedizione in Sicilia\",\"Nel 415 Atene invia 130 navi contro Siracusa, guidate da Nicia, Lamaco e Alcibiade, che poi fugge a Sparta. Dopo due anni di assedio flotta ed esercito sono distrutti e migliaia di prigionieri finiscono nelle latomie.\"],\n[\"gre\",-371,0,\"Leuttra\",\"Nel 371 a.C. il tebano Epaminonda, con la falange obliqua, sconfigge a Leuttra, in Beozia, gli Spartani del re Cleombroto, che muore. Finisce l’egemonia di Sparta e inizia quella di Tebe.\"],\n[\"gre\",-338,0,\"Cheronea\",\"Il 2 agosto del 338 a.C., in Beozia, Filippo II di Macedonia e il figlio Alessandro, a capo della cavalleria, sconfiggono Atene e Tebe. Le polis perdono l’indipendenza e nasce la Lega di Corinto sotto guida macedone.\"],\n[\"per\",-559,-330,\"Impero achemenide\",\"Da Pasargade, Susa e Persepoli, dall’Egeo all’Indo: il più vasto impero antico.\"],\n[\"per\",-539,0,\"Ciro il Grande\",\"Conquista Babilonia e lascia tornare gli Ebrei a Gerusalemme.\"],\n[\"per\",-525,0,\"Cambise conquista l’Egitto\",\"Batte il faraone Psammetico III a Pelusio.\"],\n[\"per\",-330,0,\"Fine dei Persiani\",\"Dario III è ucciso dal satrapo Besso e Alessandro incendia Persepoli.\"],\n[\"per\",-247,224,\"Impero partico\",\"Arcieri a cavallo, capitale Ctesifonte: il solo vero rivale di Roma a oriente.\",1],\n[\"per\",-53,0,\"Carre\",\"I Parti del generale Surena distruggono l’esercito di Crasso in Mesopotamia.\"],\n[\"per\",224,651,\"Impero sasanide\",\"Dinastia di Ardashir I: zoroastrismo di Stato e lunghe guerre con Roma e Bisanzio.\"],\n[\"per\",260,0,\"Shapur I\",\"Cattura l’imperatore Valeriano a Edessa: unico imperatore romano preso prigioniero.\"],\n[\"ell\",-336,-323,\"Conquiste di Alessandro\",\"Alessandro III di Macedonia sale al trono nel 336 a.C. a vent’anni e muore a Babilonia nel 323. In tredici anni batte i Persiani al Granico, a Isso e a Gaugamela, conquista Egitto, Persia e Asia centrale e arriva all’Indo, fondando decine di città chiamate Alessandria.\"],\n[\"ell\",-334,0,\"Granico\",\"Nel 334 a.C. Alessandro batte i satrapi persiani sul fiume Granico, in Anatolia, e rischia la vita nello scontro: Clito il Nero lo salva. Le città greche d’Asia gli aprono le porte.\"],\n[\"ell\",-333,0,\"Isso\",\"Nel novembre del 333 a.C., nella stretta pianura di Isso, in Cilicia, Alessandro sconfigge Dario III, che fugge lasciando la madre, la moglie e le figlie. Alessandro le tratta con grande rispetto.\"],\n[\"ell\",-332,0,\"Tiro\",\"Dopo sette mesi d’assedio conquista la città fenicia, poi l’Egitto.\"],\n[\"ell\",-331,0,\"Gaugamela\",\"Nel 331 a.C., nella piana vicino a Erbil, Alessandro con circa 47.000 uomini rompe lo schieramento di Dario III con una carica della cavalleria dei Compagni. Dario fugge e sarà ucciso l’anno dopo: l’impero persiano è finito.\"],\n[\"ell\",-326,0,\"Idaspe\",\"In India batte il re Poro; poi le truppe rifiutano di avanzare.\"],\n[\"ell\",-323,0,\"Morte di Alessandro\",\"L’11 giugno del 323 a.C. Alessandro muore a Babilonia a 32 anni, forse di malaria, febbre tifoide o avvelenamento. Alla domanda a chi lasci l’impero risponde, secondo la tradizione, «al più forte»: i Diadochi lo divideranno.\"],\n[\"ell:d\",-322,-281,\"Guerre dei Diadochi\",\"Tolomeo, Seleuco, Antigono e Cassandro si spartiscono l’impero.\"],\n[\"ell:d\",-301,0,\"Ipso\",\"In Frigia Seleuco e Lisimaco sconfiggono Antigono Monoftalmo.\"],\n[\"ell:s\",-312,-63,\"Impero seleucide\",\"Fondato da Seleuco I, capitale Antiochia, domina Siria e Mesopotamia.\"],\n[\"ell:s\",-190,0,\"Magnesia\",\"In Lidia i Romani di Scipione e Eumene II di Pergamo battono Antioco III.\"],\n[\"ell:s\",-167,0,\"Rivolta dei Maccabei\",\"Giuda Maccabeo guida gli Ebrei contro Antioco IV a Gerusalemme.\"],\n[\"ell:t\",-305,-30,\"Egitto tolemaico\",\"Dinastia greca fondata da Tolomeo I, con capitale Alessandria.\"],\n[\"ell:p\",-282,-133,\"Regno di Pergamo\",\"Dinastia degli Attalidi in Anatolia, famosa per biblioteca e arte.\"],\n[\"ell:g\",-168,0,\"Pidna\",\"Il romano Paolo Emilio batte Perseo e pone fine al regno di Macedonia.\"],\n[\"rep:r\",-753,-509,\"Regno di Roma\",\"Sette re, da Romolo a Tarquinio il Superbo.\",1],\n[\"rep:r\",-753,0,\"Fondazione di Roma\",\"Il 21 aprile del 753 a.C., secondo Varrone, Romolo traccia il solco sul Palatino e uccide il fratello Remo. Gli scavi mostrano capanne sul colle già nell’VIII secolo a.C.: la leggenda dà una data a un processo graduale.\"],\n[\"rep:r\",-509,0,\"Cacciata dei re\",\"Dopo lo scandalo di Lucrezia, Bruto caccia Tarquinio il Superbo.\"],\n[\"rep\",-509,-27,\"Repubblica romana\",\"Dopo la cacciata di Tarquinio il Superbo (509) il potere passa a due consoli annuali, al Senato e alle assemblee. Per cinque secoli Roma conquista l’Italia e il Mediterraneo, finché le guerre civili aprono la strada ad Augusto.\"],\n[\"rep\",-451,0,\"Leggi delle Dodici Tavole\",\"Nel 451-450 a.C. un collegio di decemviri, tra cui Appio Claudio, mette per iscritto le leggi di Roma su richiesta della plebe. Le Tavole, esposte nel Foro, sono la base del diritto romano.\"],\n[\"rep\",-390,0,\"Sacco gallico\",\"Nel 390 a.C. (data tradizionale) i Galli Senoni di Brenno sconfiggono i Romani all’Allia e occupano la città. Resiste il Campidoglio, salvato secondo la leggenda dalle oche. Camillo libera Roma.\",1],\n[\"rep\",-343,-290,\"Guerre sannitiche\",\"Roma contro i Sanniti per il controllo dell’Italia centrale.\"],\n[\"rep\",-280,-275,\"Guerra pirrica\",\"Pirro, re dell’Epiro, aiuta Taranto: vince a Eraclea e Ascoli, ma perde a Benevento.\"],\n[\"rep\",-264,-146,\"Guerre puniche\",\"Tre guerre tra Roma e Cartagine (264-146 a.C.) per il dominio del Mediterraneo occidentale. Con Annibale la seconda porta il nemico in Italia; la terza si chiude con la distruzione di Cartagine.\"],\n[\"rep\",-264,-241,\"Prima guerra punica\",\"Nata dal conflitto per Messina, dura 23 anni. Roma costruisce una flotta con il ‘corvo’ e vince a Milazzo e alle Egadi (241). Cartagine cede la Sicilia e paga un forte indennizzo.\"],\n[\"rep\",-260,0,\"Milazzo\",\"Nel 260 a.C. il console Gaio Duilio affronta la flotta cartaginese con navi dotate di ‘corvo’, un ponte d’abbordaggio, e vince. È la prima vittoria navale di Roma.\"],\n[\"rep\",-218,-201,\"Seconda guerra punica\",\"Annibale parte da Cartagena, supera Pirenei e Alpi e vince al Ticino, alla Trebbia, al Trasimeno e a Canne. Roma resiste con la tattica di Fabio Massimo e porta la guerra in Africa con Scipione, che vince a Zama.\"],\n[\"rep\",-216,0,\"Canne\",\"Il 2 agosto del 216 a.C., in Puglia, Annibale accerchia con la cavalleria e un centro arretrato circa 80.000 Romani dei consoli Varrone e Paolo Emilio. Muoiono circa 50.000 uomini, tra cui Paolo Emilio: è la peggiore sconfitta della storia romana.\"],\n[\"rep\",-212,0,\"Morte di Archimede\",\"Nel 212 a.C., alla presa di Siracusa dopo due anni di assedio, un soldato romano uccide Archimede, che disegnava figure geometriche. Marcello avrebbe voluto risparmiarlo e gli fa costruire la tomba.\"],\n[\"rep\",-202,0,\"Zama\",\"Nel 202 a.C. Scipione l’Africano affronta Annibale vicino a Cartagine. Con la cavalleria del numida Massinissa neutralizza gli elefanti e accerchia i veterani cartaginesi. La pace costringe Cartagine a consegnare la flotta e a pagare un enorme indennizzo.\"],\n[\"rep\",-149,-146,\"Terza guerra punica\",\"Nel 149 Roma attacca Cartagine con il pretesto di una guerra con Massinissa. Dopo tre anni di assedio Scipione Emiliano la conquista nel 146: la città brucia per diciassette giorni.\"],\n[\"rep\",-146,0,\"Distrutte Cartagine e Corinto\",\"Nello stesso anno cade anche Corinto, rasa al suolo dal console Mummio.\"],\n[\"rep\",-133,-121,\"I Gracchi\",\"Tiberio Gracco, tribuno nel 133, propone di redistribuire l’agro pubblico ai poveri e viene ucciso in una rissa; il fratello Gaio, tribuno nel 123-122, riprova e si fa uccidere. La loro morte apre un secolo di violenza politica.\"],\n[\"rep\",-82,0,\"Dittatura di Silla\",\"Nell’82 a.C., vinta la guerra civile, Silla è dittatore: scrive le liste di proscrizione che costano la vita a migliaia di avversari e rafforza il Senato. Nel 79 si ritira a vita privata.\"],\n[\"rep\",-73,-71,\"Rivolta di Spartaco\",\"Nel 73 a.C. Spartaco, gladiatore trace, fugge da Capua con circa settanta compagni e raccoglie fino a 70.000 schiavi. Batte più legioni, ma nel 71 è sconfitto da Crasso in Lucania.\"],\n[\"rep\",-60,0,\"Primo triumvirato\",\"Nel 60 a.C. Cesare, Pompeo e Crasso stringono un accordo privato per spartirsi il potere: Cesare ottiene il consolato e la Gallia, Pompeo terre per i veterani, Crasso appalti. Si rompe con la morte di Crasso a Carre (53).\"],\n[\"rep\",-58,-50,\"Guerre galliche\",\"Dal 58 al 50 a.C. Cesare, proconsole, conquista la Gallia fino al Reno, passa due volte in Britannia e sconfigge Elvezi, Belgi e Vercingetorige. Il De bello Gallico è anche propaganda per la sua carriera politica.\"],\n[\"rep\",-52,0,\"Alesia\",\"Nel 52 a.C. Cesare assedia Vercingetorige sulla collina fortificata di Alesia, circondando la città con due linee di trincee. L’esercito di soccorso gallico fallisce e Vercingetorige si arrende: la Gallia è conquistata.\"],\n[\"rep\",-49,0,\"Rubicone\",\"Il 10 gennaio del 49 a.C. Cesare passa con la XIII legione il piccolo fiume che separava la Gallia Cisalpina dall’Italia: la legge vietava ai generali di entrare armati. Il «dado è tratto» segna l’inizio della guerra civile contro Pompeo.\"],\n[\"rep\",-44,0,\"Idi di marzo\",\"Il 15 marzo del 44 a.C. Cesare, dittatore a vita, è pugnalato 23 volte nella Curia di Pompeo da circa sessanta congiurati guidati da Bruto, Cassio e Decimo Bruto. Il gesto non restaura la Repubblica ma scatena nuove guerre civili.\"],\n[\"rep\",-42,0,\"Filippi\",\"Nel 42 a.C. Antonio e Ottaviano battono in Macedonia gli assassini di Cesare, Bruto e Cassio, che si uccidono. La Repubblica è finita; i vincitori si dividono Occidente e Oriente.\"],\n[\"rep\",-31,0,\"Azio\",\"Il 2 settembre del 31 a.C. la flotta di Agrippa e Ottaviano batte al largo della Grecia quella di Antonio e Cleopatra. I due fuggono in Egitto e si uccidono nel 30. Ottaviano resta unico padrone di Roma e nel 27 diventa Augusto.\"],\n[\"imp\",-27,476,\"Impero romano\",\"Da Augusto (27 a.C.) a Romolo Augustolo (476), per cinque secoli un solo Stato domina il Mediterraneo, dalla Britannia all’Eufrate. Le province sono governate da legati, difese da una trentina di legioni e unite da strade, leggi e cittadinanza.\"],\n[\"imp\",-27,180,\"Pax Romana\",\"Da Augusto a Marco Aurelio (27 a.C.-180 d.C.) l’impero conosce stabilità e prosperità: commerci sicuri, strade, acquedotti, città dal Reno all’Eufrate. Le guerre restano alle frontiere, con pochi episodi di guerra civile.\"],\n[\"imp\",9,0,\"Teutoburgo\",\"Nel settembre del 9 d.C., nella selva di Teutoburgo, Arminio, capo dei Cherusci, annienta tre legioni di Publio Quintilio Varo in un’imboscata. Augusto rinuncia a conquistare la Germania oltre il Reno.\"],\n[\"imp\",43,0,\"Conquista della Britannia\",\"Nel 43 Claudio invia 40.000 uomini al comando di Aulo Plauzio e arriva di persona a Camulodunum (Colchester). Il sud dell’isola diventa provincia romana e la conquista procede per decenni.\"],\n[\"imp\",64,0,\"Incendio di Roma\",\"Nella notte del 18 luglio 64 un incendio scoppiato presso il Circo Massimo brucia per sei giorni e distrugge buona parte della città. Nerone, che era ad Anzio, ricostruisce Roma con regole nuove e incolpa i cristiani, perseguitati.\"],\n[\"imp\",70,0,\"Distruzione del Tempio\",\"Nell’agosto del 70 Tito, dopo cinque mesi di assedio, prende Gerusalemme e il Tempio brucia. Il bottino è portato a Roma: l’Arco di Tito ne ricorda il trionfo, con la menorah.\"],\n[\"imp\",79,0,\"Vesuvio\",\"Il 24 agosto del 79 il Vesuvio erutta e seppellisce Pompei, Ercolano e Stabia sotto cenere e lapilli. Plinio il Vecchio, comandante della flotta a Miseno, muore nei soccorsi; il nipote Plinio il Giovane ne lascia la cronaca.\"],\n[\"imp\",80,0,\"Colosseo\",\"Iniziato da Vespasiano nel 72 e inaugurato da Tito nell’80 con cento giorni di giochi, l’Anfiteatro Flavio ospita fino a 50.000 spettatori per combattimenti di gladiatori e cacce. Ha 80 arcate e un sistema di sotterranei.\"],\n[\"imp\",101,106,\"Guerre daciche\",\"Dal 101 al 106 Traiano combatte il re Decebalo: dopo due campagne conquista la Dacia (attuale Romania), che gli porta oro e miniere. La Colonna Traiana, a Roma, ne racconta le imprese a rilievo.\"],\n[\"imp\",117,0,\"Massima espansione\",\"Nel 117 Traiano, dopo la conquista della Mesopotamia fino al Golfo Persico, porta l’impero alla massima estensione, circa 5 milioni di km². Il successore Adriano rinuncia alle conquiste orientali, ormai troppo costose.\"],\n[\"imp\",122,0,\"Vallo di Adriano\",\"Dal 122 Adriano fa costruire, in Britannia, un muro di pietra lungo circa 117 km tra Tyne e Solway, con fortini ogni miglio. Segna il confine nord e dimostra la nuova politica di difesa.\"],\n[\"imp\",161,180,\"Marco Aurelio\",\"Imperatore dal 161 al 180, filosofo stoico autore delle Meditazioni. Combatte i Parti, la peste antonina e le guerre marcomanniche sul Danubio. Muore a Vindobona, forse l’attuale Vienna, lasciando l’impero al figlio Commodo.\"],\n[\"imp\",212,0,\"Cittadinanza a tutti\",\"Con la Constitutio Antoniniana del 212 Caracalla concede la cittadinanza romana a tutti gli abitanti liberi dell’impero. La misura aumenta anche le entrate fiscali, grazie alle imposte che gravano sui cittadini.\"],\n[\"imp\",235,284,\"Crisi del III secolo\",\"Dal 235 al 284 si succedono circa venti imperatori, quasi tutti uccisi; Goti e Alemanni invadono i confini, i Sasanidi catturano Valeriano, Gallia e Palmira si staccano e la moneta si svaluta. Aureliano e Diocleziano salvano l’impero.\"],\n[\"imp\",272,0,\"Aureliano\",\"Batte Zenobia a Palmira (Siria) e costruisce le mura di Roma.\"],\n[\"imp\",284,305,\"Diocleziano\",\"Imperatore dal 284 al 305, divide il governo in tetrarchia, riforma esercito, fisco e province e fissa i prezzi. Nel 303 avvia l’ultima e più dura persecuzione contro i cristiani. Abdica nel 305 e si ritira a Spalato.\"],\n[\"imp\",312,0,\"Ponte Milvio\",\"Il 28 ottobre del 312 Costantino batte Massenzio sul Tevere. Secondo la tradizione, la notte prima ha una visione della croce e fa mettere il simbolo cristiano sugli scudi. Massenzio annega nel fiume.\"],\n[\"imp\",313,0,\"Editto di Milano\",\"Nel 313 Costantino e Licinio, incontrandosi a Milano, concedono libertà di culto a tutti, cristiani compresi, e restituiscono i beni confiscati alle Chiese. Non è la conversione dello Stato, ma la fine delle persecuzioni.\"],\n[\"imp\",325,0,\"Concilio di Nicea\",\"Nel 325 Costantino convoca a Nicea, in Bitinia, circa 300 vescovi. Il concilio condanna Ario, che negava la piena divinità del Figlio, e fissa il Credo niceno e la data della Pasqua.\"],\n[\"imp\",330,0,\"Costantinopoli\",\"L’11 maggio 330 Costantino inaugura sul Bosforo la «Nuova Roma», costruita sull’antica Bisanzio con foro, ippodromo e mura. Per più di mille anni sarà la capitale dell’impero d’Oriente.\"],\n[\"imp\",378,0,\"Adrianopoli\",\"Il 9 agosto del 378 i Goti di Fritigerno annientano in Tracia l’esercito d’Oriente dell’imperatore Valente, che muore nello scontro. Circa due terzi dell’esercito sono perduti e Teodosio dovrà accettare i Goti come alleati dentro i confini.\"],\n[\"imp\",380,0,\"Editto di Tessalonica\",\"Il 27 febbraio 380 Teodosio I e i colleghi Graziano e Valentiniano II ordinano che tutti i sudditi professino la fede del vescovo di Roma e di Alessandria. Il cristianesimo niceno diventa religione di Stato.\"],\n[\"imp\",395,0,\"Impero diviso\",\"Il 17 gennaio 395 Teodosio muore a Milano. I figli Arcadio (Oriente, a Costantinopoli) e Onorio (Occidente, prima a Milano, poi a Ravenna) ereditano le due metà: da allora l’impero non sarà più riunito.\"],\n[\"imp\",410,0,\"Sacco di Roma\",\"Il 24 agosto 410 i Visigoti di Alarico, dopo tre assedi, entrano a Roma da Porta Salaria e la saccheggiano per tre giorni. Il trauma spinge Sant’Agostino a scrivere La città di Dio.\"],\n[\"imp\",439,0,\"Vandali a Cartagine\",\"Genserico conquista la città e crea un regno in Nord Africa.\"],\n[\"imp\",451,0,\"Campi Catalaunici\",\"Nel 451 il generale Ezio, con Romani, Visigoti di Teodorico, Franchi e Burgundi, ferma in Gallia Attila e gli Unni. Teodorico muore, ma Attila si ritira e rinuncia all’impero d’Occidente.\"],\n[\"imp\",455,0,\"Sacco vandalico\",\"Nel giugno del 455 Genserico, re dei Vandali, sbarca a Ostia e saccheggia Roma per due settimane, dopo l’assassinio dell’imperatore Valentiniano III. Papa Leone I ottiene solo che non siano commessi incendi e massacri.\"],\n[\"imp\",476,0,\"Fine dell’Impero d’Occidente\",\"Il 4 settembre 476 Odoacre, capo degli Eruli, depone Romolo Augustolo a Ravenna e rimanda le insegne imperiali a Costantinopoli. Per convenzione termina qui l’età antica; in Oriente l’impero durerà fino al 1453.\"],\n[\"civ:e\",-2055,-1650,\"Medio Regno\",\"Mentuhotep II riunifica l’Egitto da Tebe; fioriscono arte e letteratura.\",1],\n[\"civ\",-720,0,\"Caduta di Samaria\",\"Sargon II conquista il regno d’Israele e deporta le tribù.\",1],\n[\"civ\",-701,0,\"Assedio di Gerusalemme\",\"Sennacherib d’Assiria assedia la città del re Ezechia.\",1],\n[\"civ:e\",-664,-525,\"Periodo saitico\",\"Psammetico I rinnova l’Egitto da Sais con mercenari greci.\",1],\n[\"gre\",-735,-715,\"Prima guerra messenica\",\"Sparta conquista la Messenia e riduce gli abitanti a iloti.\",1],\n[\"gre\",-650,0,\"Tiranni di Corinto\",\"Cipselo prende il potere: molte città arcaiche hanno tiranni.\",1],\n[\"gre\",-620,0,\"Leggi di Dracone\",\"Ad Atene le prime leggi scritte, molto severe.\",1],\n[\"gre\",-600,0,\"Fondazione di Marsiglia\",\"Coloni di Focea fondano Massalia, in Gallia.\",1],\n[\"gre\",-546,-510,\"Pisistratidi\",\"Pisistrato e i figli governano Atene; Ipparco è ucciso nel 514.\",1],\n[\"gre\",-499,0,\"Rivolta ionica\",\"Le città greche d’Asia, con Mileto, si ribellano ai Persiani; Atene le aiuta.\"],\n[\"gre\",-494,0,\"Distruzione di Mileto\",\"I Persiani saccheggiano la città dopo la battaglia di Lade.\"],\n[\"gre\",-480,0,\"Imera\",\"Nel 480 a.C., si dice nello stesso giorno di Salamina, Gelone di Siracusa e Terone di Agrigento sconfiggono a Imera il cartaginese Amilcare, che muore. La Sicilia greca è salva dalla minaccia punica.\"],\n[\"gre\",-479,0,\"Platea\",\"Nel 479 a.C., in Beozia, circa 40.000 opliti greci guidati dallo spartano Pausania battono l’esercito persiano di Mardonio, che muore. Con la vittoria di Micale la minaccia persiana sulla Grecia è finita.\"],\n[\"gre\",-460,-445,\"Prima guerra del Peloponneso\",\"Tra il 460 e il 445 a.C. Atene e Sparta si affrontano in modo indiretto con le rispettive alleate. La pace dei trent’anni (446) divide l’influenza, ma la rivalità porta alla grande guerra del 431.\",1],\n[\"gre\",-421,0,\"Pace di Nicia\",\"Nel 421 a.C. Nicia di Atene e il re spartano Plistoanatte firmano una pace di cinquant’anni dopo la morte di Cleone e Brasida. Dura appena sei anni, perché Alcibiade spinge Atene a riprendere le armi.\"],\n[\"gre\",-405,-367,\"Dionigi I di Siracusa\",\"Tiranno di Siracusa, combatte Cartagine e domina la Sicilia.\"],\n[\"gre\",-404,0,\"Resa di Atene\",\"Nell’aprile del 404 a.C., affamata dal blocco navale di Lisandro, Atene si arrende a Sparta. Le Lunghe Mura sono demolite al suono dei flauti e il governo passa ai Trenta Tiranni.\"],\n[\"gre\",-401,0,\"Anabasi\",\"Senofonte guida i Diecimila greci dalla Mesopotamia al mare.\"],\n[\"gre\",-395,-387,\"Guerra di Corinto\",\"Atene, Tebe, Corinto e Argo contro Sparta, con oro persiano.\"],\n[\"gre\",-386,0,\"Pace del Re\",\"La Persia di Artaserse II impone la pace alle città greche.\"],\n[\"gre\",-359,0,\"Filippo II re\",\"Nel 359 a.C. Filippo II diventa reggent
