e e poi re di Macedonia. Con la falange armata di sarissa, riforme fiscali e diplomazia fa di un regno marginale la maggiore potenza della Grecia.\"],\n[\"gre\",-356,0,\"Nasce Alessandro\",\"Nel luglio del 356 a.C. a Pella nasce Alessandro, figlio di Filippo II e della principessa epirota Olimpiade. Sarà educato da Aristotele a Mieza e salirà al trono a vent’anni.\"],\n[\"ell\",-335,0,\"Distrutta Tebe\",\"Nel 335 a.C., dopo una rivolta contro i Macedoni, Alessandro assedia Tebe e la rade al suolo, risparmiando solo la casa del poeta Pindaro. Circa seimila Tebani muoiono e trentamila sono venduti schiavi.\"],\n[\"ell\",-324,0,\"Nozze di Susa\",\"Nel 324 a.C., a Susa, Alessandro sposa Statira, figlia di Dario III, e fa sposare circa ottanta ufficiali macedoni con nobildonne persiane. È il simbolo della sua politica di fusione tra Greci e Persiani.\"],\n[\"ell\",-280,-275,\"Invasione dei Galati\",\"I Celti dilagano in Macedonia e Anatolia e si fermano in Galazia.\",1],\n[\"ell\",-280,-146,\"Lega achea\",\"Confederazione di città del Peloponneso, rifondata nel 280 a.C. e guidata da Arato di Sicione e poi da Filopemene. Si scontra con Sparta e con la Macedonia e viene sciolta da Roma dopo il 146 a.C.\"],\n[\"ell\",-223,-187,\"Antioco III il Grande\",\"Il re seleucide riconquista l’Oriente fino all’India, poi perde contro Roma.\"],\n[\"ell\",-217,0,\"Rafia\",\"Nel 217 a.C. Tolomeo IV batte Antioco III a Rafia, vicino a Gaza, con circa 70.000 uomini e molte falangi egizie. La vittoria salva la Celesiria, ma l’uso massiccio di soldati nativi darà origine a rivolte in Egitto.\"],\n[\"ell\",-197,0,\"Cinoscefale\",\"In Tessaglia Flaminino batte Filippo V e proclama la libertà dei Greci.\"],\n[\"ell\",-88,-63,\"Mitridate VI\",\"Re del Ponto, combatte Roma tre volte; nell’88 fa massacrare i Romani d’Asia.\"],\n[\"ell\",-86,0,\"Atene saccheggiata\",\"Nell’86 a.C. Silla assedia Atene, schierata con Mitridate, la conquista e la saccheggia. Il Pireo è incendiato, ma il generale risparmia i monumenti per rispetto verso il passato della città.\"],\n[\"per\",-546,0,\"Ciro batte Creso\",\"Conquista Sardi, capitale della Lidia.\"],\n[\"per\",-486,-465,\"Serse I\",\"Figlio di Dario I, regna dal 486 al 465. Dopo aver domato rivolte in Egitto e Babilonia invade la Grecia nel 480 con un enorme esercito, ma è sconfitto a Salamina e a Platea. Muore assassinato dal comandante della guardia Artabano.\"],\n[\"per\",-401,0,\"Cunassa\",\"Ciro il Giovane muore combattendo il fratello Artaserse II.\"],\n[\"per\",114,117,\"Guerra partica di Traiano\",\"Dal 114 al 117 Traiano invade l’Armenia e la Mesopotamia, prende Ctesifonte e arriva al Golfo Persico. Le rivolte ebraiche e delle città conquistate lo costringono a ripiegare; Adriano rinuncerà alle province oltre l’Eufrate.\"],\n[\"per\",363,0,\"Giuliano muore in Persia\",\"Nel giugno del 363 l’imperatore Giuliano, in ritirata dopo la campagna contro Shapur II, è ferito a morte in uno scontro presso Maranga. Il successore Gioviano cede alla Persia cinque province.\"],\n[\"rep\",-900,-264,\"Etruschi\",\"Città-Stato tra Arno e Tevere (Tarquinia, Cerveteri, Veio) che influenzano Roma.\",1],\n[\"rep\",-715,-673,\"Numa Pompilio\",\"Secondo re: istituisce culti e calendario.\",1],\n[\"rep\",-616,-579,\"Tarquinio Prisco\",\"Re etrusco: bonifica il Foro e avvia il Circo Massimo.\",1],\n[\"rep\",-578,0,\"Servio Tullio\",\"Sesto re: riforma l’esercito e costruisce le prime mura.\",1],\n[\"rep\",-508,0,\"Orazio Coclite\",\"Nel 508 a.C., secondo la leggenda, Orazio Coclite difende da solo il ponte Sublicio contro gli Etruschi di Porsenna, finché il ponte non è tagliato alle sue spalle. Si getta poi nel Tevere e si salva a nuoto.\"],\n[\"rep\",-494,0,\"Secessione della plebe\",\"I plebei lasciano Roma per l’Aventino e ottengono i tribuni.\"],\n[\"rep\",-458,0,\"Cincinnato\",\"Nel 458 a.C. Lucio Quinzio Cincinnato, chiamato dall’aratro a fare il dittatore, libera in sedici giorni un esercito romano accerchiato dagli Equi sul monte Algido e torna ai suoi campi. È il modello della virtù civile.\"],\n[\"rep\",-396,0,\"Presa di Veio\",\"Camillo conquista la città etrusca dopo dieci anni d’assedio.\"],\n[\"rep\",-367,0,\"Leggi Licinie-Sestie\",\"I plebei ottengono un console: finisce lo scontro tra patrizi e plebei.\"],\n[\"rep\",-321,0,\"Forche Caudine\",\"Nel 321 a.C. i Sanniti di Gavio Ponzio intrappolano due legioni romane in una gola tra Caudio e Benevento e le fanno passare sotto il giogo. Roma rifiuta la pace e riprende la guerra con maggiore energia.\"],\n[\"rep\",-312,0,\"Via Appia\",\"Appio Claudio il Cieco avvia la strada Roma-Capua e il primo acquedotto.\"],\n[\"rep\",-295,0,\"Sentino\",\"Roma batte Sanniti, Galli ed Etruschi alleati, nelle Marche.\"],\n[\"rep\",-272,0,\"Presa di Taranto\",\"Nel 272 a.C. Taranto, ultima grande città greca d’Italia, si arrende al console Lucio Papirio Cursore dopo la partenza di Pirro. Roma domina ormai tutta l’Italia peninsulare e guarda alla Sicilia.\"],\n[\"rep\",-241,0,\"Isole Egadi\",\"Il 10 marzo del 241 a.C. il console Lutazio Catulo sconfigge la flotta cartaginese al largo della Sicilia, appesantita dai rifornimenti. Cartagine accetta la pace: Roma ottiene la Sicilia, la sua prima provincia.\"],\n[\"rep\",-218,0,\"Annibale passa le Alpi\",\"Con elefanti e circa 30.000 uomini scende in Pianura Padana.\"],\n[\"rep\",-217,0,\"Trasimeno\",\"Il 21 giugno del 217 a.C. Annibale tende un’imboscata nella nebbia sul lago, tra Umbria e Toscana, al console Flaminio. Circa 15.000 Romani muoiono, tra cui lo stesso console.\"],\n[\"rep\",-207,0,\"Metauro\",\"Nel 207 a.C. i consoli Claudio Nerone e Livio Salinatore intercettano nelle Marche Asdrubale, che portava rinforzi ad Annibale, e lo uccidono. La sua testa è lanciata nel campo del fratello.\"],\n[\"rep\",-184,0,\"Catone il Censore\",\"Austero difensore dei costumi antichi, ripete: Cartagine va distrutta.\"],\n[\"rep\",-112,-105,\"Guerra giugurtina\",\"Dal 112 al 105 a.C. Roma combatte il re numida Giugurta, che aveva corrotto molti senatori. Dopo vari insuccessi Mario e il questore Silla lo sconfiggono: la guerra mostra la corruzione dell’aristocrazia.\"],\n[\"rep\",-107,0,\"Riforma di Mario\",\"Nel 107 a.C., console, Mario arruola nell’esercito anche i proletari senza terra e dà ai soldati equipaggiamento e paga. Nasce l’esercito professionale, più fedele ai generali che allo Stato.\"],\n[\"rep\",-102,-101,\"Cimbri e Teutoni\",\"Tra il 102 e il 101 a.C. Mario sconfigge i Teutoni ad Aquae Sextiae (Aix-en-Provence) e i Cimbri a Vercelle, dopo averli lasciati scendere verso l’Italia. Roma è salva dalla minaccia dei popoli germanici.\"],\n[\"rep\",-91,-88,\"Guerra sociale\",\"Dal 91 all’88 a.C. gli alleati italici, tra cui Marsi e Sanniti, si ribellano a Roma chiedendo la cittadinanza. Dopo gravi perdite Roma la concede a quasi tutti gli Italici.\"],\n[\"rep\",-88,0,\"Silla marcia su Roma\",\"Per la prima volta un generale entra in città con l’esercito.\"],\n[\"rep\",-66,-62,\"Pompeo in Oriente\",\"Sconfigge Mitridate, annette la Siria e prende Gerusalemme.\"],\n[\"rep\",-63,0,\"Congiura di Catilina\",\"Nel 63 a.C., sconfitto alle elezioni consolari, il senatore Lucio Sergio Catilina prepara con alcuni complici un colpo di Stato. Il console Cicerone lo smaschera con le Catilinarie; i capi sono giustiziati e Catilina muore a Pistoia nel 62.\"],\n[\"rep\",-55,0,\"Cesare in Britannia\",\"Nel 55 e nel 54 a.C. Cesare attraversa la Manica con le sue legioni, sbarca nel Kent e batte i Britanni di Cassivellauno. Non conquista l’isola, occupata solo un secolo dopo da Claudio, ma ne ricava grande prestigio a Roma.\"],\n[\"rep\",-48,0,\"Farsalo\",\"Il 9 agosto del 48 a.C., in Tessaglia, Cesare con circa 22.000 uomini sconfigge i 40.000 di Pompeo, che è tradito dalla sua cavalleria. Pompeo fugge in Egitto, dove sarà ucciso.\"],\n[\"rep\",-46,0,\"Trionfi di Cesare\",\"Nel 46 a.C. Cesare celebra a Roma quattro trionfi (Gallia, Egitto, Ponto, Africa) tra giochi grandiosi. Riforma il calendario con l’astronomo Sosigene: nasce il calendario giuliano.\"],\n[\"rep\",-45,0,\"Munda\",\"Il 17 marzo del 45 a.C., in Spagna, Cesare batte gli ultimi eserciti pompeiani di Gneo e Sesto Pompeo in una battaglia durissima. Gneo è ucciso, Sesto fugge: la guerra civile è finita.\"],\n[\"rep\",-43,0,\"Secondo triumvirato\",\"Nel 43 a.C. Ottaviano, Antonio e Lepido si accordano a Bologna e ottengono pieni poteri per cinque anni con la legge Tizia. Seguono le proscrizioni: muoiono circa 300 senatori, tra cui Cicerone.\"],\n[\"imp\",30,0,\"Crocifissione di Gesù\",\"Intorno all’anno 30, sotto il prefetto Ponzio Pilato e l’imperatore Tiberio, Gesù di Nazareth è condannato e crocifisso a Gerusalemme. Da questo evento nasce il cristianesimo, che si diffonderà in tutto l’impero.\",1],\n[\"imp\",37,41,\"Caligola\",\"Nel 37 sale al trono a 24 anni tra grande popolarità. Dopo una grave malattia governa con crudeltà, pretendendo onori divini; nel 41 è assassinato nel palazzo dal tribuno pretoriano Cassio Cherea.\"],\n[\"imp\",41,54,\"Claudio\",\"Nel 41 i pretoriani lo proclamano imperatore dopo l’assassinio di Caligola. Zoppo e studioso, governa con competenza, conquista la Britannia (43) e amplia le province; muore nel 54, forse avvelenato dalla moglie Agrippina.\"],\n[\"imp\",54,68,\"Nerone\",\"Ultimo dei Giulio-Claudi, sale al trono nel 54 a 16 anni con la guida di Seneca e Burro. Dopo i primi anni equilibrati diventa dispotico: fa uccidere la madre e la moglie Ottavia. Quando le legioni si ribellano, si uccide l’8 giugno del 68.\"],\n[\"imp\",60,0,\"Rivolta di Budicca\",\"Nel 60 la regina degli Iceni Budicca, frustata dai Romani dopo la morte del marito Prasutago, guida una rivolta in Britannia. I ribelli distruggono Camulodunum, Londinium e Verulamium, ma sono sconfitti da Svetonio Paolino.\"],\n[\"imp\",66,73,\"Guerra giudaica\",\"Vespasiano e Tito reprimono la rivolta; Masada cade nel 73.\"],\n[\"imp\",69,0,\"Anno dei quattro imperatori\",\"Dopo il suicidio di Nerone nel 68 si succedono Galba, Otone, Vitellio e infine Vespasiano, acclamato dalle legioni d’Oriente. Le guerre civili sono raccontate da Tacito nelle Storie e la dinastia flavia chiude il periodo.\"],\n[\"imp\",96,180,\"Cinque buoni imperatori\",\"Nerva, Traiano, Adriano, Antonino Pio e Marco Aurelio governano dal 96 al 180 e sono scelti per adozione, non per via ereditaria. Machiavelli e Gibbon ricordano questo periodo come il più felice dell’impero.\"],\n[\"imp\",132,135,\"Rivolta di Bar Kochba\",\"Gli Ebrei si ribellano ad Adriano; Gerusalemme diventa Aelia Capitolina.\"],\n[\"imp\",165,0,\"Peste antonina\",\"Portata dalle legioni di ritorno dalla guerra contro i Parti, l’epidemia, forse vaiolo, colpisce l’impero dal 165. Secondo le stime uccide da cinque a dieci milioni di persone, compreso Lucio Vero, e indebolisce l’esercito di Marco Aurelio.\"],\n[\"imp\",180,192,\"Commodo\",\"Figlio di Marco Aurelio, regna dal 180 al 192. Chiude le guerre sul Danubio con una pace affrettata, si mostra come gladiatore e si fa chiamare Ercole Romano. È strangolato da un atleta, Narcisso, dopo una congiura di palazzo.\"],\n[\"imp\",193,211,\"Settimio Severo\",\"Africano di Leptis Magna, nel 193 prende il trono dopo una guerra civile e fonda la dinastia dei Severi. Aumenta la paga dei soldati, conquista la Mesopotamia e muore a York nel 211.\"],\n[\"imp\",250,0,\"Persecuzione di Decio\",\"Nel 250 l’imperatore Decio ordina a tutti gli abitanti dell’impero di sacrificare agli dèi e di ottenere un certificato. Molti cristiani, tra cui il papa Fabiano, muoiono o abiurano: è la prima persecuzione generale.\"],\n[\"imp\",260,274,\"Impero delle Gallie\",\"Tra il 260 e il 274 Postumo e i suoi successori, tra cui Vittorino e Tetrico, governano Gallia, Britannia e Spagna in modo autonomo, con capitale Treviri. Aureliano lo riconquista a Châlons.\"],\n[\"imp\",301,0,\"Editto dei prezzi\",\"Nel 301 Diocleziano fissa per legge i prezzi massimi di centinaia di merci e salari in tutto l’impero, per contrastare l’inflazione causata dal peggioramento della moneta. Il provvedimento non funziona e viene presto ignorato.\"],\n[\"imp\",306,337,\"Costantino\",\"Acclamato imperatore a York nel 306, batte Massenzio a Ponte Milvio (312) e Licinio a Crisopoli (324) e riunisce l’impero. Favorisce i cristiani, convoca il concilio di Nicea e fonda Costantinopoli; muore a Nicomedia nel 337.\"],\n[\"imp\",361,363,\"Giuliano\",\"L’imperatore «apostata» tenta di restaurare il paganesimo.\"],\n[\"imp\",374,0,\"Ambrogio a Milano\",\"Eletto vescovo di Milano nel 374, Ambrogio impone penitenza all’imperatore Teodosio dopo il massacro di Tessalonica (390). Difende l’indipendenza della Chiesa dal potere imperiale.\"],\n[\"imp\",393,0,\"Fine delle Olimpiadi antiche\",\"Con la politica anti-pagana dell’imperatore Teodosio I finiscono nel 393 i giochi di Olimpia in onore di Zeus, iniziati secondo la tradizione nel 776 a.C. Dopo oltre mille anni il santuario è abbandonato e poi colpito da terremoti.\"],\n[\"imp\",406,0,\"Invasione del Reno\",\"Il 31 dicembre del 406 Vandali, Alani e Svevi attraversano il Reno ghiacciato presso Magonza e invadono la Gallia. Non saranno più respinti: il confine renano, dopo secoli, cede.\"],\n[\"imp\",430,0,\"Morte di Agostino\",\"Il vescovo di Ippona muore mentre i Vandali assediano la città.\"],\n[\"civ\",-1792,-1750,\"Hammurabi\",\"Re di Babilonia: sale al trono nel 1792 a.C. e regna fino al 1750. Conquista Larsa e Mari e unifica la Mesopotamia meridionale; il suo codice di leggi è il più celebre dell’antichità.\",1],\n[\"civ\",-1457,0,\"Battaglia di Megiddo\",\"Il faraone Tutmosi III sconfigge a Megiddo, in Palestina, una coalizione di principi cananei guidata dal re di Qadesh. È la prima battaglia descritta in dettaglio dalle fonti storiche.\",1],\n[\"civ\",-1323,0,\"Morte di Tutankhamon\",\"Il giovane faraone muore a circa 18 anni. La tomba, nella Valle dei Re, resterà quasi intatta fino alla scoperta di Howard Carter nel 1922.\",1],\n[\"civ\",-1279,-1213,\"Ramses II\",\"Faraone della XIX dinastia, regna per 66 anni. Combatte gli Ittiti a Qadesh, firma con loro il primo trattato di pace noto, costruisce Abu Simbel e fonda la capitale Pi-Ramses.\",1],\n[\"civ\",-605,-562,\"Nabucodonosor II\",\"Re di Babilonia: sale al trono nel 605 dopo la vittoria a Càrchemish sugli Egizi, conquista Gerusalemme nel 587 e fa di Babilonia la città più splendida del suo tempo.\"],\n[\"per\",-559,-530,\"Ciro il Grande\",\"Sale al trono di Anshan nel 559 a.C., unisce Medi e Persiani, batte Creso di Lidia (546) e conquista Babilonia (539). Muore nel 530 combattendo i Massageti ai confini dell’Asia centrale.\",1],\n[\"per\",-522,-486,\"Dario I\",\"Prende il trono nel 522 dopo aver represso rivolte in tutto l’impero. Organizza le satrapie, introduce il darico, fonda Persepoli e muore nel 486, quattro anni dopo la sconfitta di Maratona.\"],\n[\"gre\",-510,0,\"Cacciata di Ippia\",\"Con l’aiuto del re spartano Cleomene, gli Ateniesi cacciano il tiranno Ippia, ultimo dei Pisistratidi. Atene è libera e si apre la strada alle riforme di Clistene.\"],\n[\"gre\",-474,0,\"Battaglia di Cuma\",\"Gerone I di Siracusa sconfigge la flotta etrusca nel golfo di Napoli. Gli Etruschi perdono il dominio navale del Tirreno e Siracusa diventa la maggiore potenza greca d’Occidente.\"],\n[\"gre\",-479,0,\"Battaglia di Micale\",\"Secondo la tradizione nello stesso giorno di Platea, la flotta greca guidata dallo spartano Leotichida distrugge quella persiana sulla costa ionica e libera le città greche d’Asia.\"],\n[\"gre\",-466,0,\"Battaglia dell’Eurimedonte\",\"Cimone di Atene batte i Persiani per mare e per terra presso la foce del fiume Eurimedonte, in Panfilia. La Lega delio-attica si rafforza e il Mar Egeo resta greco.\"],\n[\"gre\",-429,0,\"Morte di Pericle\",\"Muore ad Atene colpito dalla peste, dopo trent’anni alla guida della città. Senza di lui prevalgono demagoghi come Cleone e la guerra del Peloponneso prende una piega peggiore.\"],\n[\"gre\",-424,0,\"Battaglia di Delio\",\"I Tebani sconfiggono gli Ateniesi in Beozia nella guerra del Peloponneso: cadono quasi mille opliti, tra cui il generale Ippocrate. Atene perde ogni speranza di dominare la regione.\"],\n[\"gre\",-422,0,\"Battaglia di Anfipoli\",\"In Tracia muoiono sia lo spartano Brasida sia l’ateniese Cleone, i due più accesi fautori della guerra. La loro morte apre la strada alla pace di Nicia.\"],\n[\"gre\",-406,0,\"Battaglia delle Arginuse\",\"La flotta ateniese vince presso Lesbo, ma una tempesta impedisce di soccorrere i naufraghi. Ad Atene sei strateghi vittoriosi sono condannati a morte.\"],\n[\"gre\",-405,0,\"Battaglia di Egospotami\",\"Lisandro di Sparta sorprende la flotta ateniese all’ancora sull’Ellesponto e la cattura quasi intera. Atene, tagliata dai rifornimenti di grano, si arrende l’anno seguente.\"],\n[\"gre\",-362,0,\"Battaglia di Mantinea\",\"Il tebano Epaminonda vince gli Spartani nel Peloponneso ma muore sul campo. La breve egemonia di Tebe finisce con lui e la Grecia resta divisa, pronta per la Macedonia.\"],\n[\"gre\",-336,0,\"Morte di Filippo II\",\"Il re di Macedonia è assassinato a Ege, durante le nozze della figlia, dalla sua guardia del corpo Pausania. Il figlio Alessandro, di vent’anni, gli succede e prepara la guerra alla Persia.\"],\n[\"ell\",-281,0,\"Battaglia di Curupedio\",\"In Lidia Seleuco I sconfigge Lisimaco, ultimo grande rivale tra i generali di Alessandro. Seleuco unisce gran parte dell’Asia, ma pochi mesi dopo è assassinato da Tolomeo Cerauno.\"],\n[\"ell\",-175,-164,\"Antioco IV Epifane\",\"Re seleucide dal 175 a.C.: tenta di ellenizzare la Giudea, profana il Tempio di Gerusalemme e provoca la rivolta dei Maccabei. Muore in Persia nel 164 durante una campagna.\"],\n[\"ell\",-51,-30,\"Cleopatra VII\",\"Sale al trono a 18 anni con il fratello Tolomeo XIII. Alleata di Cesare e poi di Antonio, dopo Azio si uccide ad Alessandria nel 30 a.C.: è l’ultima sovrana tolemaica.\"],\n[\"rep\",-280,0,\"Battaglia di Eraclea\",\"Pirro d’Epiro, giunto in aiuto di Taranto, batte il console Levino in Lucania grazie agli elefanti da guerra: i Romani non li avevano mai visti.\"],\n[\"rep\",-279,0,\"Battaglia di Ascoli Satriano\",\"Pirro vince ancora, ma perde gran parte dei suoi uomini migliori. Da qui nasce l’espressione «vittoria di Pirro», per un successo troppo costoso.\"],\n[\"rep\",-275,0,\"Battaglia di Benevento\",\"Il console Curio Dentato sconfigge Pirro, che lascia definitivamente l’Italia. Taranto cade pochi anni dopo e Roma domina tutta la penisola meridionale.\"],\n[\"rep\",-272,0,\"Morte di Pirro\",\"Muore ad Argo, in Grecia, colpito da una tegola lanciata da una donna durante uno scontro tra le strade. Aveva sognato un impero tra Italia, Sicilia e Macedonia.\"],\n[\"rep\",-256,0,\"Battaglia di Capo Ecnomo\",\"I consoli Regolo e Manlio battono la flotta cartaginese al largo della Sicilia, in una delle maggiori battaglie navali dell’antichità. Roma può sbarcare in Africa.\"],\n[\"rep\",-218,0,\"Battaglia del Ticino\",\"Annibale batte la cavalleria romana del console Publio Cornelio Scipione, che resta ferito: è il primo scontro in Italia della seconda guerra punica.\"],\n[\"rep\",-218,0,\"Battaglia della Trebbia\",\"Annibale attira le legioni del console Sempronio Longo nel gelo del fiume e le travolge con cavalleria e elefanti. Quasi tutta la Pianura Padana passa dalla sua parte.\"],\n[\"rep\",-183,0,\"Morte di Annibale\",\"In esilio alla corte di Prusia I di Bitinia, braccato dai Romani, si avvelena per non essere consegnato. Nello stesso anno muore a Literno Scipione l’Africano.\"],\n[\"rep\",-133,0,\"Assedio di Numanzia\",\"Scipione Emiliano affama dopo otto mesi la città celtibera in Spagna, ultima a resistere a Roma. Gli abitanti preferiscono darsi la morte piuttosto che arrendersi.\"],\n[\"rep\",-86,0,\"Morte di Mario\",\"Muore a Roma, già anziano, pochi giorni dopo l’inizio del suo settimo consolato, dopo aver ripreso la città con una sanguinosa vendetta sui nemici.\"],\n[\"rep\",-86,0,\"Battaglia di Cheronea (86)\",\"Silla batte in Beozia l’esercito di Mitridate guidato da Archelao e poi ad Orcomeno: riconquista la Grecia e si prepara a tornare a Roma.\"],\n[\"rep\",-82,0,\"Battaglia di Porta Collina\",\"Silla sconfigge i Sanniti e i mariani proprio davanti alle mura di Roma. Dopo la vittoria iniziano le proscrizioni e la sua dittatura.\"],\n[\"rep\",-78,0,\"Morte di Silla\",\"Si era ritirato a Pozzuoli dopo aver lasciato la dittatura. Muore nel 78 a.C. e le sue riforme cominciano subito a essere smantellate.\"],\n[\"rep\",-71,0,\"Morte di Spartaco\",\"Spartaco cade in Lucania combattendo contro Crasso. Seimila prigionieri sono crocifissi lungo la via Appia, da Capua a Roma.\"],\n[\"rep\",-52,0,\"Battaglia di Gergovia\",\"Vercingetorige respinge Cesare e lo costringe a ritirarsi dalla città degli Arverni: è l’unica sconfitta di Cesare in Gallia, subito prima di Alesia.\"],\n[\"rep\",-48,0,\"Morte di Pompeo\",\"Sfuggito a Farsalo, Pompeo è ucciso sulla spiaggia di Pelusio, in Egitto, per ordine di Tolomeo XIII, pochi giorni prima che Cesare arrivi.\"],\n[\"rep\",-47,0,\"Battaglia di Zela\",\"Cesare sconfigge Farnace II del Ponto in poche ore e annuncia la vittoria al Senato con tre parole: «veni, vidi, vici».\"],\n[\"rep\",-46,0,\"Battaglia di Tapso\",\"In Africa Cesare vince i pompeiani di Metello Scipione e il re numida Giuba I. Catone l’Uticense si uccide a Utica per non cadere nelle mani del vincitore.\"],\n[\"rep\",-43,0,\"Morte di Cicerone\",\"Proscritto dai triumviri, il grande oratore è ucciso presso Formia per ordine di Antonio. La testa e le mani sono esposte sui Rostri, nel Foro.\"],\n[\"rep\",-36,0,\"Battaglia di Nauloco\",\"Agrippa batte la flotta di Sesto Pompeo, figlio di Pompeo Magno, al largo della Sicilia. Ottaviano resta il padrone dell’Occidente.\"],\n[\"rep\",-30,0,\"Morte di Antonio e Cleopatra\",\"Dopo Azio, Antonio si uccide ad Alessandria; Cleopatra lo segue pochi giorni dopo. L’Egitto diventa provincia romana e Ottaviano rimane senza rivali.\"],\n[\"imp\",-27,14,\"Augusto\",\"Ottaviano riceve il titolo di Augusto dal Senato nel 27 a.C. e governa per 41 anni, conservando le forme repubblicane ma concentrando il potere. Muore a Nola nel 14 d.C., lasciando l’impero a Tiberio.\"],\n[\"imp\",14,37,\"Tiberio\",\"Succede ad Augusto a 55 anni. Governa con prudenza, poi si ritira a Capri lasciando Roma al prefetto Seiano. Muore a Miseno nel 37, forse soffocato da Macrone.\"],\n[\"imp\",81,96,\"Domiziano\",\"Ultimo dei Flavi, sale al trono alla morte del fratello Tito. Governa in modo sempre più autoritario ed è assassinato in una congiura di palazzo nel 96.\"],\n[\"imp\",83,0,\"Battaglia del Monte Graupio\",\"Agricola batte i Caledoni di Calgaco in Scozia: è l’ultima grande vittoria romana nel nord della Britannia.\"],\n[\"imp\",98,117,\"Traiano\",\"Primo imperatore nato fuori dall’Italia, in Spagna. Conquista la Dacia e la Mesopotamia e porta l’impero alla sua massima estensione. Muore a Selinunte, in Cilicia, nel 117.\"],\n[\"imp\",117,138,\"Adriano\",\"Succede a Traiano e rinuncia alle conquiste orientali. Viaggia per tutte le province, fa costruire il Vallo e riforma l’amministrazione; muore a Baia nel 138.\"],\n[\"imp\",138,161,\"Antonino Pio\",\"Regno lungo e quasi senza guerre, con le finanze in ordine. Muore nel 161 e gli succedono insieme Marco Aurelio e Lucio Vero.\"],\n[\"imp\",197,0,\"Battaglia di Lione\",\"Settimio Severo batte il rivale Clodio Albino nelle Gallie e resta unico padrone dell’impero.\"],\n[\"imp\",251,0,\"Battaglia di Abrittus\",\"I Goti di Cniva uccidono l’imperatore Decio in Dobrugia, nell’attuale Bulgaria: è la prima volta che un imperatore muore in battaglia contro un nemico esterno.\"],\n[\"imp\",268,0,\"Battaglia di Naisso\",\"Claudio II il Gotico sconfigge i Goti a Naisso, nei Balcani, in una delle maggiori vittorie del III secolo, e allontana per qualche anno la minaccia.\"],\n[\"imp\",270,275,\"Aureliano\",\"Ricompatta l’impero battendo Goti, Vandali e la regina Zenobia di Palmira; fa costruire le Mura di Roma. È assassinato dai suoi ufficiali nel 275.\"],\n[\"imp\",324,0,\"Battaglia di Crisopoli\",\"Costantino batte Licinio sul Bosforo, dopo la battaglia navale dell’Ellesponto, e diventa l’unico imperatore dopo quasi quarant’anni di divisioni.\"],\n[\"imp\",357,0,\"Battaglia di Strasburgo\",\"Giuliano, cesare delle Gallie, batte con circa 13.000 uomini il doppio dei guerrieri alamanni di Cnodomario e salva la frontiera del Reno.\"],\n[\"imp\",379,395,\"Teodosio I\",\"Proclamato imperatore d’Oriente nel 379, poi anche d’Occidente: impone il cristianesimo niceno e muore a Milano nel 395, ultimo a governare l’impero unito.\"],\n[\"imp\",394,0,\"Battaglia del Frigido\",\"Teodosio batte l’usurpatore Eugenio e il generale franco Arbogaste presso Aquileia: per l’ultima volta l’impero è unito sotto un solo imperatore.\"],\n[\"imp\",402,0,\"Battaglia di Pollenzo\",\"Il generale Stilicone ferma in Piemonte i Visigoti di Alarico, che si ritirano dall’Italia per qualche anno.\"],\n[\"imp\",408,0,\"Morte di Stilicone\",\"Il generale di origine vandala, vero reggente dell’Occidente, è giustiziato a Ravenna per ordine di Onorio. Alarico resta senza ostacoli verso Roma.\"],\n[\"imp\",410,0,\"Morte di Alarico\",\"Muore a Cosenza pochi mesi dopo il sacco di Roma. Secondo la tradizione fu sepolto nel letto del fiume Busento, deviato per l’occasione.\"],\n[\"imp\",453,0,\"Morte di Attila\",\"Il re degli Unni muore la notte delle nozze con Ildico, forse per un’emorragia. L’impero unno si sfalda in pochi anni, lasciando l’Occidente più libero.\"],\n[\"imp\",477,0,\"Morte di Genserico\",\"Il re dei Vandali, che regnava dal 428, muore a Cartagine dopo aver saccheggiato Roma e dominato il Mediterraneo occidentale per quasi mezzo secolo.\"],\n[\"gre\",-494,0,\"Battaglia di Lade\",\"Al largo di Mileto la flotta persiana sconfigge quella ionica, già divisa dalle defezioni dei Sami. La caduta di Mileto pone fine alla rivolta ionica e prepara l’attacco di Dario alla Grecia.\"],\n[\"gre\",-404,0,\"Morte di Alcibiade\",\"L’ex stratega ateniese, passato più volte da Atene a Sparta alla Persia, è ucciso in Frigia da sicari inviati dai Trenta Tiranni e dai Persiani.\"],\n[\"gre\",-403,0,\"Restaurazione della democrazia\",\"Trasibulo parte da File con pochi esuli e abbatte il governo dei Trenta Tiranni ad Atene. Viene proclamata un’amnistia generale, tra le prime della storia.\"],\n[\"gre\",-394,0,\"Battaglia di Cnido\",\"Conone, ateniese al comando della flotta persiana, distrugge quella spartana al largo della Caria. Sparta perde il dominio dei mari e Atene può ricostruire le Lunghe Mura.\"],\n[\"gre\",-339,0,\"Battaglia del Crimiso\",\"Il corinzio Timoleonte, con circa 12.000 uomini, sconfigge in Sicilia l’esercito cartaginese: è la maggiore vittoria greca sui Cartaginesi e ridà respiro alle città siceliote.\"],\n[\"gre\",-322,0,\"Battaglia di Crannon\",\"Antipatro, reggente di Macedonia, sconfigge le città greche ribelli nella guerra lamiaca. Atene perde la democrazia e Demostene si avvelena per sfuggire all’arresto.\"],\n[\"ell\",-222,0,\"Battaglia di Sellasia\",\"Antigono III Dosone di Macedonia batte Sparta e il re Cleomene III, che fugge in Egitto. La Lega achea domina il Peloponneso sotto la tutela macedone.\"],\n[\"ell\",-200,0,\"Battaglia di Panion\",\"Antioco III il Grande sconfigge presso le sorgenti del Giordano l’esercito tolemaico di Scopa: la Siria meridionale e la Palestina passano ai Seleucidi.\"],\n[\"rep\",-496,0,\"Battaglia del lago Regillo\",\"Secondo la tradizione Roma batte la Lega latina, con l’aiuto di Castore e Polluce apparsi in battaglia. Consolida la Repubblica appena nata.\"],\n[\"rep\",-215,-205,\"Prima guerra macedonica\",\"Filippo V di Macedonia si allea con Annibale. Roma lo tiene impegnato in Grecia con la Lega etolica e firma la pace di Fenice.\"],\n[\"rep\",-206,0,\"Battaglia di Ilipa\",\"Scipione l’Africano batte i Cartaginesi in Andalusia con una manovra avvolgente. La Spagna è perduta per Cartagine e Roma conquista le sue miniere d’argento.\"],\n[\"rep\",-200,-197,\"Seconda guerra macedonica\",\"Roma interviene in Grecia contro Filippo V e lo sconfigge a Cinoscefale. Flaminino proclama la libertà dei Greci ai giochi Istmici.\"],\n[\"rep\",-192,-188,\"Guerra siriaca\",\"Roma e Pergamo battono Antioco III alle Termopili e a Magnesia. La pace di Apamea gli toglie l’Anatolia.\"],\n[\"rep\",-171,-168,\"Terza guerra macedonica\",\"Perseo di Macedonia è sconfitto a Pidna da Paolo Emilio. Il regno è diviso in quattro repubbliche e diventerà provincia romana nel 146.\"],\n[\"rep\",-105,0,\"Battaglia di Arausio\",\"Cimbri e Teutoni annientano due eserciti romani in Gallia meridionale: circa 80.000 morti, la peggiore sconfitta dopo Canne. Roma richiama Mario.\"],\n[\"rep\",-80,-72,\"Guerra sertoriana\",\"Il generale mariano Sertorio resiste in Spagna a Metello e Pompeo con guerriglia e alleati locali, finché è assassinato dai suoi ufficiali nel 72.\"],\n[\"rep\",-48,0,\"Battaglia di Durazzo\",\"Presso Durrës Pompeo costringe Cesare a ritirarsi: è l’unica grave sconfitta di Cesare nella guerra civile, prima della rivincita a Farsalo.\"],\n[\"rep\",-44,0,\"Cesare dittatore perpetuo\",\"A febbraio il Senato lo proclama dittatore a vita, con onori quasi regali e il diritto di coniare monete con il suo volto. Un mese dopo viene ucciso.\"],\n[\"rep\",-41,-40,\"Guerra di Perugia\",\"Lucio Antonio e Fulvia, moglie di Marco Antonio, resistono a Ottaviano a Perugia, che si arrende per fame ed è incendiata: scontro tra i triumviri.\"],\n[\"imp\",16,0,\"Battaglia di Idistaviso\",\"Germanico batte Arminio sul Weser, in Germania, vendicando in parte Teutoburgo. Tiberio però lo richiama e abbandona le conquiste oltre il Reno.\"],\n[\"imp\",69,79,\"Vespasiano\",\"Ex generale in Giudea, è acclamato imperatore nel 69 dopo la guerra civile e fonda la dinastia dei Flavi. Risana le finanze, avvia il Colosseo e muore nel 79.\"],\n[\"imp\",69,0,\"Battaglia di Cremona\",\"Le legioni di Antonio Primo, per Vespasiano, battono quelle di Vitellio presso Cremona e saccheggiano la città. Vitellio è ucciso a Roma pochi giorni dopo.\"],\n[\"imp\",73,0,\"Assedio di Masada\",\"Dopo un lungo assedio guidato da Flavio Silva, i circa 960 zeloti rifugiati nella fortezza sul Mar Morto si tolgono la vita invece di arrendersi ai Romani.\"],\n[\"imp\",79,81,\"Tito\",\"Succede a Vespasiano dopo aver conquistato Gerusalemme. Il suo breve regno è segnato dall’eruzione del Vesuvio, dall’incendio di Roma dell’80 e dall’inaugurazione del Colosseo.\"],\n[\"imp\",96,98,\"Nerva\",\"Anziano senatore, è scelto dopo l’assassinio di Domiziano. Adotta Traiano come successore, inaugurando la serie degli imperatori adottivi.\"],\n[\"imp\",193,0,\"Anno dei cinque imperatori\",\"Commodo è ucciso a fine 192; Pertinace regna 87 giorni, Didio Giuliano compra l’impero all’asta, poi Settimio Severo prende Roma e batte Pescennio Nigro e Clodio Albino.\"],\n[\"imp\",211,217,\"Caracalla\",\"Succede al padre Settimio Severo, fa uccidere il fratello Geta e concede la cittadinanza a tutti. È assassinato nel 217 durante una campagna contro i Parti.\"],\n[\"imp\",218,222,\"Elagabalo\",\"Sacerdote siriano del dio Elagabal, diventa imperatore a 14 anni e scandalizza Roma con riti orientali. Muore ucciso dai pretoriani a 18 anni.\"],\n[\"imp\",222,235,\"Alessandro Severo\",\"Ultimo dei Severi, governa con l’aiuto della madre Giulia Mamea; è ucciso dai soldati a Magonza durante la campagna contro i Germani.\"],\n[\"imp\",235,238,\"Massimino il Trace\",\"Primo imperatore soldato, di origine tracia, cresciuto nell’esercito. Muore assassinato dai suoi stessi uomini sotto Aquileia.\"],\n[\"imp\",248,0,\"Millenario di Roma\",\"Filippo l’Arabo celebra i mille anni dalla fondazione con giochi grandiosi. Tre anni dopo è sconfitto e ucciso da Decio presso Verona.\"],\n[\"imp\",253,268,\"Gallieno\",\"Regna sugli anni più difficili del III secolo: perde Gallia e Oriente a favore di imperi secessionisti, ma riforma l’esercito con una cavalleria mobile. Muore assassinato a Milano.\"],\n[\"imp\",267,272,\"Zenobia di Palmira\",\"Dopo la morte del marito Odenato regna su Siria ed Egitto e sfida Roma. Aureliano la sconfigge a Emesa nel 272 e la porta a Roma in trionfo.\"],\n[\"imp\",293,0,\"Prima tetrarchia\",\"Diocleziano nomina Cesari Galerio e Costanzo Cloro, con Massimiano Augusto d’Occidente: quattro capitali, tra cui Nicomedia, Milano e Treviri.\"],\n[\"imp\",305,0,\"Abdicazione di Diocleziano\",\"Il 1° maggio Diocleziano e Massimiano abdicano insieme, primo caso di ritiro volontario. Diocleziano si ritira nel palazzo di Spalato, dove morirà nel 311.\"],\n[\"imp\",337,361,\"Costanzo II\",\"Figlio di Costantino, regna prima sull’Oriente poi su tutto l’impero. Sostiene l’arianesimo, batte Magnenzio a Mursa e muore marciando contro il cugino Giuliano.\"],\n[\"imp\",351,0,\"Battaglia di Mursa\",\"In Pannonia Costanzo II batte l’usurpatore Magnenzio in uno scontro sanguinosissimo (circa 50.000 morti), che indebolisce l’esercito romano.\"],\n[\"imp\",364,375,\"Valentiniano I\",\"Soldato pannonico eletto imperatore dall’esercito, difende Reno e Danubio con fortificazioni. Muore di apoplessia durante una trattativa con i Quadi.\"],\n[\"imp\",364,378,\"Valente\",\"Imperatore d’Oriente, fratello di Valentiniano I. Accoglie i Goti profughi dagli Unni, ma i maltrattamenti li spingono alla rivolta: muore ad Adrianopoli.\"],\n[\"imp\",383,0,\"Usurpazione di Magno Massimo\",\"In Britannia le truppe acclamano Massimo imperatore e Graziano è ucciso a Lione. Teodosio lo batte e lo giustizia ad Aquileia nel 388.\"],\n[\"imp\",395,423,\"Onorio\",\"Figlio di Teodosio, imperatore d’Occidente a 10 anni sotto la tutela di Stilicone. Sposta la corte a Ravenna e muore nel 423 senza figli.\"],\n[\"imp\",425,455,\"Valentiniano III\",\"Imperatore d’Occidente a 6 anni, con la madre Galla Placidia come reggente. Fa assassinare Ezio nel 454 ed è ucciso l’anno seguente.\"],\n[\"imp\",454,0,\"Morte di Ezio\",\"Il generale che aveva fermato Attila è ucciso a Roma dall’imperatore Valentiniano III in persona, geloso della sua forza: l’imperatore lo seguirà un anno dopo.\"],\n[\"imp\",457,461,\"Maioriano\",\"Ultimo imperatore d’Occidente capace di guidare l’impero: riconquista parte di Gallia e Spagna. È deposto e ucciso dal generale Ricimero.\"],\n[\"imp\",475,476,\"Romolo Augustolo\",\"Ultimo imperatore d’Occidente, un ragazzo di 14 anni nominato dal padre Oreste. Deposto da Odoacre il 4 settembre 476, è mandato in Campania con una pensione.\"],\n[\"gre\",-480,0,\"Battaglia di Capo Artemisio\",\"Mentre alle Termopili si combatte, la flotta greca guidata dallo spartano Euribiade e da Temistocle tiene testa a quella persiana a nord dell’Eubea. Poi si ritira a Salamina, dove si deciderà la guerra.\"],\n[\"gre\",-462,0,\"Riforma di Efialte\",\"Il capo democratico Efialte toglie quasi tutti i poteri all’Areopago, il consiglio aristocratico di Atene. Viene assassinato poco dopo e Pericle ne prosegue l’opera.\"],\n[\"gre\",-411,0,\"Colpo di Stato dei Quattrocento\",\"Dopo il disastro in Sicilia, un gruppo oligarchico guidato da Pisandro e Antifonte prende il potere ad Atene. Il regime cade in pochi mesi per la rivolta della flotta di Samo.\"],\n[\"gre\",-410,0,\"Battaglia di Cizico\",\"Alcibiade, richiamato al comando, distrugge la flotta spartana nel Mar di Marmara. Atene respira, ma Sparta ottiene presto l’aiuto economico persiano.\"],\n[\"gre\",-404,-403,\"Governo dei Trenta Tiranni\",\"Imposto da Lisandro dopo la resa di Atene, il governo oligarchico di Crizia e Teramene fa uccidere circa 1.500 cittadini. Nel 403 Trasibulo, partendo da File, restaura la democrazia.\"],\n[\"gre\",-356,-346,\"Terza guerra sacra\",\"I Focesi occupano Delfi e ne usano il tesoro per pagare mercenari. Filippo II interviene, li batte al Campo di Croco (352) e chiude la guerra, entrando nell’Anfizionia delfica.\"],\n[\"ell\",-306,0,\"Battaglia di Salamina di Cipro\",\"Demetrio Poliorcete batte la flotta di Tolomeo I. Dopo la vittoria suo padre Antigono Monoftalmo si proclama re e gli altri Diadochi lo imitano.\"],\n[\"ell\",-279,0,\"Attacco dei Galati a Delfi\",\"I Celti di Brenno invadono la Grecia e raggiungono Delfi, dove sono respinti dalle truppe etolie e focesi. Una parte di loro passerà in Asia Minore e fonderà la Galazia.\"],\n[\"ell\",-188,0,\"Pace di Apamea\",\"Dopo Magnesia, Antioco III cede ai Romani e ai loro alleati tutta l’Asia Minore a ovest del Tauro e paga un’enorme indennità: il regno seleucide non sarà più una grande potenza.\"],\n[\"ell\",-148,0,\"Macedonia provincia romana\",\"Dopo la sconfitta dello pseudo-Filippo Andrisco, Roma trasforma il regno di Macedonia in provincia, con governatore a Tessalonica.\"],\n[\"gre\",267,0,\"Eruli ad Atene\",\"Barbari Eruli saccheggiano Atene e distruggono molti edifici dell’agorà. La città è difesa dallo storico Dessippo e comincia a ritirarsi dentro mura più piccole.\"],\n[\"rep\",-477,0,\"Battaglia del Cremera\",\"I 306 Fabii, famiglia patrizia che aveva assunto da sola la guerra contro Veio, sono sterminati in un’imboscata. Sopravvive un solo ragazzo.\"],\n[\"rep\",-340,-338,\"Guerra latina\",\"Roma sconfigge a Veseri e a Trifano la Lega latina, che combatte per la parità dei diritti. Le città latine sono sciolte e legate a Roma con trattati diversi.\"],\n[\"rep\",-326,-304,\"Seconda guerra sannitica\",\"Roma e i Sanniti si contendono la Campania. Roma subisce l’umiliazione delle Forche Caudine nel 321, ma risponde con nuove colonie, la via Appia e una riforma militare.\"],\n[\"rep\",-298,-290,\"Terza guerra sannitica\",\"I Sanniti formano una coalizione con Etruschi, Umbri e Galli ma sono sconfitti a Sentino (295). Nel 290 Manio Curio Dentato chiude la guerra e annette la Sabina.\"],\n[\"rep\",-225,0,\"Battaglia di Talamone\",\"Presso la costa etrusca i consoli Emilio Papo e Attilio Regolo annientano i Galli, che marciavano su Roma. È la fine del pericolo gallico nell’Italia centrale.\"],\n[\"rep\",-222,0,\"Battaglia di Clastidium\",\"Il console Claudio Marcello uccide in duello il capo gallo Viridomaro e riceve le spoglie opime, il terzo e ultimo a ottenerle nella storia romana.\"],\n[\"rep\",-147,-139,\"Guerra di Viriato\",\"Il capo lusitano Viriato, con una guerriglia efficace, sconfigge più volte i Romani in Spagna. Nel 139 è assassinato da tre suoi compagni corrotti dal console Cepione.\"],\n[\"rep\",-87,0,\"Mario e Cinna prendono Roma\",\"Mario, tornato dall’Africa, e il console Cinna occupano Roma e scatenano una strage di avversari di Silla. Mario muore all’inizio dell’86, al suo settimo consolato.\"],\n[\"rep\",-80,-72,\"Guerra di Sertorio\",\"Quinto Sertorio, un mariano ribelle, si fa capo dei Lusitani e per otto anni tiene testa a Metello e a Pompeo in Spagna. Nel 72 è assassinato dai suoi ufficiali.\"],\n[\"rep\",-69,0,\"Battaglia di Tigranocerta\",\"Lucullo, con circa 15.000 uomini, sconfigge Tigrane II d’Armenia e il suo enorme esercito sotto le mura della capitale. Poi l’ammutinamento delle truppe lo costringe a fermarsi.\"],\n[\"rep\",-67,0,\"Pompeo contro i pirati\",\"Con i poteri speciali della legge Gabinia, Pompeo ripulisce il Mediterraneo dalla pirateria in soli tre mesi, ottenendo un prestigio enorme.\"],\n[\"rep\",-48,-47,\"Guerra alessandrina\",\"Cesare, assediato nel palazzo reale di Alessandria insieme a Cleopatra, affronta le truppe di Tolomeo XIII. Vince sul Nilo e mette Cleopatra sul trono; nell’incendio brucia una parte della Biblioteca.\"],\n[\"rep\",-29,-19,\"Guerre cantabriche\",\"Augusto e il generale Agrippa conquistano il nord della Spagna dopo dieci anni di guerra contro Cantabri e Asturi, ultimi popoli liberi della penisola.\"],\n[\"imp\",19,0,\"Morte di Germanico\",\"Il generale più amato di Roma muore ad Antiochia, forse avvelenato dal governatore Pisone. La vicenda divide la corte di Tiberio.\"],\n[\"imp\",31,0,\"Caduta di Seiano\",\"Il potente prefetto del pretorio, che governava Roma per conto di Tiberio ritirato a Capri, è arrestato e strangolato in carcere dopo una lettera al Senato.\"],\n[\"imp\",41,0,\"Claudio acclamato imperatore\",\"Dopo l’uccisione di Caligola, i pretoriani trovano Claudio nascosto dietro una tenda e lo proclamano imperatore: il primo scelto dall’esercito.\"],\n[\"imp\",59,0,\"Assassinio di Agrippina\",\"Nerone fa uccidere la madre Agrippina minore, dopo un fallito naufragio organizzato a Baia. È l’inizio della deriva tirannica del suo regno.\"],\n[\"imp\",65,0,\"Congiura dei Pisoni\",\"Una congiura di senatori e ufficiali contro Nerone è scoperta; molti, tra cui Seneca e il poeta Lucano, sono costretti al suicidio.\"],\n[\"imp\",68,69,\"Galba\",\"Governatore della Spagna, si ribella a Nerone, che si uccide nel giugno del 68. Salito al trono a 71 anni, è ucciso dai pretoriani all’inizio del 69.\"],\n[\"imp\",69,0,\"Seconda battaglia di Bedriaco\",\"Le legioni danubiane di Vespasiano, guidate da Antonio Primo, sconfiggono presso Cremona le truppe di Vitellio: la strada per Roma è aperta.\"],\n[\"imp\",166,180,\"Guerre marcomanniche\",\"Marco Aurelio combatte sul Danubio contro Marcomanni, Quadi e Iazigi, che invadono l’Italia settentrionale e assediano Aquileia. Le guerre durano fino alla sua morte a Vindobona nel 180.\"],\n[\"imp\",175,0,\"Rivolta di Avidio Cassio\",\"Il governatore della Siria si proclama imperatore dopo una falsa notizia sulla morte di Marco Aurelio; viene ucciso dai suoi ufficiali dopo tre mesi.\"],\n[\"imp\",194,0,\"Battaglia di Isso (194)\",\"Settimio Severo sconfigge Pescennio Nigro, governatore della Siria, nella stessa pianura in Cilicia dove Alessandro aveva battuto Dario.\"],\n[\"imp\",218,222,\"Eliogabalo\",\"Giovane sacerdote del dio solare di Emesa, sale al trono a 14 anni e impone il suo culto a Roma. È ucciso dai pretoriani nel 222.\"],\n[\"imp\",253,260,\"Valeriano\",\"Imperatore con il figlio Gallieno, affronta Goti e Persiani. Nel 260 è catturato da Shapur I a Edessa e muore prigioniero.\"],\n[\"imp\",276,282,\"Probo\",\"Generale illirico, restaura la frontiera del Reno e del Danubio, poi è ucciso dai soldati ribelli mentre li impiega in lavori pubblici.\"],\n[\"imp\",293,0,\"Tetrarchia\",\"Diocleziano nomina due Cesari, Galerio e Costanzo Cloro, accanto agli Augusti. Il potere è diviso tra quattro sovrani e le capitali sono Nicomedia, Milano, Sirmio e Treviri.\"],\n[\"imp\",364,0,\"Valentiniano e Valente\",\"Valentiniano I è proclamato imperatore e nomina il fratello Valente suo collega per l’Oriente: l’impero è diviso in due parti per ragioni di governo.\"],\n[\"imp\",375,0,\"Arrivo degli Unni\",\"Provenienti dalle steppe, gli Unni attraversano il Don e piegano gli Alani e gli Ostrogoti. Spingono i Visigoti a chiedere asilo oltre il Danubio, innescando le grandi migrazioni.\"],\n[\"imp\",376,0,\"I Goti passano il Danubio\",\"Con il consenso dell’imperatore Valente circa 100.000 Visigoti si stabiliscono nei Balcani. Lo sfruttamento dei funzionari romani li porta alla rivolta e ad Adrianopoli.\"],\n[\"imp\",452,0,\"Attila in Italia\",\"Dopo aver devastato Aquileia e la Pianura Padana, Attila incontra presso il Mincio papa Leone I. Per la peste e le difficoltà di rifornimento si ritira.\"],\n[\"imp\",475,476,\"Oreste e Romolo Augustolo\",\"Il generale Oreste detronizza l’imperatore Giulio Nepote e fa proclamare il figlio Romolo Augustolo, di circa 14 anni. Ucciso Oreste da Odoacre nel 476, il ragazzo è l’ultimo imperatore.\"],\n[\"reg\",476,0,\"Odoacre re d’Italia\",\"Depone Romolo Augustolo e governa da Ravenna.\"],\n[\"reg\",489,526,\"Teodorico il Grande\",\"Re degli Ostrogoti, regna sull’Italia da Ravenna.\"],\n[\"reg\",500,0,\"Monte Badon\",\"Britanni contro Sassoni: da qui la leggenda di re Artù.\",1],\n[\"reg\",507,711,\"Regno visigoto di Toledo\",\"Dopo Vouillé i Visigoti dominano la Spagna fino agli Arabi.\"],\n[\"reg\",568,774,\"Regno dei Longobardi\",\"Alboino scende dal Friuli; capitale Pavia.\"],\n[\"reg\",587,0,\"Recaredo cattolico\",\"Il re visigoto abbandona l’arianesimo a Toledo.\"],\n[\"reg\",643,0,\"Editto di Rotari\",\"Il re longobardo mette per iscritto le leggi del suo popolo.\"],\n[\"biz\",527,565,\"Giustiniano\",\"Imperatore a Costantinopoli con la moglie Teodora.\"],\n[\"biz\",529,534,\"Corpus iuris civilis\",\"Il giurista Triboniano riordina il diritto romano.\"],\n[\"biz\",532,0,\"Rivolta Nika\",\"Giustiniano soffoca la rivolta nell’Ippodromo.\"],\n[\"biz\",535,553,\"Guerra gotica\",\"Belisario e Narsete riconquistano l’Italia agli Ostrogoti.\"],\n[\"biz\",541,0,\"Peste di Giustiniano\",\"Dall’Egitto a Costantinopoli, uccide milioni di persone.\"],\n[\"biz\",610,641,\"Eraclio\",\"Batte i Persiani a Ninive, poi perde Siria ed Egitto.\"],\n[\"biz\",626,0,\"Assedio di Costantinopoli\",\"Avari e Persiani attaccano invano le mura.\"],\n[\"biz\",674,678,\"Primo assedio arabo\",\"Il fuoco greco salva Costantinopoli.\"],\n[\"biz\",717,718,\"Secondo assedio arabo\",\"Leone III Isaurico respinge gli Omayyadi.\"],\n[\"biz\",726,843,\"Iconoclastia\",\"Divieto delle immagini sacre, voluto da Leone III.\"],\n[\"biz\",843,0,\"Trionfo delle icone\",\"L’imperatrice Teodora ripristina il culto delle immagini.\"],\n[\"biz\",867,1056,\"Dinastia macedone\",\"Età d’oro di Bisanzio, da Basilio I a Teodora.\"],\n[\"biz\",976,1025,\"Basilio II\",\"Il Bulgaroctono conquista la Bulgaria nel 1018.\"],\n[\"biz\",988,0,\"Battesimo della Rus’\",\"Vladimiro di Kiev si battezza e sposa Anna di Bisanzio.\"],\n[\"biz\",1054,0,\"Scisma d’Oriente\",\"Papa Leone IX e il patriarca Cerulario si scomunicano.\"],\n[\"biz\",1071,0,\"Manzicerta\",\"Nel 1071, in Armenia, il sultano selgiuchide Alp Arslan batte e cattura l’imperatore Romano IV Diogene. Bisanzio perde l’Anatolia centrale, dove si insediano i Turchi: è il preludio all’appello che porterà alla prima crociata.\"],\n[\"biz\",1081,1118,\"Alessio I Comneno\",\"Salva l’impero e chiede aiuto all’Occidente.\"],\n[\"biz\",1204,1261,\"Impero latino\",\"Baldovino di Fiandra e successori regnano a Costantinopoli.\"],\n[\"biz\",1204,0,\"Sacco di Costantinopoli\",\"La quarta crociata, guidata dal doge Dandolo, conquista la città.\"],\n[\"biz\",1261,0,\"Riconquista bizantina\",\"Michele VIII Paleologo riprende la capitale.\"],\n[\"biz\",1402,0,\"Ankara\",\"Tamerlano batte Bayezid I e rinvia di vent’anni la caduta di Costantinopoli.\"],\n[\"biz\",1453,0,\"Caduta di Costantinopoli\",\"Maometto II conquista la città; muore Costantino XI.\"],\n[\"isl\",610,0,\"Prima rivelazione\",\"Maometto riceve il Corano a Mecca, sul monte Hira.\",1],\n[\"isl\",622,0,\"Egira\",\"Maometto emigra a Medina: inizia il calendario islamico.\"],\n[\"isl\",632,0,\"Morte di Maometto\",\"L’8 giugno 632 Maometto muore a Medina a circa 62 anni dopo aver unificato l’Arabia. Gli succede Abu Bakr come primo califfo, scelto dalla comunità dei compagni.\"],\n[\"isl\",632,661,\"Califfi ortodossi\",\"I primi quattro successori di Maometto, Abu Bakr, Omar, Othman e Ali, governano da Medina e conquistano Siria, Egitto, Iraq e Persia. L’assassinio di Othman e la guerra civile portano allo scisma tra sunniti e sciiti.\"],\n[\"isl\",636,0,\"Yarmuk\",\"Gli Arabi battono Bisanzio e conquistano la Siria.\"],\n[\"isl\",637,0,\"Qadisiyya\",\"Intorno al 636-637 un esercito arabo guidato da Sad ibn Abi Waqqas sconfigge i Persiani di Rostam Farrokhzad a Qadisiyya, in Iraq. Cade poco dopo la capitale sasanide Ctesifonte.\"],\n[\"isl\",661,750,\"Califfato omayyade\",\"Capitale Damasco, da cui si espandono fino alla Spagna.\"],\n[\"isl\",680,0,\"Karbala\",\"Husayn, nipote di Maometto, è ucciso: si apre la frattura sciita.\"],\n[\"isl\",711,0,\"Conquista della Spagna\",\"Tariq ibn Ziyad batte re Rodrigo a Guadalete.\"],\n[\"isl\",750,1258,\"Califfato abbaside\",\"Capitale Baghdad, centro di scienza e commerci.\"],\n[\"isl\",762,0,\"Fondazione di Baghdad\",\"Al-Mansur costruisce la Città rotonda sul Tigri.\"],\n[\"isl\",786,809,\"Harun al-Rashid\",\"Il califfo delle Mille e una notte scambia doni con Carlo Magno.\"],\n[\"isl\",929,1031,\"Califfato di Cordova\",\"Con Abd al-Rahman III la Spagna omayyade è la più colta d’Europa.\"],\n[\"isl\",969,0,\"Fondazione del Cairo\",\"I Fatimidi costruiscono la città e la moschea di Al-Azhar.\"],\n[\"isl\",1187,0,\"Hattin\",\"Il 4 luglio 1187, in Galilea, Saladino accerchia i crociati di Guido di Lusignano, assetati ed esausti, e li annienta. Cade la Vera Croce e in ottobre Gerusalemme si arrende dopo 88 anni di dominio cristiano.\"],\n[\"isl\",1250,1517,\"Sultanato mamelucco\",\"Fondato nel 1250 da ex schiavi-soldato turchi, governa Egitto e Siria dal Cairo. Sconfigge i Mongoli ad Ain Jalut (1260), scaccia gli ultimi crociati da Acri (1291) e cade nel 1517 per la conquista ottomana.\"],\n[\"isl\",1258,0,\"Distruzione di Baghdad\",\"I Mongoli di Hulagu uccidono l’ultimo califfo abbaside.\"],\n[\"isl\",1260,0,\"Ain Jalut\",\"I Mamelucchi fermano i Mongoli in Palestina.\"],\n[\"isl\",1492,0,\"Caduta di Granada\",\"Isabella e Ferdinando concludono la Reconquista.\"],\n[\"fra\",481,511,\"Clodoveo\",\"Fonda il regno dei Franchi, con i Merovingi.\"],\n[\"fra\",496,0,\"Battesimo di Clodoveo\",\"Si converte al cattolicesimo a Reims.\",1],\n[\"fra\",732,0,\"Poitiers\",\"Nell’ottobre del 732 Carlo Martello ferma tra Tours e Poitiers l’esercito dell’emiro omayyade Abd al-Rahman, che muore nello scontro. Fu soprattutto una grande razzia respinta, ma la vittoria consacra la dinastia carolingia.\"],\n[\"fra\",751,0,\"Pipino il Breve re\",\"Con l’appoggio del papa depone l’ultimo Merovingio.\"],\n[\"fra\",756,0,\"Donazione di Pipino\",\"Nel 756 Pipino il Breve, dopo aver sconfitto il re longobardo Astolfo, dona a papa Stefano II i territori dell’Esarcato di Ravenna e della Pentapoli. Nasce lo Stato della Chiesa.\"],\n[\"fra\",768,814,\"Carlo Magno\",\"Conquista Sassonia e Italia longobarda; capitale Aquisgrana.\"],\n[\"fra\",774,0,\"Caduta dei Longobardi\",\"Nel 774 Carlo Magno, chiamato dal papa Adriano I, assedia Pavia e depone il re Desiderio. Prende il titolo di re dei Franchi e dei Longobardi e inizia il dominio carolingio sull’Italia.\"],\n[\"fra\",778,0,\"Roncisvalle\",\"I Baschi sorprendono la retroguardia franca: nasce la Chanson de Roland.\"],\n[\"fra\",800,0,\"Incoronazione imperiale\",\"Papa Leone III incorona Carlo Magno a Roma, a Natale.\"],\n[\"fra\",843,0,\"Trattato di Verdun\",\"I nipoti di Carlo Magno si dividono l’impero.\"],\n[\"fra\",955,0,\"Lechfeld\",\"Ottone I batte gli Ungari presso Augusta.\"],\n[\"fra\",962,0,\"Ottone I imperatore\",\"Incoronato a Roma: nasce il Sacro Romano Impero.\"],\n[\"fra\",987,0,\"Ugo Capeto\",\"Nel 987 i grandi del regno eleggono re di Francia Ugo Capeto, duca dei Franchi, dopo la fine dei Carolingi. Inizia la dinastia capetingia, destinata a governare per oltre otto secoli.\"],\n[\"fra\",1077,0,\"Canossa\",\"Enrico IV si umilia davanti a papa Gregorio VII.\"],\n[\"fra\",1122,0,\"Concordato di Worms\",\"Enrico V e Callisto II chiudono la lotta per le investiture.\"],\n[\"fra\",1152,1190,\"Federico Barbarossa\",\"Imperatore svevo, scende sei volte in Italia.\"],\n[\"fra\",1176,0,\"Legnano\",\"Il 29 maggio 1176 la fanteria della Lega lombarda, difesa dal Carroccio, resiste e travolge la cavalleria di Federico Barbarossa. L’imperatore deve trattare e con la pace di Costanza (1183) i comuni ottengono ampie autonomie.\"],\n[\"fra\",1220,1250,\"Federico II\",\"Imperatore e re di Sicilia, tra Palermo e Castel del Monte.\"],\n[\"fra\",1273,0,\"Rodolfo d’Asburgo\",\"Eletto re dei Romani: inizia la fortuna degli Asburgo.\"],\n[\"fra\",1356,0,\"Bolla d’oro\",\"Carlo IV fissa come si elegge l’imperatore.\"],\n[\"chi\",590,604,\"Gregorio Magno\",\"Papa riformatore: manda missionari in Inghilterra.\"],\n[\"chi\",597,0,\"Agostino a Canterbury\",\"Evangelizza gli Angli alla corte del re Etelberto.\"],\n[\"chi\",664,0,\"Sinodo di Whitby\",\"La Chiesa inglese accetta il rito romano.\"],\n[\"chi\",910,0,\"Fondazione di Cluny\",\"Guglielmo d’Aquitania avvia la riforma monastica.\"],\n[\"chi\",1059,0,\"Elezione dei papi\",\"Niccolò II affida l’elezione ai cardinali.\"],\n[\"chi\",1073,1085,\"Gregorio VII\",\"Ildebrando di Soana lotta per le investiture.\"],\n[\"chi\",1095,0,\"Concilio di Clermont\",\"Il 27 novembre 1095 papa Urbano II, davanti a vescovi e nobili riuniti a Clermont, invita alla crociata per liberare Gerusalemme e soccorrere Bisanzio. La folla risponde: «Dio lo vuole».\"],\n[\"chi\",1096,1099,\"Prima crociata\",\"Goffredo di Buglione e Raimondo di Tolosa verso Gerusalemme.\"],\n[\"chi\",1099,0,\"Presa di Gerusalemme\",\"Il 15 luglio i crociati entrano in città.\"],\n[\"chi\",1118,0,\"Cavalieri Templari\",\"Ugo di Payns fonda l’ordine a Gerusalemme.\"],\n[\"chi\",1147,1149,\"Seconda crociata\",\"Luigi VII e Corrado III falliscono davanti a Damasco.\"],\n[\"chi\",1189,1192,\"Terza crociata\",\"Riccardo Cuor di Leone contro Saladino, tra Acri e Giaffa.\"],\n[\"chi\",1202,1204,\"Quarta crociata\",\"Deviata su Costantinopoli dai Veneziani.\"],\n[\"chi\",1209,1229,\"Crociata contro i catari\",\"Simone di Montfort nel Midi, da Béziers a Tolosa.\"],\n[\"chi\",1212,0,\"Las Navas de Tolosa\",\"Gli eserciti cristiani battono gli Almohadi in Andalusia.\"],\n[\"chi\",1215,0,\"Lateranense IV\",\"Innocenzo III al culmine del potere papale.\"],\n[\"chi\",1228,1229,\"Sesta crociata\",\"Federico II ottiene Gerusalemme per via diplomatica.\"],\n[\"chi\",1291,0,\"Caduta di Acri\",\"Finisce la presenza crociata in Terrasanta.\"],\n[\"chi\",1302,0,\"Unam Sanctam\",\"Bonifacio VIII afferma la supremazia del papa.\"],\n[\"chi\",1303,0,\"Schiaffo di Anagni\",\"Gli uomini di Filippo il Bello umiliano Bonifacio VIII.\"],\n[\"chi\",1309,1377,\"Papato avignonese\",\"Dal 1309 al 1377, da Clemente V a Gregorio XI, i papi risiedono ad Avignone sotto l’influenza dei re di Francia. Caterina da Siena convince Gregorio XI a tornare a Roma.\"],\n[\"chi\",1378,1417,\"Scisma d’Occidente\",\"Si contendono il papato due, poi tre papi.\"],\n[\"chi\",1415,0,\"Rogo di Jan Hus\",\"Il riformatore boemo è condannato a Costanza.\"],\n[\"eur\",793,0,\"Lindisfarne\",\"I Vichinghi saccheggiano il monastero in Northumbria.\"],\n[\"eur\",793,1066,\"Età vichinga\",\"Danesi, Norvegesi e Svedesi da Dublino a Kiev.\"],\n[\"eur\",871,899,\"Alfredo il Grande\",\"Re del Wessex, batte i Danesi a Edington.\"],\n[\"eur\",911,0,\"Rollone in Normandia\",\"Il capo vichingo riceve il ducato da Carlo il Semplice.\"],\n[\"eur\",1000,0,\"Leif Eriksson\",\"I Vichinghi raggiungono il Vinland, in America.\",1],\n[\"eur\",1000,1300,\"Età dei comuni\",\"Milano, Firenze, Genova, Pisa e Venezia si governano da sole.\",1],\n[\"eur\",1066,0,\"Hastings\",\"Il 14 ottobre 1066 Guglielmo di Normandia sconfigge il re anglosassone Aroldo II presso Hastings: Aroldo muore, secondo la tradizione colpito a un occhio da una freccia. Guglielmo è incoronato a Natale a Westminster e cambia per sempre l’Inghilterra.\"],\n[\"eur\",1085,0,\"Domesday Book\",\"Nel 1085-86 Guglielmo il Conquistatore ordina un’inchiesta su terreni, persone e bestiame di ogni contea inglese. Il Domesday Book, l’elenco che ne risulta, fissa le basi del fisco normanno.\"],\n[\"eur\",1130,1194,\"Regno normanno di Sicilia\",\"Ruggero II governa da Palermo; sorge Monreale.\"],\n[\"eur\",1154,1189,\"Enrico II\",\"Plantageneto, regna su Inghilterra e metà Francia.\"],\n[\"eur\",1170,0,\"Uccisione di Becket\",\"L’arcivescovo è ucciso nella cattedrale di Canterbury.\"],\n[\"eur\",1180,1223,\"Filippo II Augusto\",\"Rafforza la monarchia francese; vince a Bouvines nel 1214.\"],\n[\"eur\",1215,0,\"Magna Carta\",\"Giovanni Senzaterra la concede a Runnymede.\"],\n[\"eur\",1282,0,\"Vespri siciliani\",\"Il lunedì di Pasqua del 1282 a Palermo scoppia la rivolta contro il dominio angioino di Carlo I. I Siciliani massacrano i Francesi e chiamano Pietro III d’Aragona: si apre una guerra ventennale.\"],\n[\"eur\",1284,0,\"Meloria\",\"Il 6 agosto 1284 la flotta genovese guidata da Oberto Doria batte quella pisana di Morosini davanti alle secche della Meloria. Pisa perde la supremazia marittima e migliaia di prigionieri.\"],\n[\"eur\",1314,0,\"Bannockburn\",\"Roberto Bruce batte gli Inglesi di Edoardo II.\"],\n[\"eur\",1337,1453,\"Guerra dei Cent’anni\",\"Dal 1337 al 1453 Inghilterra e Francia si scontrano per il trono francese e il controllo di Aquitania e Fiandre. Tra le vittorie inglesi Crécy, Poitiers e Azincourt; Giovanna d’Arco e Carlo VII ribaltano le sorti.\"],\n[\"eur\",1346,0,\"Crécy\",\"Edoardo III e il Principe Nero battono i Francesi con gli arcieri.\"],\n[\"eur\",1347,1353,\"Peste nera\",\"Dalla Crimea a Messina e in tutta Europa: forse un terzo dei morti.\"],\n[\"eur\",1356,0,\"Poitiers (1356)\",\"I Francesi sono sconfitti e re Giovanni II è catturato.\"],\n[\"eur\",1378,0,\"Ciompi\",\"Nel luglio 1378 gli operai salariati dell’Arte della lana, i ciompi, guidati da Michele di Lando, prendono il Palazzo della Signoria a Firenze e ottengono rappresentanza. Il governo popolare cade dopo poche settimane.\"],\n[\"eur\",1381,0,\"Rivolta di Wat Tyler\",\"Nel giugno 1381 migliaia di contadini inglesi, guidati da Wat Tyler e dal predicatore John Ball, marciano su Londra contro la tassa pro capite. Tyler è ucciso davanti al re Riccardo II e la rivolta si spegne.\"],\n[\"eur\",1397,0,\"Unione di Kalmar\",\"Margherita I unisce Danimarca, Norvegia e Svezia.\"],\n[\"eur\",1410,0,\"Grunwald\",\"Polacchi e Lituani battono i Cavalieri teutonici.\"],\n[\"eur\",1415,0,\"Azincourt\",\"Il 25 ottobre 1415 Enrico V, con circa 6.000 uomini e soprattutto arcieri con l’arco lungo, sbaraglia in un campo fangoso la cavalleria francese, molto più numerosa. Muoiono migliaia di nobili francesi.\"],\n[\"eur\",1429,0,\"Orléans\",\"L’8 maggio 1429 una giovane contadina, Giovanna d’Arco, guida le truppe di Carlo VII a liberare Orléans dall’assedio inglese iniziato sei mesi prima. Il successo porta all’incoronazione del re a Reims.\"],\n[\"eur\",1431,0,\"Rogo di Giovanna d’Arco\",\"Il 30 maggio 1431 Giovanna d’Arco, catturata dai Borgognoni e consegnata agli Inglesi, è condannata come eretica da un tribunale presieduto dal vescovo Cauchon e arsa viva a Rouen. Sarà riabilitata nel 1456.\"],\n[\"eur\",1434,0,\"Cosimo de’ Medici\",\"Inizia la signoria medicea a Firenze.\"],\n[\"eur\",1455,1485,\"Guerra delle due rose\",\"Dal 1455 al 1485 le casate di York (rosa bianca) e Lancaster (rosa rossa) si contendono il trono inglese. Finisce con la morte di Riccardo III a Bosworth e l’ascesa di Enrico Tudor, che sposa Elisabetta di York.\"],\n[\"eur\",1455,0,\"Bibbia di Gutenberg\",\"A Magonza, la stampa a caratteri mobili.\"],\n[\"eur\",1469,0,\"Isabella e Ferdinando\",\"Il matrimonio unisce Castiglia e Aragona.\"],\n[\"eur\",1492,0,\"Colombo\",\"Parte da Palos e raggiunge le Americhe.\"],\n[\"mon\",618,907,\"Dinastia Tang\",\"Capitale Chang’an, età d’oro della Cina.\"],\n[\"mon\",751,0,\"Talas\",\"Gli Arabi battono i Cinesi: la carta arriva in Occidente.\"],\n[\"mon\",960,1279,\"Dinastia Song\",\"Bussola, polvere da sparo e stampa.\"],\n[\"mon\",1185,1333,\"Shogunato di Kamakura\",\"Yoritomo Minamoto governa il Giappone dei samurai.\"],\n[\"mon\",1206,1368,\"Impero mongolo\",\"Fondato da Gengis Khan nel 1206, si estende dalla Corea all’Ungheria ed è il più grande impero continuo della storia. Dopo il 1260 si divide in quattro khanati.\"],\n[\"mon\",1206,0,\"Gengis Khan\",\"Proclamato capo dei Mongoli presso il fiume Onon.\"],\n[\"mon\",1219,1221,\"Campagna in Khwarezm\",\"Gengis Khan prende Bukhara e Samarcanda.\"],\n[\"mon\",1241,0,\"Legnica\",\"I Mongoli battono Polacchi e Tedeschi in Slesia.\"],\n[\"mon\",1271,1295,\"Marco Polo\",\"Dal viaggio a Pechino al ritorno a Venezia.\"],\n[\"mon\",1279,0,\"Kublai Khan in Cina\",\"Nipote di Gengis Khan, nel 1271 fonda la dinastia Yuan e nel 1279 conquista la Cina meridionale dei Song. Governa da Khanbaliq (Pechino) e accoglie a corte il veneziano Marco Polo.\"],\n[\"mon\",1281,0,\"Kamikaze\",\"I tifoni distruggono la flotta mongola davanti al Giappone.\"],\n[\"mon\",1324,0,\"Mansa Musa alla Mecca\",\"Il re del Mali porta tanto oro da far crollare il prezzo.\"],\n[\"mon\",1325,0,\"Tenochtitlan\",\"Gli Aztechi fondano la città sul lago Texcoco.\",1],\n[\"mon\",1368,1644,\"Dinastia Ming\",\"Zhu Yuanzhang libera la Cina dai Mongoli; capitale Pechino.\"],\n[\"mon\",1370,1405,\"Tamerlano\",\"Da Samarcanda conquista l’Asia da Delhi ad Ankara.\"],\n[\"mon\",1405,1433,\"Spedizioni di Zheng He\",\"Flotte Ming fino all’Africa orientale.\"],\n[\"reg\",507,0,\"Battaglia di Vouillé\",\"Clodoveo sconfigge e uccide Alarico II, re dei Visigoti, vicino a Poitiers. I Visigoti perdono quasi tutta la Gallia e si ritirano in Spagna.\"],\n[\"reg\",552,0,\"Battaglia di Tagina\",\"Il generale Narsete, inviato da Giustiniano, sconfigge i Goti in Umbria e uccide il re Totila. Il regno ostrogoto è ormai spezzato.\"],\n[\"eur\",722,0,\"Battaglia di Covadonga\",\"Pelagio sconfigge un piccolo contingente musulmano sulle montagne delle Asturie. È l’inizio simbolico della Reconquista cristiana della Spagna.\"],\n[\"fra\",741,0,\"Morte di Carlo Martello\",\"Maestro di palazzo dei Franchi e vincitore a Poitiers, muore a Quierzy lasciando il potere ai figli Carlomanno e Pipino il Breve.\"],\n[\"fra\",841,0,\"Battaglia di Fontenoy\",\"Lotario I è sconfitto dai fratelli Carlo il Calvo e Ludovico il Germanico. Due anni dopo, con il trattato di Verdun, l’impero carolingio viene diviso.\"],\n[\"fra\",1106,0,\"Morte di Enrico IV\",\"Muore a Liegi, scomunicato e deposto dal figlio Enrico V. Il corpo resta insepolto per cinque anni a causa della scomunica.\"],\n[\"isl\",1174,1193,\"Saladino\",\"Diventa sultano d’Egitto nel 1174, unisce Egitto e Siria, riconquista Gerusalemme dopo Hattin nel 1187 e muore a Damasco nel 1193 dopo la pace con Riccardo.\"],\n[\"isl\",1389,0,\"Battaglia del Kosovo\",\"Gli Ottomani di Murad I affrontano i Serbi del principe Lazar. Muoiono entrambi i comandanti: per i Serbi è i
