<title>Lexicon Latinum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica centrata; ricerca grande in alto, schede colorate per categoria grammaticale */
:root{
  --bg:#f4f5fb; --surface:#ffffff; --ink:#181a29; --muted:#656d88; --line:#e2e5f0;
  --n:#e5483a; --n-bg:#fde8e5;
  --a:#0f9a60; --a-bg:#dcf5e8;
  --v:#2563eb; --v-bg:#e0eaff;
  --p:#7a49e8; --p-bg:#ece4ff;
  --m:#b87300; --m-bg:#ffefcc;
  --hit:#fff0a8; --hit-ink:#2f2400;
  --font-display:'Bricolage Grotesque', ui-rounded, 'Avenir Next', system-ui, sans-serif;
  --font-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10111a; --surface:#191b29; --ink:#eef0fb; --muted:#9aa2bf; --line:#2a2d43;
    --n:#ff8274; --n-bg:#3b2021;
    --a:#43d597; --a-bg:#15332a;
    --v:#7ba6ff; --v-bg:#1b2849;
    --p:#b99cff; --p-bg:#2b2248;
    --m:#ffc247; --m-bg:#392d12;
    --hit:#5a4a08; --hit-ink:#fff1b3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10111a; --surface:#191b29; --ink:#eef0fb; --muted:#9aa2bf; --line:#2a2d43;
  --n:#ff8274; --n-bg:#3b2021;
  --a:#43d597; --a-bg:#15332a;
  --v:#7ba6ff; --v-bg:#1b2849;
  --p:#b99cff; --p-bg:#2b2248;
  --m:#ffc247; --m-bg:#392d12;
  --hit:#5a4a08; --hit-ink:#fff1b3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);padding-inline:16px;padding-block:20px 56px;-webkit-text-size-adjust:100%}
.app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--v);outline-offset:2px;border-radius:8px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.dots{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.dots i{width:9px;height:9px;border-radius:50%}
.dots i:nth-child(1){background:var(--n)} .dots i:nth-child(2){background:var(--m)} .dots i:nth-child(3){background:var(--a)}
.dots i:nth-child(4){background:var(--v)} .dots i:nth-child(5){background:var(--p)}
.wm{font:700 26px/1 var(--font-display);letter-spacing:-.02em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn[aria-expanded="true"]{color:var(--v);border-color:var(--v)}
.icon-btn svg{width:22px;height:22px}

.ring{padding:2px;border-radius:999px;background:var(--line);transition:background .25s}
.ring:focus-within{background:linear-gradient(100deg,var(--n),var(--m),var(--a),var(--v),var(--p))}
.field{display:flex;align-items:center;gap:10px;height:58px;padding-inline:20px 8px;border-radius:999px;background:var(--surface)}
.field svg{width:22px;height:22px;flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 19px var(--font-body);outline:0}
.field input::placeholder{color:var(--muted);font-weight:400}
.clear{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.clear svg{width:18px;height:18px}
.count{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid transparent;background:var(--cb,var(--line));color:var(--c,var(--ink));padding:6px 12px;border-radius:999px;font-size:15px;font-weight:600;line-height:1.3}
.chip small{font-weight:400;opacity:.8;font-size:13px}
.chip.plain{background:var(--surface);border-color:var(--line);color:var(--ink)}
.pos-n{--c:var(--n);--cb:var(--n-bg)} .pos-a{--c:var(--a);--cb:var(--a-bg)} .pos-v{--c:var(--v);--cb:var(--v-bg)}
.pos-p{--c:var(--p);--cb:var(--p-bg)} .pos-m{--c:var(--m);--cb:var(--m-bg)}

.panel-box,.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link-btn{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 8px;text-decoration:underline;text-underline-offset:3px}
.empty-note{color:var(--muted);font-size:15px}

.try{display:flex;flex-direction:column;gap:10px}

#out{display:flex;flex-direction:column;gap:16px}
.card{display:block;animation:rise .22s ease both;padding:0}
.card>summary{list-style:none;display:flex;flex-direction:column;gap:14px;padding:20px;cursor:pointer;border-radius:22px;-webkit-tap-highlight-color:transparent}
.card>summary::-webkit-details-marker{display:none}
.card>summary:hover .chev{background:var(--cb)}
.c-body{display:flex;flex-direction:column;gap:16px;padding:0 20px 20px;margin-top:-2px;border-top:1px solid var(--line);padding-top:18px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:background .2s}
.chev::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.card[open]>summary .chev::after{transform:translateY(2px) rotate(-135deg)}
.card[open]>summary{padding-bottom:16px}
.intro{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.intro b{font-weight:600;color:var(--c)}
.uses{display:flex;flex-direction:column;gap:10px}
.use{display:grid;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid var(--line)}
.u-l{font-weight:600;font-size:15px}
.u-e{font-size:15px;color:var(--muted)}
.u-e i{color:var(--ink);font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.ring{transition:none}}
.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.c-side{display:flex;align-items:center;gap:10px;flex:none}
.lemma{font:700 38px/1.05 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere;margin:0}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--cb);color:var(--c);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.tr{font-size:20px;line-height:1.4;margin:0}
.tr span{display:block}.tr span+span{margin-top:2px;font-size:.92em;color:var(--muted)}
.found{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--cb);color:var(--c)}
.found .form{font:700 18px var(--font-display);margin-right:4px;overflow-wrap:anywhere}
.found span.an{font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);padding:3px 10px;border-radius:12px}
.ext{align-self:flex-start;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.ext:hover{color:var(--ink)}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#10111a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#10111a}}
.panel[hidden]{display:none}

.box{border:1px solid var(--line);border-radius:14px;overflow-x:auto;min-width:0}
.cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
table.tbl{border-collapse:collapse;width:100%;font-size:15px;min-width:min-content}
.tbl th{background:var(--cb);color:var(--c);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 12px;white-space:nowrap}
.tbl td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{color:var(--muted);font-size:13px;white-space:nowrap;width:1%}
.tbl td.e{color:var(--muted)}
.tbl td.hit{background:var(--hit);color:var(--hit-ink)}
.tbl b{font-weight:700}
.tbl td>span.f{white-space:nowrap}
.sl{color:var(--muted)}
.hit .sl{color:inherit;opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid2>div,.tgrid>div{min-width:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;font-size:15px}
.kv>span{color:var(--muted)}
.kv>.hit{background:var(--hit);color:var(--hit-ink);border-radius:6px;padding:0 6px;font-weight:700}
details:not(.card){border:1px solid var(--line);border-radius:14px;padding:0 14px}
details:not(.card)>summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px}
details:not(.card)>summary::-webkit-details-marker{display:none}
details:not(.card)>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-right:4px}
details:not(.card)[open]>summary::after{transform:rotate(-135deg)}
details:not(.card)>div{padding-bottom:14px}
.sum-l{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

.nores{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.nores h2{font:700 24px/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}
@media (max-width:480px){
  body{padding-inline:14px}
  .card>summary{padding:16px}.c-body{padding:16px 16px 18px}
  .lemma{font-size:32px}
  .tbl{font-size:14px}.tbl th{padding:7px 8px}.tbl td{padding:6px 8px}
  .tr{font-size:18px}
  .badge{font-size:12px;padding:4px 10px}
}
.loading{color:var(--muted);text-align:center;padding:24px}
/* Schermata di blocco */
.lock{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));background:var(--bg);overflow:auto;transition:opacity .4s,transform .4s}
.lock.open{opacity:0;transform:scale(1.04);pointer-events:none}
.lock .brand{flex-direction:column;gap:14px;text-align:center}
.lock .dots{grid-template-columns:repeat(5,12px);gap:5px}.lock .dots i{width:12px;height:12px}
.lock .wm{font-size:40px}
.lock-sub{color:var(--muted);font-size:15px;margin:0;text-align:center}
.pin{display:flex;gap:9px}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .15s,border-color .15s,transform .15s}
.pin i.on{background:var(--c);border-color:var(--c);transform:scale(1.15)}
.pin i:nth-child(5n+1){--c:var(--n)}.pin i:nth-child(5n+2){--c:var(--m)}.pin i:nth-child(5n+3){--c:var(--a)}.pin i:nth-child(5n+4){--c:var(--v)}.pin i:nth-child(5n){--c:var(--p)}
.pin.bad{animation:shake .4s}.pin.bad i{border-color:var(--n)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 28px var(--font-display);color:var(--ink);-webkit-tap-highlight-color:transparent;transition:background .12s,transform .12s}
.pad button:active{transform:scale(.94);background:var(--line)}
.pad .ghost{border-color:transparent;background:transparent;color:var(--muted);font-size:22px}
.pad .ghost:active{background:transparent}
.lock-msg{min-height:20px;margin:0;font-size:14px;color:var(--n);font-weight:600}
@media (prefers-reduced-motion:reduce){.pin.bad{animation:none}.lock{transition:none}}
</style>

<div class="lock" id="plans" role="dialog" aria-modal="true" aria-label="Scegli il piano">
  <div class="brand"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="wm">Lexicon</span></div>

  </div>
</div>
<div class="ad" id="ad" hidden role="dialog" aria-modal="true" aria-label="Pubblicità">

  <div class="ad-bar" id="adBar"><span></span></div><div class="ad-body"><div class="ad-ico" id="adIco"></div><h2 id="adT"></h2><p id="adP"></p><span class="ad-cta">Scopri di più</span></div>

<div class="fx fx-t" id="fxT"></div>

<script>
/* Motore di flessione latina: genera tutte le forme di ogni lemma e costruisce un indice forma -> lemma. */
var Latin = (function () {
  'use strict';

  // ---------- utilità ----------
  function norm(s) {
    return String(s).toLowerCase().replace(/æ/g, 'ae').replace(/œ/g, 'oe')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/j/g, 'i').replace(/v/g, 'u').replace(/[^a-z]/g, '');
  }
  const CASES = ['nom', 'gen', 'dat', 'acc', 'abl', 'voc'];
  const GENS = ['m', 'f', 'n'];
  const arr = (x) => (Array.isArray(x) ? x : [x]);
  function add(out, tag, f) {
    if (f == null) return;
    for (const x of arr(f)) if (x && x !== '-') out.push([tag, x]);
  }
  const strip = (s, suf) => (s.endsWith(suf) ? s.slice(0, s.length - suf.length) : s);

  // ---------- sostantivi ----------
  function nounTable(type, nom, gen, g, fl) {
    const neut = g === 'n';
    let S, sg, pl;
    if (fl.pl) {
      if (type === 'n1') S = strip(gen, 'arum');
      else if (type === 'n2') S = strip(gen, 'orum');
      else if (type === 'n3') S = strip(gen, 'um');
      else if (type === 'n3i') S = strip(gen, 'ium');
      else if (type === 'n4') S = strip(gen, 'uum');
      else S = strip(gen, 'erum');
    } else {
      if (type === 'n1') S = strip(gen, 'ae');
      else if (type === 'n2') S = strip(gen, 'i');
      else if (type === 'n3' || type === 'n3i') S = strip(gen, 'is');
      else if (type === 'n4') S = strip(gen, 'us');
      else S = strip(gen, 'ei');
    }
    switch (type) {
      case 'n1': {
        const dp = fl.abus ? [S + 'is', S + 'abus'] : S + 'is';
        sg = [S + 'a', S + 'ae', S + 'ae', S + 'am', S + 'a', S + 'a'];
        pl = [S + 'ae', S + 'arum', dp, S + 'as', dp, S + 'ae'];
        break;
      }
      case 'n2':
        if (neut) {
          sg = [nom, S + 'i', S + 'o', nom, S + 'o', nom];
          pl = [S + 'a', S + 'orum', S + 'is', S + 'a', S + 'is', S + 'a'];
        } else {
          const er = !nom.endsWith('us');
          const voc = er ? nom : nom.endsWith('ius') ? S : S + 'e';
          sg = [nom, S + 'i', S + 'o', S + 'um', S + 'o', voc];
          pl = [S + 'i', S + 'orum', S + 'is', S + 'os', S + 'is', S + 'i'];
        }
        break;
      case 'n3':
        if (neut) {
          sg = [nom, S + 'is', S + 'i', nom, S + 'e', nom];
          pl = [S + 'a', S + 'um', S + 'ibus', S + 'a', S + 'ibus', S + 'a'];
        } else {
          sg = [nom, S + 'is', S + 'i', S + 'em', S + 'e', nom];
          pl = [S + 'es', S + 'um', S + 'ibus', S + 'es', S + 'ibus', S + 'es'];
        }
        break;
      case 'n3i':
        if (neut) {
          sg = [nom, S + 'is', S + 'i', nom, S + 'i', nom];
          pl = [S + 'ia', S + 'ium', S + 'ibus', S + 'ia', S + 'ibus', S + 'ia'];
        } else {
          sg = [nom, S + 'is', S + 'i', S + 'em', S + 'e', nom];
          pl = [S + 'es', S + 'ium', S + 'ibus', [S + 'es', S + 'is'], S + 'ibus', S + 'es'];
        }
        break;
      case 'n4':
        if (neut) {
          sg = [nom, S + 'us', S + 'u', nom, S + 'u', nom];
          pl = [S + 'ua', S + 'uum', S + 'ibus', S + 'ua', S + 'ibus', S + 'ua'];
        } else {
          sg = [S + 'us', S + 'us', S + 'ui', S + 'um', S + 'u', S + 'us'];
          pl = [S + 'us', S + 'uum', S + 'ibus', S + 'us', S + 'ibus', S + 'us'];
        }
        break;
      case 'n5':
        sg = [S + 'es', S + 'ei', S + 'ei', S + 'em', S + 'e', S + 'es'];
        pl = [S + 'es', S + 'erum', S + 'ebus', S + 'es', S + 'ebus', S + 'es'];
        break;
      default:
        throw new Error('tipo nome sconosciuto ' + type);
    }
    return { s: fl.pl ? [] : sg, p: fl.sg ? [] : pl };
  }

  // ---------- aggettivi ----------
  function a12Table(mNom, S, o) {
    o = o || {};
    const er = !mNom.endsWith('us');
    const vocM = o.voc || (er ? mNom : S + 'e');
    let s, p;
    if (o.pron) {
      s = {
        m: [mNom, S + 'ius', S + 'i', S + 'um', S + 'o', '-'],
        f: [S + 'a', S + 'ius', S + 'i', S + 'am', S + 'a', '-'],
        n: [o.nNom || S + 'um', S + 'ius', S + 'i', o.nNom || S + 'um', S + 'o', '-'],
      };
    } else {
      s = {
        m: [mNom, S + 'i', S + 'o', S + 'um', S + 'o', vocM],
        f: [S + 'a', S + 'ae', S + 'ae', S + 'am', S + 'a', S + 'a'],
        n: [S + 'um', S + 'i', S + 'o', S + 'um', S + 'o', S + 'um'],
      };
    }
    p = {
      m: [S + 'i', S + 'orum', S + 'is', S + 'os', S + 'is', S + 'i'],
      f: [S + 'ae', S + 'arum', S + 'is', S + 'as', S + 'is', S + 'ae'],
      n: [S + 'a', S + 'orum', S + 'is', S + 'a', S + 'is', S + 'a'],
    };
    return { s, p };
  }
  // tre uscite / due uscite / una uscita (classe II)
  function a3Table(kind, o) {
    const S = o.S;
    const ablI = o.abl || S + 'i';
    const cons = !!o.cons;
    const gp = cons ? S + 'um' : S + 'ium';
    const npn = cons ? S + 'a' : S + 'ia';
    const accpl = cons ? S + 'es' : [S + 'es', S + 'is'];
    const mf = (nom) => [nom, S + 'is', S + 'i', S + 'em', cons ? S + 'e' : ablI, nom];
    let s;
    if (kind === 'a3-2') {
      s = {
        m: mf(S + 'is'), f: mf(S + 'is'),
        n: [S + 'e', S + 'is', S + 'i', S + 'e', ablI, S + 'e'],
      };
    } else if (kind === 'a3-3') {
      s = {
        m: mf(o.m), f: mf(o.f),
        n: [o.n, S + 'is', S + 'i', o.n, ablI, o.n],
      };
    } else {
      s = {
        m: mf(o.nom), f: mf(o.nom),
        n: [o.nom, S + 'is', S + 'i', o.nom, cons ? S + 'e' : ablI, o.nom],
      };
    }
    const pm = [S + 'es', gp, S + 'ibus', accpl, S + 'ibus', S + 'es'];
    const pn = [npn, gp, S + 'ibus', npn, S + 'ibus', npn];
    return { s, p: { m: pm, f: pm, n: pn } };
  }
  function cmpTable(b) { // b = radice comparativo (es. 'meli', 'bonі')
    const mf = (x) => [b + 'or', b + 'oris', b + 'ori', b + 'orem', b + 'ore', b + 'or'];
    return {
      s: { m: mf(), f: mf(), n: [b + 'us', b + 'oris', b + 'ori', b + 'us', b + 'ore', b + 'us'] },
      p: {
        m: [b + 'ores', b + 'orum', b + 'oribus', b + 'ores', b + 'oribus', b + 'ores'],
        f: [b + 'ores', b + 'orum', b + 'oribus', b + 'ores', b + 'oribus', b + 'ores'],
        n: [b + 'ora', b + 'orum', b + 'oribus', b + 'ora', b + 'oribus', b + 'ora'],
      },
    };
  }
  function pushAdj(out, prefix, T) {
    for (const num of ['s', 'p'])
      for (const g of GENS)
        T[num][g].forEach((f, i) => add(out, prefix + '.' + g + '.' + num + '.' + CASES[i], f));
  }
  const ILIS = ['facilis', 'difficilis', 'similis', 'dissimilis', 'gracilis', 'humilis'];

  function adjectiveForms(L) {
    const out = [];
    const p = L.p;
    const fl = L.fl;
    let T, S, mNom;
    if (L.type === 'a12' || L.type === 'a12p') {
      mNom = p[0];
      S = strip(p[1], 'a');
      T = a12Table(mNom, S, { pron: L.type === 'a12p', voc: fl.voc, nNom: L.type === 'a12p' ? p[2] : null });
    } else if (L.type === 'a3') {
      const base = L.base; // già normalizzato in parse
      if (base.kind === 'a3-2') { S = strip(p[0], 'is'); mNom = p[0]; T = a3Table('a3-2', { S }); }
      else if (base.kind === 'a3-3') { S = strip(p[1], 'is'); mNom = p[0]; T = a3Table('a3-3', { S, m: p[0], f: p[1], n: p[2] }); }
      else { S = strip(p[1], 'is'); mNom = p[0]; T = a3Table('a3-1', { S, nom: p[0] }); }
    } else if (L.type === 'a3c') {
      S = strip(p[1], 'is'); mNom = p[0];
      T = a3Table('a3-1', { S, nom: p[0], cons: true });
    }
    pushAdj(out, 'a.pos', T);
    const deg = L.type === 'a3c' ? !!fl.plus : fl.deg !== false;
    // comparativo / superlativo
    let cmpB = null, supNom = null;
    if (deg) {
      cmpB = fl.cmp ? strip(fl.cmp, 'or') : S + 'i';
      pushAdj(out, 'a.cmp', cmpTable(cmpB));
      if (fl.sup) supNom = fl.sup;
      else if (mNom.endsWith('er')) supNom = mNom + 'rimus';
      else if (ILIS.includes(mNom)) supNom = S + 'limus';
      else supNom = S + 'issimus';
      pushAdj(out, 'a.sup', a12Table(supNom, strip(supNom, 'us')));
    }
    // avverbi
    let adv = fl.adv;
    if (adv === undefined && deg) {
      if (L.type === 'a12') adv = S + 'e';
      else if (L.type === 'a3c') adv = null;
      else if (/nt$/.test(S)) adv = S + 'er';
      else adv = S + 'iter';
    }
    if (adv && adv !== '-') {
      add(out, 'a.adv.pos', adv.split('/'));
    }
    if (deg) {
      add(out, 'a.adv.cmp', cmpB + 'us');
      add(out, 'a.adv.sup', strip(supNom, 'us') + 'e');
    }
    return out;
  }

  // ---------- tavole esplicite (pronomi e forme irregolari) ----------
  // X3: 10 righe (sing. nom gen dat acc abl, plur. nom gen dat acc abl) con "m f n"
  const X3 = {
    is: ['is ea id', 'eius eius eius', 'ei ei ei', 'eum eam id', 'eo ea eo', 'ei/ii/i eae ea', 'eorum earum eorum', 'eis/iis/is eis/iis/is eis/iis/is', 'eos eas ea', 'eis/iis/is eis/iis/is eis/iis/is'],
    hic: ['hic haec hoc', 'huius huius huius', 'huic huic huic', 'hunc hanc hoc', 'hoc hac hoc', 'hi hae haec', 'horum harum horum', 'his his his', 'hos has haec', 'his his his'],
    ille: ['ille illa illud', 'illius illius illius', 'illi illi illi', 'illum illam illud', 'illo illa illo', 'illi illae illa', 'illorum illarum illorum', 'illis illis illis', 'illos illas illa', 'illis illis illis'],
    iste: ['iste ista istud', 'istius istius istius', 'isti isti isti', 'istum istam istud', 'isto ista isto', 'isti istae ista', 'istorum istarum istorum', 'istis istis istis', 'istos istas ista', 'istis istis istis'],
    ipse: ['ipse ipsa ipsum', 'ipsius ipsius ipsius', 'ipsi ipsi ipsi', 'ipsum ipsam ipsum', 'ipso ipsa ipso', 'ipsi ipsae ipsa', 'ipsorum ipsarum ipsorum', 'ipsis ipsis ipsis', 'ipsos ipsas ipsa', 'ipsis ipsis ipsis'],
    idem: ['idem eadem idem', 'eiusdem eiusdem eiusdem', 'eidem eidem eidem', 'eundem eandem idem', 'eodem eadem eodem', 'eidem/isdem eaedem eadem', 'eorundem earundem eorundem', 'eisdem/isdem eisdem/isdem eisdem/isdem', 'eosdem easdem eadem', 'eisdem/isdem eisdem/isdem eisdem/isdem'],
    qui: ['qui quae quod', 'cuius cuius cuius', 'cui cui cui', 'quem quam quod', 'quo qua quo', 'qui quae quae', 'quorum quarum quorum', 'quibus/queis quibus/queis quibus/queis', 'quos quas quae', 'quibus/queis quibus/queis quibus/queis'],
    quis: ['quis quis quid', 'cuius cuius cuius', 'cui cui cui', 'quem quem quid', 'quo qua quo', 'qui quae quae', 'quorum quarum quorum', 'quibus quibus quibus', 'quos quas quae', 'quibus quibus quibus'],
    aliquis: ['aliquis/aliqui aliqua aliquid/aliquod', 'alicuius alicuius alicuius', 'alicui alicui alicui', 'aliquem aliquam aliquid/aliquod', 'aliquo aliqua aliquo', 'aliqui aliquae aliqua', 'aliquorum aliquarum aliquorum', 'aliquibus aliquibus aliquibus', 'aliquos aliquas aliqua', 'aliquibus aliquibus aliquibus'],
    alius: ['alius alia aliud', 'alterius alterius alterius', 'alii alii alii', 'alium aliam aliud', 'alio alia alio', 'alii aliae alia', 'aliorum aliarum aliorum', 'aliis aliis aliis', 'alios alias alia', 'aliis aliis aliis'],
    quisque: ['quisque quaeque quidque/quodque', 'cuiusque cuiusque cuiusque', 'cuique cuique cuique', 'quemque quamque quidque/quodque', 'quoque quaque quoque', 'quique quaeque quaeque', 'quorumque quarumque quorumque', 'quibusque quibusque quibusque', 'quosque quasque quaeque', 'quibusque quibusque quibusque'],
    quidam: ['quidam quaedam quiddam/quoddam', 'cuiusdam cuiusdam cuiusdam', 'cuidam cuidam cuidam', 'quendam quandam quiddam/quoddam', 'quodam quadam quodam', 'quidam quaedam quaedam', 'quorundam quarundam quorundam', 'quibusdam quibusdam quibusdam', 'quosdam quasdam quaedam', 'quibusdam quibusdam quibusdam'],
    quicumque: ['quicumque quaecumque quodcumque', 'cuiuscumque cuiuscumque cuiuscumque', 'cuicumque cuicumque cuicumque', 'quemcumque quamcumque quodcumque', 'quocumque quacumque quocumque', 'quicumque quaecumque quaecumque', 'quorumcumque quarumcumque quorumcumque', 'quibuscumque quibuscumque quibuscumque', 'quoscumque quascumque quaecumque', 'quibuscumque quibuscumque quibuscumque'],
    duo: ['duo duae duo', 'duorum duarum duorum', 'duobus duabus duobus', 'duos/duo duas duo', 'duobus duabus duobus', '- - -', '- - -', '- - -', '- - -', '- - -'],
    ambo: ['ambo ambae ambo', 'amborum ambarum amborum', 'ambobus ambabus ambobus', 'ambos/ambo ambas ambo', 'ambobus ambabus ambobus', '- - -', '- - -', '- - -', '- - -', '- - -'],
    tres: ['tres tres tria', 'trium trium trium', 'tribus tribus tribus', 'tres tres tria', 'tribus tribus tribus', '- - -', '- - -', '- - -', '- - -', '- - -'],
    plus: ['- - plus', '- - pluris', '- - -', '- - plus', '- - plure', 'plures plures plura', 'plurium plurium plurium', 'pluribus pluribus pluribus', 'plures/pluris plures/pluris plura', 'pluribus pluribus pluribus'],
    quisquam: ['quisquam quisquam quicquam/quidquam', 'cuiusquam cuiusquam cuiusquam', 'cuiquam cuiquam cuiquam', 'quemquam quemquam quicquam/quidquam', 'quoquam quaquam quoquam', '- - -', '- - -', '- - -', '- - -', '- - -'],
    uterque: ['uterque utraque utrumque', 'utriusque utriusque utriusque', 'utrique utrique utrique', 'utrumque utramque utrumque', 'utroque utraque utroque', 'utrique utraeque utraque', 'utrorumque utrarumque utrorumque', 'utrisque utrisque utrisque', 'utrosque utrasque utraque', 'utrisque utrisque utrisque'],
  };
  // XN: 12 forme (sing. nom gen dat acc abl voc, plur. nom gen dat acc abl voc)
  const XN = {
    deus: ['deus', 'dei', 'deo', 'deum', 'deo', 'deus', 'di/dei/dii', 'deorum/deum', 'dis/deis/diis', 'deos', 'dis/deis/diis', 'di/dei/dii'],
    vis: ['vis', '-', '-', 'vim', 'vi', '-', 'vires', 'virium', 'viribus', 'vires/viris', 'viribus', 'vires'],
    bos: ['bos', 'bovis', 'bovi', 'bovem', 'bove', 'bos', 'boves', 'boum/bovum', 'bobus/bubus', 'boves', 'bobus/bubus', 'boves'],
    domus: ['domus', 'domus/domi', 'domui/domo', 'domum', 'domo', 'domus', 'domus', 'domuum/domorum', 'domibus', 'domos/domus', 'domibus', 'domus'],
    locus: ['locus', 'loci', 'loco', 'locum', 'loco', 'loce', 'loci/loca', 'locorum', 'locis', 'locos/loca', 'locis', 'loci/loca'],
    iuppiter: ['Iuppiter', 'Iovis', 'Iovi', 'Iovem', 'Iove', 'Iuppiter', '-', '-', '-', '-', '-', '-'],
    nemo: ['nemo', 'nullius', 'nemini', 'neminem', 'nullo/nulla', '-', '-', '-', '-', '-', '-', '-'],
    ego: ['ego', 'mei', 'mihi/mi', 'me', 'me', '-', '-', '-', '-', '-', '-', '-'],
    tu: ['tu', 'tui', 'tibi', 'te', 'te', 'tu', '-', '-', '-', '-', '-', '-'],
    nos: ['-', '-', '-', '-', '-', '-', 'nos', 'nostri/nostrum', 'nobis', 'nos', 'nobis', '-'],
    vos: ['-', '-', '-', '-', '-', '-', 'vos', 'vestri/vestrum', 'vobis', 'vos', 'vobis', 'vos'],
    aeneas: ['Aeneas', 'Aeneae', 'Aeneae', 'Aenean/Aeneam', 'Aenea', 'Aenea', '-', '-', '-', '-', '-', '-'],
    achilles: ['Achilles', 'Achillis/Achilli', 'Achilli', 'Achillem/Achillea', 'Achille', 'Achilles/Achille', '-', '-', '-', '-', '-', '-'],
    sui: ['-', 'sui', 'sibi', 'se/sese', 'se/sese', '-', '-', 'sui', 'sibi', 'se/sese', 'se/sese', '-'],
  };
  function explicitNoun(L) {
    const out = [];
    const row = XN[L.p[0].toLowerCase()];
    if (!row) throw new Error('xn mancante ' + L.p[0]);
    row.forEach((f, i) => add(out, 'n.' + (i < 6 ? 's' : 'p') + '.' + CASES[i % 6], f.split('/')));
    return out;
  }
  function explicitAdj(L) {
    const out = [];
    const rows = X3[L.p[0].toLowerCase()];
    if (!rows) throw new Error('x3 mancante ' + L.p[0]);
    rows.forEach((r, i) => {
      const num = i < 5 ? 's' : 'p';
      r.split(' ').forEach((cell, gi) => add(out, 'a.pos.' + GENS[gi] + '.' + num + '.' + CASES[i % 5], cell.split('/')));
    });
    return out;
  }

  // ---------- verbi ----------
  const P6 = ['m', 's', 't', 'mus', 'tis', 'nt'];
  const PP6 = ['r', 'ris', 'tur', 'mur', 'mini', 'ntur'];
  const PERS = ['1s', '2s', '3s', '1p', '2p', '3p'];
  const A4 = { 4: ['iam', 'ies', 'iet', 'iemus', 'ietis', 'ient'] };
  const PRES_A = { 1: ['o', 'as', 'at', 'amus', 'atis', 'ant'], 2: ['eo', 'es', 'et', 'emus', 'etis', 'ent'], 3: ['o', 'is', 'it', 'imus', 'itis', 'unt'], 4: ['io', 'is', 'it', 'imus', 'itis', 'iunt'], 5: ['io', 'is', 'it', 'imus', 'itis', 'iunt'] };
  const PRES_P = { 1: ['or', 'aris', 'atur', 'amur', 'amini', 'antur'], 2: ['eor', 'eris', 'etur', 'emur', 'emini', 'entur'], 3: ['or', 'eris', 'itur', 'imur', 'imini', 'untur'], 4: ['ior', 'iris', 'itur', 'imur', 'imini', 'iuntur'], 5: ['ior', 'eris', 'itur', 'imur', 'imini', 'iuntur'] };
  const IMPF_M = { 1: 'aba', 2: 'eba', 3: 'eba', 4: 'ieba', 5: 'ieba' };
  const FUT_A = { 1: ['abo', 'abis', 'abit', 'abimus', 'abitis', 'abunt'], 2: ['ebo', 'ebis', 'ebit', 'ebimus', 'ebitis', 'ebunt'], 3: ['am', 'es', 'et', 'emus', 'etis', 'ent'], 4: A4[4], 5: A4[4] };
  const FUT_P = { 1: ['abor', 'aberis', 'abitur', 'abimur', 'abimini', 'abuntur'], 2: ['ebor', 'eberis', 'ebitur', 'ebimur', 'ebimini', 'ebuntur'], 3: ['ar', 'eris', 'etur', 'emur', 'emini', 'entur'], 4: ['iar', 'ieris', 'ietur', 'iemur', 'iemini', 'ientur'], 5: ['iar', 'ieris', 'ietur', 'iemur', 'iemini', 'ientur'] };
  const SUBJ_A = { 1: ['em', 'es', 'et', 'emus', 'etis', 'ent'], 2: ['eam', 'eas', 'eat', 'eamus', 'eatis', 'eant'], 3: ['am', 'as', 'at', 'amus', 'atis', 'ant'], 4: ['iam', 'ias', 'iat', 'iamus', 'iatis', 'iant'], 5: ['iam', 'ias', 'iat', 'iamus', 'iatis', 'iant'] };
  const SUBJ_P = { 1: ['er', 'eris', 'etur', 'emur', 'emini', 'entur'], 2: ['ear', 'earis', 'eatur', 'eamur', 'eamini', 'eantur'], 3: ['ar', 'aris', 'atur', 'amur', 'amini', 'antur'], 4: ['iar', 'iaris', 'iatur', 'iamur', 'iamini', 'iantur'], 5: ['iar', 'iaris', 'iatur', 'iamur', 'iamini', 'iantur'] };
  const INF_A = { 1: 'are', 2: 'ere', 3: 'ere', 4: 'ire', 5: 'ere' };
  const INF_P = { 1: 'ari', 2: 'eri', 3: 'i', 4: 'iri', 5: 'i' };
  const IMP_A = { 1: ['a', 'ate'], 2: ['e', 'ete'], 3: ['e', 'ite'], 4: ['i', 'ite'], 5: ['e', 'ite'] };
  const IMP_P = { 1: ['are', 'amini'], 2: ['ere', 'emini'], 3: ['ere', 'imini'], 4: ['ire', 'imini'], 5: ['ere', 'imini'] };
  const PTC_S = { 1: 'ant', 2: 'ent', 3: 'ent', 4: 'ient', 5: 'ient' };
  const GDV_S = { 1: 'and', 2: 'end', 3: 'end', 4: 'iend', 5: 'iend' };

  const VTYPES = {
    v1: { c: 1 }, v2: { c: 2 }, v3: { c: 3 }, v4: { c: 4 }, v3i: { c: 5 },
    d1: { c: 1, dep: 1 }, d2: { c: 2, dep: 1 }, d3: { c: 3, dep: 1 }, d4: { c: 4, dep: 1 }, d3i: { c: 5, dep: 1 },
    s2: { c: 2, semi: 1 }, s3: { c: 3, semi: 1 }, s1: { c: 1, semi: 1 },
  };

  function rootOf(first, c, dep) {
    if (dep) return strip(first, c === 2 ? 'eor' : c >= 4 ? 'ior' : 'or');
    return strip(first, c === 2 ? 'eo' : c >= 4 ? 'io' : 'o');
  }
  const with2sVariant = (a) => {
    const r = a.slice();
    if (r[1] && r[1].endsWith('ris')) r[1] = [r[1], r[1].slice(0, -3) + 're'];
    return r;
  };

  function perfectActive(out, voice, Ps, extraContract) {
    Ps = arr(Ps);
    for (const P of Ps) {
      const ends = {
        perf: [P + 'i', P + 'isti', P + 'it', P + 'imus', P + 'istis', [P + 'erunt', P + 'ere']],
        plup: ['eram', 'eras', 'erat', 'eramus', 'eratis', 'erant'].map((e) => P + e),
        futp: ['ero', 'eris', 'erit', 'erimus', 'eritis', 'erint'].map((e) => P + e),
      };
      const sends = {
        perf: ['erim', 'eris', 'erit', 'erimus', 'eritis', 'erint'].map((e) => P + e),
        plup: ['issem', 'isses', 'isset', 'issemus', 'issetis', 'issent'].map((e) => P + e),
      };
      for (const t of ['perf', 'plup', 'futp']) PERS.forEach((pr, i) => add(out, 'v.ind.' + voice + '.' + t + '.' + pr, ends[t][i]));
      for (const t of ['perf', 'plup']) PERS.forEach((pr, i) => add(out, 'v.sub.' + voice + '.' + t + '.' + pr, sends[t][i]));
      add(out, 'v.inf.' + voice + '.perf', P + 'isse');
      // forme sincopate (amavisti -> amasti)
      if (/(av|ev|iv|ov)$/.test(P)) {
        const b = P.slice(0, -1);
        const isI = /iv$/.test(P);
        add(out, 'v.ind.' + voice + '.perf.2s', b + 'sti');
        add(out, 'v.ind.' + voice + '.perf.2p', b + 'stis');
        add(out, 'v.ind.' + voice + '.perf.3p', isI ? b + 'erunt' : b + 'runt');
        if (!isI) ['ram', 'ras', 'rat', 'ramus', 'ratis', 'rant'].forEach((e, i) => add(out, 'v.ind.' + voice + '.plup.' + PERS[i], b + e));
        ['ssem', 'sses', 'sset', 'ssemus', 'ssetis', 'ssent'].forEach((e, i) => add(out, 'v.sub.' + voice + '.plup.' + PERS[i], b + e));
        add(out, 'v.inf.' + voice + '.perf', b + 'sse');
      }
    }
  }

  function compoundPerfect(out, voice, ptcM, ptcP, ptcNeut) {
    const aux = {
      perf: ['sum', 'es', 'est', 'sumus', 'estis', 'sunt'],
      plup: ['eram', 'eras', 'erat', 'eramus', 'eratis', 'erant'],
      futp: ['ero', 'eris', 'erit', 'erimus', 'eritis', 'erunt'],
    };
    const saux = {
      perf: ['sim', 'sis', 'sit', 'simus', 'sitis', 'sint'],
      plup: ['essem', 'esses', 'esset', 'essemus', 'essetis', 'essent'],
    };
    const w = (i, a) => (i < 3 ? ptcM : ptcP) + ' ' + a;
    for (const t of ['perf', 'plup', 'futp']) PERS.forEach((pr, i) => add(out, 'v.ind.' + voice + '.' + t + '.' + pr, w(i, aux[t][i])));
    for (const t of ['perf', 'plup']) PERS.forEach((pr, i) => add(out, 'v.sub.' + voice + '.' + t + '.' + pr, w(i, saux[t][i])));
    add(out, 'v.inf.' + voice + '.perf', ptcNeut + ' esse');
  }

  function verbForms(L) {
    const out = [];
    const T = L.type;
    const first = L.p[0];
    const hasSup = L.sup != null;
    const intr = !!L.fl.intr;
    // ------ verbi irregolari: sistema del presente ------
    const irr = ['vsum', 'vpos', 'veo', 'vfer', 'vvolo', 'vnolo', 'vmalo', 'vfio', 'vperf'];
    let c = 3, dep = false, semi = false, R = '', pass = !intr;
    if (!irr.includes(T)) {
      const d = VTYPES[T];
      if (!d) throw new Error('tipo verbo sconosciuto ' + T);
      c = d.c; dep = !!d.dep; semi = !!d.semi;
      if (semi) pass = false;
      R = rootOf(first, c, dep);
    }
    const V = dep ? 'dep' : 'act';
    const Pst = (L.perf != null) ? L.perf : null; // radice del perfetto
    const ind = (voice, t, forms) => PERS.forEach((pr, i) => add(out, 'v.ind.' + voice + '.' + t + '.' + pr, forms[i]));
    const sub = (voice, t, forms) => PERS.forEach((pr, i) => add(out, 'v.sub.' + voice + '.' + t + '.' + pr, forms[i]));
    const cat = (R, ends) => ends.map((e) => R + e);

    if (!irr.includes(T)) {
      const actTables = !dep;
      const A = dep ? 'dep' : 'act';
      if (actTables) {
        ind('act', 'pres', cat(R, PRES_A[c]));
        ind('act', 'impf', cat(R + IMPF_M[c], P6));
        ind('act', 'fut', cat(R, FUT_A[c]));
        sub('act', 'pres', cat(R, SUBJ_A[c]));
        sub('act', 'impf', cat(R + INF_A[c], P6));
        add(out, 'v.imp.act.pres.2s', R + IMP_A[c][0]);
        add(out, 'v.imp.act.pres.2p', R + IMP_A[c][1]);
        add(out, 'v.inf.act.pres', R + INF_A[c]);
        // imperativi apocopati
        if (c === 3 && /(dic|duc)$/.test(R)) { out.pop(); out.pop(); out.pop(); add(out, 'v.imp.act.pres.2s', R); add(out, 'v.imp.act.pres.2p', R + 'ite'); add(out, 'v.inf.act.pres', R + 'ere'); }
        if (first === 'facio') add(out, 'v.imp.act.pres.2s', 'fac');
      }
      if ((pass && actTables) || dep) {
        const v = dep ? 'dep' : 'pass';
        ind(v, 'pres', with2sVariant(cat(R, PRES_P[c])));
        ind(v, 'impf', with2sVariant(cat(R + IMPF_M[c], PP6)));
        ind(v, 'fut', with2sVariant(cat(R, FUT_P[c])));
        sub(v, 'pres', with2sVariant(cat(R, SUBJ_P[c])));
        sub(v, 'impf', with2sVariant(cat(R + INF_A[c], PP6)));
        add(out, 'v.imp.' + v + '.pres.2s', R + IMP_P[c][0]);
        add(out, 'v.imp.' + v + '.pres.2p', R + IMP_P[c][1]);
        add(out, 'v.inf.' + v + '.pres', R + INF_P[c]);
      }
    }

    // ------ irregolari ------
    const addPre = (pre, s) => (pre === 'pro' && s[0] === 'e' ? 'prod' + s : pre + s);
    if (T === 'vsum') {
      const pre = strip(first, 'sum');
      const f = (a) => a.map((s) => addPre(pre, s));
      ind('act', 'pres', f(['sum', 'es', 'est', 'sumus', 'estis', 'sunt']));
      ind('act', 'impf', f(['eram', 'eras', 'erat', 'eramus', 'eratis', 'erant']));
      ind('act', 'fut', f(['ero', 'eris', 'erit', 'erimus', 'eritis', 'erunt']));
      sub('act', 'pres', f(['sim', 'sis', 'sit', 'simus', 'sitis', 'sint']));
      sub('act', 'impf', f(['essem', 'esses', 'esset', 'essemus', 'essetis', 'essent']));
      add(out, 'v.imp.act.pres.2s', addPre(pre, 'es'));
      add(out, 'v.imp.act.pres.2p', addPre(pre, 'este'));
      add(out, 'v.inf.act.pres', addPre(pre, 'esse'));
      if (pre === '') {
        add(out, 'v.inf.act.fut', ['fore', 'futurus esse']);
        pushAdj(out, 'v.ptc.fut', a12Table('futurus', 'futur'));
      } else if (pre !== 'pro') {
        add(out, 'v.inf.act.fut', pre + 'fore');
      }
    } else if (T === 'vpos') {
      ind('act', 'pres', ['possum', 'potes', 'potest', 'possumus', 'potestis', 'possunt']);
      ind('act', 'impf', ['poteram', 'poteras', 'poterat', 'poteramus', 'poteratis', 'poterant']);
      ind('act', 'fut', ['potero', 'poteris', 'poterit', 'poterimus', 'poteritis', 'poterunt']);
      sub('act', 'pres', ['possim', 'possis', 'possit', 'possimus', 'possitis', 'possint']);
      sub('act', 'impf', ['possem', 'posses', 'posset', 'possemus', 'possetis', 'possent']);
      add(out, 'v.inf.act.pres', 'posse');
      pushAdj(out, 'v.ptc.pres', a3Table('a3-1', { S: 'potent', nom: 'potens', abl: ['potente', 'potenti'] }));
    } else if (T === 'veo') {
      const pre = strip(first, 'eo');
      ind('act', 'pres', cat(pre, ['eo', 'is', 'it', 'imus', 'itis', 'eunt']));
      ind('act', 'impf', cat(pre, ['ibam', 'ibas', 'ibat', 'ibamus', 'ibatis', 'ibant']));
      ind('act', 'fut', cat(pre, ['ibo', 'ibis', 'ibit', 'ibimus', 'ibitis', 'ibunt']));
      sub('act', 'pres', cat(pre, ['eam', 'eas', 'eat', 'eamus', 'eatis', 'eant']));
      sub('act', 'impf', cat(pre + 'ire', P6));
      add(out, 'v.imp.act.pres.2s', pre + 'i');
      add(out, 'v.imp.act.pres.2p', pre + 'ite');
      add(out, 'v.inf.act.pres', pre + 'ire');
      pushAdj(out, 'v.ptc.pres', a3Table('a3-1', { S: pre + 'eunt', nom: pre + 'iens', abl: [pre + 'eunte', pre + 'eunti'] }));
      ['i', 'o', 'um', 'o'].forEach((e, i) => add(out, 'v.ger.' + ['gen', 'dat', 'acc', 'abl'][i], pre + 'eund' + e));
    } else if (T === 'vfer') {
      const pre = strip(first, 'fero');
      const Rf = pre + 'fer';
      ind('act', 'pres', cat(Rf, ['o', 's', 't', 'imus', 'tis', 'unt']));
      ind('act', 'impf', cat(Rf + 'eba', P6));
      ind('act', 'fut', cat(Rf, FUT_A[3]));
      sub('act', 'pres', cat(Rf, SUBJ_A[3]));
      sub('act', 'impf', cat(pre + 'ferre', P6));
      add(out, 'v.imp.act.pres.2s', Rf);
      add(out, 'v.imp.act.pres.2p', Rf + 'te');
      add(out, 'v.inf.act.pres', pre + 'ferre');
      ind('pass', 'pres', cat(Rf, ['or', ['ris', 're'], 'tur', 'imur', 'imini', 'untur']).map((x, i) => (i === 1 ? [Rf + 'ris', Rf + 're'] : x)));
      ind('pass', 'impf', with2sVariant(cat(Rf + 'eba', PP6)));
      ind('pass', 'fut', with2sVariant(cat(Rf, FUT_P[3])));
      sub('pass', 'pres', with2sVariant(cat(Rf, SUBJ_P[3])));
      sub('pass', 'impf', with2sVariant(cat(pre + 'ferre', PP6)));
      add(out, 'v.imp.pass.pres.2s', Rf + 're');
      add(out, 'v.imp.pass.pres.2p', Rf + 'imini');
      add(out, 'v.inf.pass.pres', pre + 'ferri');
      R = Rf; c = 3;
    } else if (T === 'vvolo') {
      ind('act', 'pres', ['volo', 'vis', 'vult', 'volumus', 'vultis', 'volunt']);
      ind('act', 'impf', ['volebam', 'volebas', 'volebat', 'volebamus', 'volebatis', 'volebant']);
      ind('act', 'fut', ['volam', 'voles', 'volet', 'volemus', 'voletis', 'volent']);
      sub('act', 'pres', ['velim', 'velis', 'velit', 'velimus', 'velitis', 'velint']);
      sub('act', 'impf', ['vellem', 'velles', 'vellet', 'vellemus', 'velletis', 'vellent']);
      add(out, 'v.inf.act.pres', 'velle');
      pushAdj(out, 'v.ptc.pres', a3Table('a3-1', { S: 'volent', nom: 'volens', abl: ['volente', 'volenti'] }));
    } else if (T === 'vnolo') {
      ind('act', 'pres', ['nolo', 'non vis', 'non vult', 'nolumus', 'non vultis', 'nolunt']);
      ind('act', 'impf', ['nolebam', 'nolebas', 'nolebat', 'nolebamus', 'nolebatis', 'nolebant']);
      ind('act', 'fut', ['nolam', 'noles', 'nolet', 'nolemus', 'noletis', 'nolent']);
      sub('act', 'pres', ['nolim', 'nolis', 'nolit', 'nolimus', 'nolitis', 'nolint']);
      sub('act', 'impf', ['nollem', 'nolles', 'nollet', 'nollemus', 'nolletis', 'nollent']);
      add(out, 'v.imp.act.pres.2s', 'noli');
      add(out, 'v.imp.act.pres.2p', 'nolite');
      add(out, 'v.inf.act.pres', 'nolle');
      pushAdj(out, 'v.ptc.pres', a3Table('a3-1', { S: 'nolent', nom: 'nolens', abl: ['nolente', 'nolenti'] }));
    } else if (T === 'vmalo') {
      ind('act', 'pres', ['malo', 'mavis', 'mavult', 'malumus', 'mavultis', 'malunt']);
      ind('act', 'impf', ['malebam', 'malebas', 'malebat', 'malebamus', 'malebatis', 'malebant']);
      ind('act', 'fut', ['malam', 'males', 'malet', 'malemus', 'maletis', 'malent']);
      sub('act', 'pres', ['malim', 'malis', 'malit', 'malimus', 'malitis', 'malint']);
      sub('act', 'impf', ['mallem', 'malles', 'mallet', 'mallemus', 'malletis', 'mallent']);
      add(out, 'v.inf.act.pres', 'malle');
    } else if (T === 'vfio') {
      ind('act', 'pres', ['fio', 'fis', 'fit', 'fimus', 'fitis', 'fiunt']);
      ind('act', 'impf', ['fiebam', 'fiebas', 'fiebat', 'fiebamus', 'fiebatis', 'fiebant']);
      ind('act', 'fut', ['fiam', 'fies', 'fiet', 'fiemus', 'fietis', 'fient']);
      sub('act', 'pres', ['fiam', 'fias', 'fiat', 'fiamus', 'fiatis', 'fiant']);
      sub('act', 'impf', ['fierem', 'fieres', 'fieret', 'fieremus', 'fieretis', 'fierent']);
      add(out, 'v.imp.act.pres.2s', 'fi');
      add(out, 'v.imp.act.pres.2p', 'fite');
      add(out, 'v.inf.act.pres', 'fieri');
      compoundPerfect(out, 'act', 'factus', 'facti', 'factum');
      pushAdj(out, 'v.ptc.perf', a12Table('factus', 'fact'));
      pushAdj(out, 'v.gdv', a12Table('faciendus', 'faciend'));
    } else if (T === 'vperf') {
      const P = strip(first, 'i');
      perfectActive(out, 'act', P);
      if (first === 'memini') { add(out, 'v.imp.act.pres.2s', 'memento'); add(out, 'v.imp.act.pres.2p', 'mementote'); }
    }

    // ------ perfetto attivo (verbi non deponenti) ------
    if (!irr.includes(T) || ['vsum', 'vpos', 'veo', 'vfer', 'vvolo', 'vnolo', 'vmalo'].includes(T)) {
      if (!dep && !semi && Pst) {
        let stems = [Pst];
        if (T === 'veo') stems = [Pst, Pst + 'v'];
        perfectActive(out, 'act', stems);
      }
    }
    // ------ perfetto composto ------
    let supS = hasSup ? strip(L.sup, 'um') : null;
    if (dep || semi) {
      const ptc = L.ptcDep; // es. 'locutus'
      if (ptc) {
        const S = strip(ptc, 'us');
        compoundPerfect(out, dep ? 'dep' : 'act', ptc, S + 'i', S + 'um');
        pushAdj(out, 'v.ptc.perf', a12Table(ptc, S));
        add(out, 'v.inf.' + (dep ? 'dep' : 'act') + '.fut', S + 'urum esse');
        pushAdj(out, 'v.ptc.fut', a12Table(S + 'urus', S + 'ur'));
        supS = S;
      }
    } else if (hasSup && !irr.includes(T) || (hasSup && ['vfer', 'veo'].includes(T))) {
      if (!intr) {
        compoundPerfect(out, 'pass', supS + 'us', supS + 'i', supS + 'um');
        pushAdj(out, 'v.ptc.perf', a12Table(supS + 'us', supS));
      }
      add(out, 'v.inf.act.fut', supS + 'urum esse');
      pushAdj(out, 'v.ptc.fut', a12Table(supS + 'urus', supS + 'ur'));
      add(out, 'v.sup.acc', supS + 'um');
      add(out, 'v.sup.abl', supS + 'u');
    }
    // ------ participi presenti e gerundi ------
    if (!irr.includes(T) || T === 'vfer') {
      const Sp = R + PTC_S[c];
      pushAdj(out, 'v.ptc.pres', a3Table('a3-1', { S: Sp, nom: Sp.slice(0, -1) + 's', abl: [Sp + 'e', Sp + 'i'] }));
      const g = R + GDV_S[c];
      ['i', 'o', 'um', 'o'].forEach((e, i) => add(out, 'v.ger.' + ['gen', 'dat', 'acc', 'abl'][i], g + e));
      if (!intr || dep) pushAdj(out, 'v.gdv', a12Table(g + 'us', g));
    }
    return out;
  }

  // ---------- indeclinabili ----------
  function indeclForms(L) {
    return [['i.' + L.p[0], L.p[0]]];
  }

  // ---------- generazione per lemma ----------
  const NOUNT = ['n1', 'n2', 'n3', 'n3i', 'n4', 'n5'];
  function generate(L) {
    const t = L.type;
    if (NOUNT.includes(t)) {
      const T = nounTable(t, L.p[0], L.p[1], L.p[2], L.fl);
      const out = [];
      for (const num of ['s', 'p']) T[num].forEach((f, i) => add(out, 'n.' + num + '.' + CASES[i], f));
      return out;
    }
    if (t === 'xn' || t === 'xp') return explicitNoun(L);
    if (t === 'x3') return explicitAdj(L);
    if (t === 'a12' || t === 'a12p' || t === 'a3' || t === 'a3c') return adjectiveForms(L);
    if (t === 'i') return indeclForms(L);
    return verbForms(L);
  }

  // ---------- lessico ----------
  let lemmas = [];
  let index = new Map();
  let disp = new Map();

  function parseLine(line, id) {
    const bar = line.indexOf('|');
    const bar2 = line.indexOf('|', bar + 1);
    const type = line.slice(0, bar).trim();
    const parts = line.slice(bar + 1, bar2).split(',').map((s) => s.trim()).filter((s) => s.length);
    const tail = line.slice(bar2 + 1).split('|');
    const it = tail[0].trim();
    const L = { id, type, p: parts.slice(), it, fl: {}, uso: tail[1] ? tail[1].split(' ¦ ').map((x) => x.trim()).filter(Boolean) : [] };
    // opzioni "chiave=valore" e flag in coda
    const core = [];
    for (const x of parts) {
      let m;
      if ((m = /^(cmp|sup|adv|voc|perf)=(.*)$/.exec(x))) {
        if (m[1] === 'perf') L.perf = m[2];
        else L.fl[m[1]] = m[2];
      } else if (x === '-' && /^a/.test(type)) L.fl.deg = false;
      else if (x === '+') L.fl.plus = true;
      else if (x === 'sg' || x === 'pl' || x === 'abus' || x === 'intr') L.fl[x] = true;
      else core.push(x);
    }
    L.p = core;
    const t = type;
    if (/^[vds][0-9]/.test(t) && t !== 'vsum') {
      // verbi regolari: p = [1s, inf, perf, sup] oppure [1s, inf, "locutus sum"]
      if (VTYPES[t] && (VTYPES[t].dep || VTYPES[t].semi)) {
        const pp = core[2] || '';
        L.ptcDep = pp.replace(/\s+sum$/, '');
      } else {
        L.perf = core[2] && core[2] !== '-' ? strip(core[2], 'i') : null;
        L.sup = core[3] && core[3] !== '-' ? core[3] : null;
      }
    } else if (/^v(sum|pos|eo|fer|vol|nol|mal|fio|perf)/.test(t) || t === 'vsum') {
      L.perf = core[2] && core[2] !== '-' ? strip(core[2], 'i') : null;
      L.sup = core[3] && core[3] !== '-' ? core[3] : null;
      if (t === 'vperf') L.perf = null;
    }
    if (t === 'a3') {
      L.base = { kind: core.length === 3 ? 'a3-3' : core[1] && core[1].endsWith('e') && core[0].endsWith('is') ? 'a3-2' : 'a3-1' };
    }
    return L;
  }

  function posOf(L) {
    const t = L.type;
    if (NOUNT.includes(t) || t === 'xn') return 'n';
    if (t === 'xp') return 'p';
    if (t === 'x3') return /^pron/.test(L.p[1] || 'pron.') ? 'p' : 'm';
    if (/^a/.test(t)) return 'a';
    if (t === 'i') return 'm';
    return 'v';
  }

  function load(text) {
    lemmas = [];
    index = new Map();
    disp = new Map();
    const lines = text.split('\n');
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line[0] === '#') continue;
      const L = parseLine(line, lemmas.length);
      L.pos = posOf(L);
      lemmas.push(L);
    }
    for (const L of lemmas) {
      let forms;
      try { forms = generate(L); } catch (e) { throw new Error('Errore in "' + L.type + '|' + L.p.join(',') + '": ' + e.message); }
      L.n = forms.length;
      const seen = new Set();
      for (const [tag, f] of forms) {
        const k = norm(f);
        if (!k) continue;
        const key = L.id + '|' + tag + '|' + k;
        if (seen.has(key)) continue;
        seen.add(key);
        let e = index.get(k);
        if (!e) { e = []; index.set(k, e); disp.set(k, f); }
        e.push(L.id + '|' + tag);
      }
    }
    return lemmas.length;
  }

  function paradigm(L) {
    if (L._par) return L._par;
    const m = new Map();
    for (const [tag, f] of generate(L)) {
      if (!m.has(tag)) m.set(tag, []);
      const a = m.get(tag);
      if (!a.includes(f)) a.push(f);
    }
    L._par = m;
    return m;
  }

  // ---------- etichette in italiano ----------
  const CN = { nom: 'nominativo', gen: 'genitivo', dat: 'dativo', acc: 'accusativo', abl: 'ablativo', voc: 'vocativo' };
  const NN = { s: 'singolare', p: 'plurale' };
  const GN = { m: 'maschile', f: 'femminile', n: 'neutro' };
  const TN = { pres: 'presente', impf: 'imperfetto', fut: 'futuro', perf: 'perfetto', plup: 'piuccheperfetto', futp: 'futuro anteriore' };
  const MN = { ind: 'indicativo', sub: 'congiuntivo', imp: 'imperativo', inf: 'infinito' };
  const VN = { act: 'attivo', pass: 'passivo', dep: 'deponente' };
  const PN = { '1s': '1ª sing.', '2s': '2ª sing.', '3s': '3ª sing.', '1p': '1ª plur.', '2p': '2ª plur.', '3p': '3ª plur.' };
  const DEG = { pos: '', cmp: 'comparativo, ', sup: 'superlativo, ' };
  const PTN = { pres: 'participio presente', perf: 'participio perfetto', fut: 'participio futuro' };

  function describe(tags) {
    const groups = new Map(); // chiave -> {head, cases:Set, gens:Set, num}
    const labels = [];
    const grp = (key, head, num, c, g) => {
      let o = groups.get(key);
      if (!o) { o = { head, num, cases: [], gens: [] }; groups.set(key, o); labels.push(o); }
      if (!o.cases.includes(c)) o.cases.push(c);
      if (g && !o.gens.includes(g)) o.gens.push(g);
    };
    for (const tag of tags) {
      const p = tag.split('.');
      if (p[0] === 'n') grp('n' + p[1], '', p[1], p[2], null);
      else if (p[0] === 'a') {
        if (p[1] === 'adv') labels.push('avverbio' + (p[2] === 'cmp' ? ' comparativo' : p[2] === 'sup' ? ' superlativo' : ''));
        else grp('a' + p[1] + p[3], DEG[p[1]], p[3], p[4], p[2]);
      } else if (p[0] === 'i') labels.push('invariabile');
      else if (p[0] === 'v') {
        const k = p[1];
        if (k === 'ind' || k === 'sub') labels.push(MN[k] + ' ' + TN[p[3]] + ' ' + VN[p[2]] + ', ' + PN[p[4]]);
        else if (k === 'imp') labels.push('imperativo ' + VN[p[2]] + ', ' + PN[p[4]]);
        else if (k === 'inf') labels.push('infinito ' + TN[p[3]] + ' ' + VN[p[2]]);
        else if (k === 'ptc') grp('ptc' + p[2] + p[4], PTN[p[2]] + ', ', p[4], p[5], p[3]);
        else if (k === 'gdv') grp('gdv' + p[3], 'gerundivo, ', p[3], p[4], p[2]);
        else if (k === 'ger') labels.push('gerundio, ' + CN[p[2]]);
        else if (k === 'sup') labels.push('supino, ' + CN[p[2]]);
      }
    }
    return labels.map((o) => {
      if (typeof o === 'string') return o;
      const cs = o.cases.map((c) => CN[c]).join('/');
      const gs = o.gens.length && o.gens.length < 3 ? ' (' + o.gens.map((g) => GN[g]).join('/') + ')' : '';
      return o.head + cs + ' ' + NN[o.num] + gs;
    });
  }

  // ---------- intestazioni ----------
  const DECL = { n1: '1ª declinazione', n2: '2ª declinazione', n3: '3ª declinazione', n3i: '3ª declinazione', n4: '4ª declinazione', n5: '5ª declinazione' };
  const CONJ = { v1: '1ª coniugazione', v2: '2ª coniugazione', v3: '3ª coniugazione', v4: '4ª coniugazione', v3i: '3ª coniugazione (mista)', d1: 'deponente, 1ª', d2: 'deponente, 2ª', d3: 'deponente, 3ª', d4: 'deponente, 4ª', d3i: 'deponente, 3ª mista', s1: 'semideponente', s2: 'semideponente, 2ª', s3: 'semideponente, 3ª' };
  const GL = { m: 'm.', f: 'f.', n: 'n.', 'c': 'm./f.' };
  function header(L) {
    const t = L.type;
    const o = { title: L.p[0], sub: '', cls: L.pos, chip: '', note: '' };
    if (NOUNT.includes(t)) {
      o.chip = 'sost.';
      o.sub = (L.fl.pl ? L.p[1] : L.p[1]) + ' · ' + (GL[L.p[2]] || '') + (L.fl.pl ? ' plur.' : '');
      o.note = DECL[t];
    } else if (t === 'xn') {
      o.chip = 'sost.';
      const gm = { deus: 'm.', vis: 'f.', bos: 'm./f.', domus: 'f.', locus: 'm.', iuppiter: 'm.', nemo: 'm./f.' };
      o.sub = (XN[L.p[0].toLowerCase()][1] !== '-' ? XN[L.p[0].toLowerCase()][1].split('/')[0] + ' · ' : '') + (gm[L.p[0].toLowerCase()] || '');
      o.note = 'irregolare';
    } else if (t === 'xp') {
      o.chip = 'pron.'; o.note = 'pronome personale';
      const r = XN[L.p[0].toLowerCase()];
      o.sub = r[1] !== '-' ? r[1].split('/')[0] : r[7].split('/')[0];
    } else if (t === 'x3') {
      o.chip = L.p[1] || 'pron.';
      o.note = /^pron/.test(L.p[1] || 'pron.') ? 'pronome' : 'numerale';
      const r = X3[L.p[0].toLowerCase()];
      o.sub = r[0].split(' ').map((x) => x.split('/')[0]).filter((x) => x !== '-' && x !== L.p[0]).join(', ');
    } else if (t === 'a12' || t === 'a12p') {
      o.chip = 'agg.'; o.sub = L.p[1] + ', ' + L.p[2]; o.note = t === 'a12p' ? '1ª classe, pronominale' : '1ª classe';
    } else if (t === 'a3') {
      o.chip = 'agg.';
      o.sub = L.base.kind === 'a3-3' ? L.p[1] + ', ' + L.p[2] : L.base.kind === 'a3-2' ? L.p[1] : L.p[1];
      o.note = '2ª classe';
    } else if (t === 'a3c') {
      o.chip = 'agg.'; o.sub = L.p[1]; o.note = '2ª classe';
    } else if (t === 'i') {
      o.chip = L.p[1] || 'avv.'; o.sub = ''; o.note = 'invariabile';
      o.cls = 'm';
    } else {
      o.chip = 'verbo';
      const name = { vsum: 'sum', vpos: 'irregolare', veo: 'irregolare', vfer: 'irregolare', vvolo: 'irregolare', vnolo: 'irregolare', vmalo: 'irregolare', vfio: 'irregolare', vperf: 'difettivo' }[t];
      o.note = name || CONJ[t];
      o.sub = L.p.slice(1).join(', ');
    }
    return o;
  }

  // ---------- ricerca ----------
  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let min = i;
      for (let j = 1; j <= b.length; j++) {
        const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        cur[j] = v;
        if (v < min) min = v;
      }
      if (min > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  function collect(key) {
    const e = index.get(key);
    if (!e) return null;
    const by = new Map();
    for (const s of e) {
      const i = s.indexOf('|');
      const id = +s.slice(0, i);
      const tag = s.slice(i + 1);
      if (!by.has(id)) by.set(id, []);
      by.get(id).push(tag);
    }
    return Array.from(by, ([id, tags]) => ({ lemma: lemmas[id], tags }));
  }

  function lookup(q) {
    const key = norm(q);
    const res = { key, enc: null, hits: [], sugg: [] };
    if (!key) return res;
    let h = collect(key);
    if (h) { res.hits = h; res.form = disp.get(key); return res; }
    for (const enc of ['que', 'ne', 've']) {
      if (key.length > enc.length + 1 && key.endsWith(enc)) {
        const k2 = key.slice(0, -enc.length);
        h = collect(k2);
        if (h) { res.hits = h; res.enc = enc; res.form = disp.get(k2); res.key = k2; return res; }
      }
    }
    // suggerimenti
    const max = key.length > 6 ? 2 : 1;
    const cand = [];
    for (const k of index.keys()) {
      const d = lev(key, k, max);
      if (d <= max) cand.push([d, k]);
    }
    cand.sort((a, b) => a[0] - b[0] || a[1].length - b[1].length);
    const seenL = new Set();
    for (const [, k] of cand) {
      const ids = index.get(k).map((s) => s.split('|')[0]).join(',');
      if (seenL.has(disp.get(k))) continue;
      seenL.add(disp.get(k));
      res.sugg.push(disp.get(k));
      if (res.sugg.length >= 6) break;
    }
    return res;
  }

  return {
    norm, load, lookup, paradigm, describe, header,
    get lemmas() { return lemmas; },
    get size() { return index.size; },
    generate, CASES, GENS, CN, NN, GN, TN, PN,
  };
})();
if (typeof module !== 'undefined') module.exports = Latin;

    PERS.forEach((p, i) => { h += '<tr><td>' + PRON[i] + '</td>' + vs.map((v) => cell(par, 'v.' + mood + '.' + v + '.' + tense + '.' + p, qk)).join('') + '</tr>'; });
    return h + '</table></div></div>';
  }
  function participle(par, key, title, qk) {

    const nomN = (par.get(key + '.n.s.nom') || []).join(' / ');
    const open = [...par.keys()].some((k) => k.startsWith(key + '.') && par.get(k).some((x) => norm(x) === qk));
    return '<details' + (open ? ' open' : '') + '><summary><span class="sum-l">' + title + '</span><span>' + esc(nomM) + (nomN && nomN !== nomM ? ', ' + esc(nomN) : '') + '</span></summary><div>' + adjTables(par, key, qk) + '</div></details>';
  }
  function verbBlock(L, par, qk, tags) {
    const items = [];
    const iv = voicesOf(par, 'ind'), sv = voicesOf(par, 'sub');
    items.push({ label: 'Indicativo', html: '<div class="tgrid">' + ['pres', 'impf', 'fut', 'perf', 'plup', 'futp'].map((t) => tenseTable(par, 'ind', t, iv, qk)).join('') + '</div>' });
    items.push({ label: 'Congiuntivo', html: '<div class="tgrid">' + ['pres', 'impf', 'perf', 'plup'].map((t) => tenseTable(par, 'sub', t, sv, qk)).join('') + '</div>' });
    // altre forme
    const allV = ['act', 'pass', 'dep'];
    let o = '<div class="stack">';
    const impV = allV.filter((v) => par.has('v.imp.' + v + '.pres.2s'));
    if (impV.length) {
      o += '<div><div class="cap">Imperativo</div><div class="box"><table class="tbl"><tr><th></th>' + impV.map((v) => '<th>' + VOICE_LBL[v] + '</th>').join('') + '</tr>' +
        ['2s', '2p'].map((p) => '<tr><td>' + (p === '2s' ? 'tu' : 'voi') + '</td>' + impV.map((v) => cell(par, 'v.imp.' + v + '.pres.' + p, qk)).join('') + '</tr>').join('') + '</table></div></div>';
    }
    const infV = allV.filter((v) => ['pres', 'perf', 'fut'].some((t) => par.has('v.inf.' + v + '.' + t)));
    if (infV.length) {
      o += '<div><div class="cap">Infinito</div><div class="box"><table class="tbl"><tr><th></th>' + infV.map((v) => '<th>' + VOICE_LBL[v] + '</th>').join('') + '</tr>' +
        ['pres', 'perf', 'fut'].filter((t) => infV.some((v) => par.has('v.inf.' + v + '.' + t))).map((t) => '<tr><td>' + TENSE_LBL[t] + '</td>' + infV.map((v) => cell(par, 'v.inf.' + v + '.' + t, qk)).join('') + '</tr>').join('') + '</table></div></div>';
    }
    o += participle(par, 'v.ptc.pres', 'Participio presente', qk) + participle(par, 'v.ptc.perf', 'Participio perfetto', qk) + participle(par, 'v.ptc.fut', 'Participio futuro', qk) + participle(par, 'v.gdv', 'Gerundivo', qk);
    const ger = kvRows(par, [['Gen.', 'v.ger.gen'], ['Dat.', 'v.ger.dat'], ['Acc.', 'v.ger.acc'], ['Abl.', 'v.ger.abl']], qk);
    if (par.has('v.ger.gen')) o += '<div><div class="cap">Gerundio</div>' + ger + '</div>';
    if (par.has('v.sup.acc')) o += '<div><div class="cap">Supino</div>' + kvRows(par, [['Acc.', 'v.sup.acc'], ['Abl.', 'v.sup.abl']], qk) + '</div>';
    items.push({ label: 'Altre forme', html: o + '</div>' });

    if (tags.some((t) => t.startsWith('v.sub'))) act = 1;
    else if (tags.some((t) => !t.startsWith('v.ind'))) act = 2;

  }

  // ---------- scheda ----------
  const olivetti = (w) => 'https://www.dizionario-latino.com/dizionario-latino-italiano.php?parola=' + encodeURIComponent(w.toLowerCase());
  function usesHtml(L) {
    if (!L.uso || !L.uso.length) return '';
    return '<div><div class="cap">Introduce</div><div class="uses">' + L.uso.map((u) => {
      const [lab, ex] = u.split(' :: ');
      const [la, it] = (ex || '').split(' = ');
      return '<div class="use"><div class="u-l">' + esc(lab) + '</div>' + (ex ? '<div class="u-e"><i>' + esc(la) + '</i>' + (it ? ' = ' + esc(it) : '') + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';
  }
  function card(hit, res, open) {

    let body = '';
    if (L.pos === 'n') body = nounTable(par, qk);

    else if (L.pos === 'v') body = verbBlock(L, par, qk, hit.tags);
    else if (L.pos === 'p') body = nounTable(par, qk);

  }

  // ---------- ricerca ----------
  const out = $('#out'), input = $('#q'), clearBtn = $('#clear');
  function run(q) {
    const tokens = q.split(/\s+/).filter(Boolean);
    if (tokens.length > 1) {
      const joined = Latin.lookup(q);
      if (joined.hits.length) return [joined];
      return tokens.map((t) => Latin.lookup(t));
    }
    return [Latin.lookup(q)];
  }
  function home() {
    out.innerHTML = '<div class="panel-box try"><span class="lbl">Prova</span><div class="chips">' +
      [['amavissent', 'pos-v'], ['regis', 'pos-n'], ['optimorum', 'pos-a'], ['sequuntur', 'pos-v'], ['mihi', 'pos-p'], ['eorum', 'pos-p']]
        .map((x) => '<button class="chip ' + x[1] + '" type="button" data-q="' + x[0] + '">' + x[0] + '</button>').join('') + '</div></div>';
    setHist(true);
  }
  function search(q) {
    if (document.body.dataset.plan === 'free' && q.trim()) { window.LexAd(() => searchNow(q)); return; }
    searchNow(q);
  }
  function searchNow(q) {
    q = q.trim();
    input.value = q;
    clearBtn.hidden = !q;
    if (!q) { home(); return; }
    const results = run(q);
    let html = '';
    const total = results.reduce((n, r) => n + r.hits.length, 0);
    results.forEach((res, i) => {
      const label = results.length > 1 ? q.split(/\s+/)[i] : q;
      if (res.hits.length) html += res.hits.map((h) => card(h, res, total === 1)).join('');
      else html += noResult(label, res);

    out.innerHTML = (document.body.dataset.plan === 'free' && window.LexNative ? window.LexNative() : '') + html;
    if (results.length === 1 && results[0].hits.length) pushHist(results[0]);
    setHist(false);
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-q]');
    if (c) { search(c.dataset.q); return; }

  });

  input.addEventListener('input', () => { clearBtn.hidden = !input.value; });
  clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.hidden = true; home(); input.focus(); });

  setTimeout(() => {
    const n = Latin.load(LEXICON);
    $('#count').textContent = n + ' voci · ' + Latin.size.toLocaleString('it-IT') + ' forme';
    renderHist();
    home();
    input.disabled = false;
  }, 30);
})();
</script>
